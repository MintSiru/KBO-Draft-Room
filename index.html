  }

  const OUT_OF_BASEBALL = {
    released: ['방출 · 무소속', '무소속이라 이 해의 기록이 없습니다.'],
    retired: ['은퇴', '은퇴해 기록이 없습니다.'],
  };

  /**
   * Plays season `yearIndex` for every signed player: service changes, national team, each player's
   * season, standings and awards, then the offseason. `orders` are the user's service choices.
   */
  function advance(career, picks, byId, seed, orders = {}, plans = {}, userTeamId = null) {
    const yearIndex = career.years.length;
    if (yearIndex >= SEASONS) throw Error(SEASONS + '시즌이 모두 끝났습니다.');
    const year = D.bio.ENTRY_YEAR + yearIndex,
      clubPlans = S.plans(seed, TEAMS),
      rankings = {};
    let preseason = [];
    if (yearIndex) {
      const moves = [...serviceStep(career, byId, seed, yearIndex, orders), ...planStep(career, byId, seed, yearIndex, plans, userTeamId)];
      career.years[yearIndex - 1].events.push(...moves);
      career.events.push(...moves);
    } else {
      preseason = planStep(career, byId, seed, 0, plans, userTeamId);
      career.events.push(...preseason);
    }
    const international = internationalStep(career, byId, seed, yearIndex);
    for (const t of TEAMS)
      for (const role of Object.keys(D.ROLES)) {
        rankings[t.id + '-' + role] = Object.values(career.players)
          .filter((s) => canPlay(s) && s.currentTeamId === t.id && s.role === role)
          .sort(
            (a, b) =>
              b.ability + (b.route === 'regular' ? 5 : 0) - (a.ability + (a.route === 'regular' ? 5 : 0)) ||
              a.playerId.localeCompare(b.playerId),
          )
          .map((s) => s.playerId);
      }
    const records = picks.map((sel) => {
      const p = byId[sel.playerId],
        state = career.players[p.id];
      if (state.status !== 'active') {
        const [routeLabel, note] = OUT_OF_BASEBALL[state.status];
        return {
          playerId: p.id,
          label: sel.label,
          year,
          teamId: null,
          age: ageIn(p, yearIndex),
          route: state.status,
          routeLabel,
          role: state.role,
          stats: M.emptyStats(viewOf(p, state)),
          futures: M.emptyStats(viewOf(p, state)),
          growth: 0,
          growthLabel: '프로 기록 없음',
          developmentNote: '이전 기록만 남아 있습니다.',
          note,
          limited: false,
          contribution: 0,
          war: 0,
          planScore: null,
          target: '경력 보존',
          scoutReady: state.scoutReady,
          scoutFV: state.scoutFV,
        };
      }
      const t = { ...byTeam[state.currentTeamId], ...clubPlans[state.currentTeamId] },
        view = viewOf(p, state);
      let rec;
      if (state.service) rec = M.serviceSeason(view, sel, { seed }, t, state, yearIndex, state.service.type, state.focus);
      else {
        const rank = rankings[t.id + '-' + state.role].indexOf(p.id),
          capacity = T.roles.cohortCapacity[state.role],
          twoWay = state.twoWay,
          scale = (twoWay ? T.twoWay.growthScale : 1) * (state.adapting ? T.positions.adaptGrowth : 1);
        const common = {
          absentDays: state.absentDays || 0,
          growthBoost: state.currentTeamId === sel.teamId && yearIndex < T.contracts.growthBoost.seasons ? career.boosts?.[sel.teamId] || 0 : 0,
          focus: state.focus,
          growthScale: scale,
          impactShift: state.adapting ? T.positions.adaptImpact : 0,
        };
        rec = M.simulatePlayer(view, sel, { seed }, t, fit(view, t), state, yearIndex, {
          ...common,
          // Development-contract players cannot be regulars in their first season.
          blockedRegular: rank >= capacity || (sel.dev && yearIndex === 0),
          closer: state.role === 'RP' && rank === 0 && state.ability >= T.roles.closer.minAbility && yearIndex >= T.roles.closer.fromYear,
        });
        if (twoWay) {
          // The second side: part-time first-team work, same injury, its own growth and scouting.
          const o = state.other,
            view2 = { ...p, ...sideBase(p, o.side), role: o.role, potentialTools: o.potential, upside: G.overall(o.potential, o.role) };
          const rec2 = M.simulatePlayer(view2, sel, { seed: seed + '-second' }, t, fit(view2, t), o, yearIndex, {
            ...common,
            focus: 'balanced',
            health: { limited: rec.limited, daysLost: rec.daysLost },
            blockedRegular: true,
            gamesScale: T.twoWay.secondaryGames,
          });
          for (const k of SIDE_KEYS) if (k in rec2.endState) o[k] = rec2.endState[k];
          rec.second = { role: o.role, routeLabel: rec2.routeLabel, stats: rec2.stats, futures: rec2.futures, war: rec2.war, scoutReady: rec2.scoutReady, scoutFV: rec2.scoutFV, velocity: rec2.velocity };
          rec.war = round(rec.war + rec2.war, 1);
          rec.contribution = round(rec.contribution + rec2.contribution);
        }
      }
      Object.assign(state, rec.endState);
      state.adapting = false;
      if (rec.route !== 'service') {
        state.debuted = state.debuted || rec.stats.games > 0;
        state.noGameStreak = rec.stats.games > 0 ? 0 : (state.noGameStreak || 0) + 1;
        state.rehabStreak = rec.route === 'rehab' ? (state.rehabStreak || 0) + 1 : 0;
        state.injuryDays = (state.injuryDays || 0) + rec.daysLost;
      }
      return rec;
    });
    const league = standings(seed, year, records),
      honors = awards(year, records, league);
    for (const e of international)
      for (const id of e.playerIds)
        honors.push({ id: `${year}-national-${id}`, title: `${e.name} ${e.result ?? '국가대표'}`, scope: 'national', year, playerId: id, teamId: career.players[id].currentTeamId });
    const events = offseason(seed, yearIndex, career, records, byId);
    const row = { year, records, league, awards: honors, events, international, preseason };
    career.years.push(row);
    career.events.push(...events);
    return row;
  }
  function history(career, id) {
    return career.years.map((y) => y.records.find((s) => s.playerId === id)).filter(Boolean);
  }
  function review(career, picks, byId, lost = {}) {
    return TEAMS.map((t) => {
      const own = picks.filter((s) => s.teamId === t.id),
        size = own.length + (lost[t.id] || 0),
        ids = new Set(own.map((s) => s.playerId)),
        records = career.years.flatMap((y) => y.records.filter((r) => ids.has(r.playerId)));
      const total = records.reduce((n, r) => n + (r.war || 0), 0),
        atHome = records.filter((r) => r.teamId === t.id).reduce((n, r) => n + (r.war || 0), 0);
      const debut = own.filter((s) => history(career, s.playerId).some((r) => r.stats.games > 0)).length;
      const established = own.filter((s) =>
        history(career, s.playerId).some((r) => r.route === 'regular'),
      ).length;
      const development = mean(
        own.map((s) => {
          const h = history(career, s.playerId);
          return (h.at(-1)?.scoutReady ?? byId[s.playerId].ready) - byId[s.playerId].ready;
        }),
      );

      const needs = S.needCoverage(
        own.map((s) => byId[s.playerId]),
        club,
      );
      const Rv = T.review;
      const production = clamp((Math.max(0, total) / (Math.max(1, size) * Math.max(1, career.years.length) * Rv.warPerSeason)) * 100, 0, 100);
      const growth = clamp(development * Rv.growth.perPoint + Rv.growth.base, 0, 100);

        teamId: t.id,
        count: own.length,
        refused: lost[t.id] || 0,
        total: round(total, 1),
        atHome: round(atHome, 1),
        debut,
        established,
        development: round(development, 1),
        score,
        grade: letter(score, Rv.gradeCuts),
        pending: own.filter((s) => {
          const st = career.players[s.playerId];
          return st.status === 'active' && st.age <= Rv.pendingMaxAge && st.scoutReady < st.scoutFV;
        }).length,
        released: own.filter((s) => career.players[s.playerId].status === 'released').length,
        retired: own.filter((s) => career.players[s.playerId].status === 'retired').length,
        national: new Set(career.years.flatMap((y) => y.awards).filter((a) => ids.has(a.playerId) && a.scope === 'national').map((a) => a.playerId)).size,
        awards: career.years
          .flatMap((y) => y.awards)
          .filter((a) => ids.has(a.playerId) && a.scope === 'draft-class').length,
      };
    }).sort((a, b) => b.score - a.score || b.total - a.total || a.teamId.localeCompare(b.teamId));
  }

      mine.every((a) => Number.isInteger(offers[a.playerId]) && offers[a.playerId] >= 0 && offers[a.playerId] % K.step === 0) &&
      mine.reduce((n, a) => n + offers[a.playerId], 0) <= g.budgets[g.teamId];
    if (!ok) throw Error('제시액을 확인해야 합니다.');
    g.offers = mine.map((a) => [a.playerId, offers[a.playerId]]);
    const committed = Object.fromEntries(TEAMS.map((t) => [t.id, 0]));
    for (const s of g.picks) {
      const p = getPlayer(g, s.playerId),
        fav = isFavourite(p, s.teamId),
        ask = Deal.demand(p, s, fav);
      let offer, res;
      if (s.teamId === g.teamId) {
        offer = offers[s.playerId];
        res = offer > 0 ? Deal.respond(p, offer, ask, g.difficulty, fav, g.seed) : { result: 'refused' };
      } else {
        // Keep enough for the club's later picks at their slot value and its minimum development contracts.
        const later = g.picks.filter((x) => x.teamId === s.teamId && x.overall > s.overall).reduce((n, x) => n + x.slot, 0) * K.cpuReserve;
        const room = g.budgets[s.teamId] - committed[s.teamId] - later - TUNING.devContracts.cpuMin * K.devCost;
        offer = Math.max(K.step, Math.min(Math.round((ask * K.cpuOffer) / K.step) * K.step, Math.floor(room / K.step) * K.step));
        res = Deal.respond(p, offer, ask, g.difficulty, fav, g.seed);
        if (res.result === 'counter') res = res.counter <= room ? { result: 'signed', bonus: res.counter } : { result: 'refused' };
      }
      const talk = { teamId: s.teamId, playerId: s.playerId, ask, offer, result: res.result, counter: res.counter ?? null, bonus: res.result === 'signed' ? res.bonus ?? offer : 0 };
      g.talks.push(talk);
      committed[s.teamId] += talk.bonus;
    }
    if (!g.talks.some((t) => t.teamId === g.teamId && t.result === 'counter')) closeNegotiations(g, []);
    return g.talks.filter((t) => t.teamId === g.teamId);
  }
  /** Default first offers: every ask, scaled down evenly when the total would exceed the budget. */
  function defaultOffers(g) {
    const list = asks(g),
      step = TUNING.contracts.step,
      k = Math.min(1, g.budgets[g.teamId] / list.reduce((n, a) => n + a.ask, 0));
    return Object.fromEntries(list.map((a) => [a.playerId, Math.max(step, Math.floor((a.ask * k) / step) * step)]));
  }
  /** Counter-offers the club can afford, in pick order. */
  function affordableCounters(g) {
    let left = budgetLeft(g);
    const ids = [];
    for (const t of g.talks.filter((t) => t.teamId === g.teamId && t.result === 'counter'))
      if (t.counter <= left) {
        ids.push(t.playerId);
        left -= t.counter;
      }
    return ids;
  }
  /** Negotiates with default offers and accepts every affordable counter (tests, audits, quick play). */
  function signAll(g) {
    negotiate(g, defaultOffers(g));
    if (g.phase === 'negotiation') settleCounters(g, affordableCounters(g));
  }
  /** The user accepts some counter-offers; the rest walk away. */
  function settleCounters(g, ids) {
    const open = g.talks.filter((t) => t.teamId === g.teamId && t.result === 'counter');
    if (g.phase !== 'negotiation' || !open.length || !Array.isArray(ids) || new Set(ids).size !== ids.length || !ids.every((id) => open.some((t) => t.playerId === id)))
      throw Error('재협상 결과를 확인해야 합니다.');
    const cost = open.filter((t) => ids.includes(t.playerId)).reduce((n, t) => n + t.counter, 0);
    if (spent(g) + cost > g.budgets[g.teamId]) throw Error('예산을 넘습니다.');
    closeNegotiations(g, ids);
  }
  function closeNegotiations(g, acceptedCounters) {
    for (const t of g.talks.filter((t) => t.result === 'counter')) {
      const yes = acceptedCounters.includes(t.playerId);
      t.result = yes ? 'signed' : 'refused';
      t.bonus = yes ? t.counter : 0;
    }
    for (const s of g.picks) {
      const t = g.talks.find((x) => x.playerId === s.playerId);
      s.bonus = t.bonus;
      if (t.result === 'refused') {
        s.refused = true;
        t.path = Deal.refusalPath(getPlayer(g, s.playerId), D.catalog, g.seed);
      }
    }
    g.counterIds = acceptedCounters;
    g.phase = 'signing';
  }
  const refusals = (g, teamId = null) => g.talks.filter((t) => t.result === 'refused' && (!teamId || t.teamId === teamId));

  /** Every player tied to a club this class: signed draft picks, then development contracts. */
  const signed = (g) => [...signedPicks(g), ...(g.devSigns || [])];
  const mySigned = (g) => signed(g).filter((s) => s.teamId === g.teamId);
  /** Pool players nobody drafted or signed, best public rank first. */
  function undrafted(g) {
    const taken = new Set([...g.picks, ...(g.devSigns || [])].map((s) => s.playerId));
    return poolFor(g).players.filter((p) => !taken.has(p.id));
  }
  function devEntry(g, teamId, playerId) {
    const k = (g.devSigns || []).length;
    return { teamId, round: g.rounds + 1, label: '육성', dev: true, playerId, overall: g.schedule.length + k + 1, fit: fit(getPlayer(g, playerId), teamFor(g, teamId)) };
  }
  /**
   * The user signs up to `max` undrafted players; then each CPU club, in draft order, signs cpuMin–cpuMax more.
   * CPU clubs take turns one player at a time and only see public information.
   */
  function signDevelopment(g, ids = []) {
    const D_ = TUNING.devContracts;
    if (g.phase !== 'signing') throw Error('육성선수 계약은 드래프트가 끝난 뒤에 합니다.');
    if (!Array.isArray(ids) || ids.length > D_.max || new Set(ids).size !== ids.length) throw Error('육성선수는 최대 ' + D_.max + '명입니다.');
    const free = new Set(undrafted(g).map((p) => p.id));
    if (!ids.every((id) => free.has(id))) throw Error('계약할 수 없는 선수입니다.');
    if (ids.length * TUNING.contracts.devCost > budgetLeft(g)) throw Error('육성선수 계약 예산이 부족합니다.');
    g.devSigns = [];
    for (const id of ids) g.devSigns.push(devEntry(g, g.teamId, id));
    const order = g.schedule.filter((s) => s.round === 1 && s.teamId !== g.teamId).map((s) => s.teamId);
    const quota = Object.fromEntries(order.map((id) => [id, D_.cpuMin + Math.floor(rng(g.seed + '-dev-count-' + id)() * (D_.cpuMax - D_.cpuMin + 1))]));
    for (let turn = 0; turn < D_.cpuMax; turn++)
      for (const teamId of order) {
        if (turn >= quota[teamId] || budgetLeft(g, teamId) < TUNING.contracts.devCost) continue;
        const t = teamFor(g, teamId),
          mine = signed(g).filter((s) => s.teamId === teamId).map((s) => R.project(getPlayer(g, s.playerId)));
        const ranked = R.aiScores(undrafted(g).map(R.project), t, mine, g.difficulty, `${g.seed}-dev-${teamId}-${turn}`);
        if (ranked[0]) g.devSigns.push(devEntry(g, teamId, ranked[0].id));
      }
    g.phase = 'interviews';
    return g.devSigns;
  }

  /** The press conference: two questions about this draft, then the first-year pledge. */
  function gmQuestions(g) {
    const first = mySignedPicks(g)[0];
    const qs = Press.gmQuestions({
      first: first ? R.project(getPlayer(g, first.playerId)) : null,
      firstLabel: first ? (first.round === 0 ? '지역 1차로' : `${first.label}에서`) : '',
      refused: refusals(g, g.teamId).map((t) => getPlayer(g, t.playerId).name),
      spentShare: spent(g) / g.budgets[g.teamId],
      boost: Deal.growthBoost(budgetLeft(g), g.budgets[g.teamId]),
      team: teamFor(g),
    });
    return [...qs, { id: 'pledge', question: '이번 지명으로 무엇을 보여 주실 겁니까?', options: gmOptions(g) }];
  }
  /** `choice`: the pledge; `answers`: { first, issue } option ids (the first option when omitted). */
  function chooseGM(g, choice, answers = {}) {
    if (g.phase !== 'interviews' || g.cursor !== g.schedule.length || g.gmChoice || g.season || !Press.GM_CHOICES.some((c) => c.id === choice))
      throw Error('인터뷰 답변은 드래프트 종료 후 한 번만 선택할 수 있습니다.');
    const picked = {};
    for (const q of gmQuestions(g).filter((q) => q.id !== 'pledge')) {
      const id = answers[q.id] ?? q.options[0].id;
      if (!q.options.some((o) => o.id === id)) throw Error('기자회견 답변을 확인해야 합니다.');
      picked[q.id] = id;
    }
    g.gmChoice = choice;
    g.gmAnswers = picked;
    return gmOptions(g).find((c) => c.id === choice);
  }
  /**
   * Pledges judged after later seasons: [{ yearIndex, label, delta, kept }]. Only seasons already played.
   * - first 'now': our first pick plays in the first team in year one.
   * - first 'project': he holds a regular job at our club within four seasons.
   * - pledge 'core5': three of our signed draft picks hold a regular job here within five seasons.
   */
  function pledgeOutcomes(g) {
    const years = g.career?.years || [],
      out = [],
      first = mySignedPicks(g)[0],
      regularHere = (y, id) => y.records.some((r) => r.playerId === id && r.teamId === g.teamId && r.route === 'regular');
    if (first && g.gmAnswers?.first === 'now' && years[0]) {
      const kept = years[0].records.some((r) => r.playerId === first.playerId && r.stats.games > 0);
      out.push({ yearIndex: 0, label: '첫 지명 즉시 전력 약속', delta: kept ? 3 : -3, kept });
    }
    if (first && g.gmAnswers?.first === 'project') {
      const at = years.slice(0, 4).findIndex((y) => regularHere(y, first.playerId));
      if (at >= 0) out.push({ yearIndex: at, label: '첫 지명 주전 육성 약속', delta: 4, kept: true });
      else if (years.length >= 4) out.push({ yearIndex: 3, label: '첫 지명 주전 육성 약속', delta: -3, kept: false });
    }
    if (g.gmChoice === 'core5' && years.length >= 5) {
      const n = mySignedPicks(g).filter((s) => years.slice(0, 5).some((y) => regularHere(y, s.playerId))).length;
      out.push({ yearIndex: 4, label: `5년 주전 셋 약속 (${n}명)`, delta: n >= 3 ? 5 : -5, kept: n >= 3 });
    }
    return out;
  }
  function fanState(g) {
    const timeline = [{ label: '시작 전', delta: 0, score: 50 }];
    let score = 50;
    function entry(label, delta) {
      score = clamp(score + delta, 0, 100);
      timeline.push({ label, delta, score });
    }
    for (const n of g.news.filter((n) => n.teamId === g.teamId)) entry(n.reason, n.delta);
    if (g.phase !== 'negotiation' && g.offers) {
      const lost = refusals(g, g.teamId).length;
      entry(`계약 협상 · ${lost ? `지명 거부 ${lost}명` : '전원 계약'}`, lost ? lost * TUNING.contracts.refusalFan : 0);
    }
    if (g.gmChoice) {
      for (const q of gmQuestions(g).filter((q) => q.id !== 'pledge')) {
        const o = q.options.find((o) => o.id === g.gmAnswers?.[q.id]);
        if (o) entry('기자회견 · ' + o.title, o.delta);
      }
      const c = gmOptions(g).find((c) => c.id === g.gmChoice);
      entry('기자회견 · ' + c.title, c.delta);
    }
    if (g.season) {
      const a = Press.accountability(
        g.gmChoice,
        mySignedPicks(g).map((s) => R.project(getPlayer(g, s.playerId))),
        g.season,
        teamFor(g),
      );
      entry('첫 시즌 약속 · ' + a.status, a.bonus);
    }
    const pledges = pledgeOutcomes(g);
    // Every season: the club's finish, how many of this class held a regular job here, national medals.
    // Old feelings fade a little each year, so the score drifts back toward 50 before the new season counts.
    const F = TUNING.fans;
    for (const y of g.career?.years || []) {
      const own = new Set(myPicks(g).map((s) => s.playerId).concat(mySigned(g).map((s) => s.playerId)));
      const rank = y.league.table.find((t) => t.teamId === g.teamId).rank,
        champion = y.league.champion === g.teamId,
        regulars = y.records.filter((r) => own.has(r.playerId) && r.teamId === g.teamId && r.route === 'regular').length,
        medals = y.awards.filter((a) => a.scope === 'national' && own.has(a.playerId) && /메달/.test(a.title)).length;
      score = Math.round(clamp(score + (50 - score) * F.fade, 0, 100));
      const delta = F.byRank[rank - 1] + (champion ? F.champion : 0) + Math.min(F.maxRegulars, regulars) * F.perRegular + Math.min(F.maxMedals, medals);
      entry(`${y.year} 시즌 · ${rank}위${champion ? ' · 우승' : ''} · 동기 주전 ${regulars}명${medals ? ` · 국가대표 메달 ${medals}명` : ''}`, delta);
      for (const o of pledges.filter((o) => o.yearIndex === y.year - Bio.ENTRY_YEAR)) entry(`${o.label} · ${o.kept ? '지킴' : '못 지킴'}`, o.delta);
    }
    return {
      score,
      label: score >= 65 ? '기대 우세' : score >= 45 ? '관망' : score >= 30 ? '우려 우세' : '신뢰 회복 필요',
      timeline,
    };
  }
  function evaluate(g, season) {
    const players = mySignedPicks(g).map((s) => getPlayer(g, s.playerId)),
      base = M.evaluate(g, season, players, teamFor(g));
    const pledge = Press.accountability(g.gmChoice, players.map(R.project), season, teamFor(g));
    const score = clamp(base.score + pledge.bonus, 0, 100);
    return {
      ...base,
      baseScore: base.score,
      score,
      grade: score >= 89 ? 'A' : score >= 77 ? 'B' : score >= 63 ? 'C' : 'D',
      pledge,
    };
  }
  // ---------------------------------------------------------------- development plans

  /** Focus, position and two-way options for our players before the next season (or the first one). */
  function planOptions(g) {
    const byId = poolFor(g).byId;
    if (g.career && g.career.years.length >= Career.SEASONS) return [];
    return Career.planOptions(g.career || Career.create(signed(g), byId, g.seed), byId, g.career ? g.career.years.length : 0, g.teamId);
  }
  /**
   * Validates plans (playerId → { focus?, role?, twoWay? }) against the options, keeps only real changes and
   * records them for the save. Throws on anything the options do not allow.
   */
  function takePlans(g, plans, yearIndex, options) {
    const byOption = new Map(options.map((o) => [o.playerId, o])),
      out = {};
    for (const [id, plan] of Object.entries(plans || {})) {
      const o = byOption.get(id);
      if (!o || !plan || typeof plan !== 'object' || Array.isArray(plan)) throw Error('육성 계획을 확인해야 합니다.');
      const clean = {};
      if (plan.role != null && plan.role !== o.role) {
        if (!o.roleOptions.includes(plan.role)) throw Error('바꿀 수 없는 포지션입니다.');
        clean.role = plan.role;
      }
      if (plan.focus != null) {
        const kind = Career.kindOf(clean.role || o.role);
        if (plan.focus !== 'balanced' && !Career.FOCUS_KEYS[kind].includes(plan.focus)) throw Error('육성 방향을 확인해야 합니다.');
        if (plan.focus !== o.focus || clean.role) clean.focus = plan.focus;
      }
      if (plan.twoWay != null) {
        if (typeof plan.twoWay !== 'boolean' || (plan.twoWay && !o.twoWayCapable)) throw Error('투타 겸업 여부를 확인해야 합니다.');
        if (plan.twoWay !== o.twoWay) clean.twoWay = plan.twoWay;
      }
      if (Object.keys(clean).length) out[id] = clean;
    }
    g.devPlans ??= [];
    for (const [id, c] of Object.entries(out).sort()) g.devPlans.push([yearIndex, id, c.focus ?? null, c.role ?? null, c.twoWay ?? null]);
    return out;
  }
  const plansFor = (list, yearIndex) =>
    Object.fromEntries(
      (list || [])
        .filter((x) => x[0] === yearIndex)
        .map(([, id, focus, role, twoWay]) => [id, Object.fromEntries(Object.entries({ focus, role, twoWay }).filter(([, v]) => v != null))]),
    );

  function runSeason(g, plans = {}) {
    if (g.cursor !== g.schedule.length || !g.gmChoice)
      throw Error('드래프트와 단장 인터뷰를 먼저 완료해야 합니다.');
    const { byId } = poolFor(g);
    if (!g.career) {
      // Unspent budget becomes development support for each club's own signings.
      const boosts = Object.fromEntries(TEAMS.map((t) => [t.id, Deal.growthBoost(budgetLeft(g, t.id), g.budgets[t.id])]));
      const career = Career.create(signed(g), byId, g.seed, boosts);
      const clean = takePlans(g, plans, 0, Career.planOptions(career, byId, 0, g.teamId));
      g.career = career;
      Career.advance(g.career, signed(g), byId, g.seed, {}, clean, g.teamId);
      // First-year evaluation covers this club's signed draft picks (development contracts are judged over the career).
      const drafted = new Set(mySignedPicks(g).map((s) => s.playerId));
      g.season = g.career.years[0].records.filter((s) => s.teamId === g.teamId && drafted.has(s.playerId));
      g.owner = evaluate(g, g.season);
    }
    g.phase = 'season';
    return g.season;
  }
  // ---------------------------------------------------------------- military service choices

  const SERVICE_CHOICES = ['auto', 'sangmu', 'army', 'defer'];
  /** Our players who could enlist before the next season, with deadline and Sangmu chance. */
  function serviceOptions(g) {
    if (!g.career || g.career.years.length >= Career.SEASONS) return [];
    return Career.serviceOptions(g.career, poolFor(g).byId, g.career.years.length).filter((o) => o.teamId === g.teamId);
  }
  /** Plays the next season. `orders`: playerId → service choice for our players ('auto' if omitted). */
  function nextSeason(g, orders = {}, plans = {}) {
    if (!g.career || !['season', 'owner'].includes(g.phase)) throw Error('첫 시즌을 먼저 진행해야 합니다.');
    const options = new Map(serviceOptions(g).map((o) => [o.playerId, o]));
    for (const [id, choice] of Object.entries(orders)) {
      const o = options.get(id);
      if (!o || !SERVICE_CHOICES.includes(choice) || (choice === 'defer' && o.must)) throw Error('병역 결정을 확인해야 합니다.');
    }
    const yearIndex = g.career.years.length;
    const clean = takePlans(g, plans, yearIndex, planOptions(g));
    g.serviceOrders ??= [];
    for (const [id, choice] of Object.entries(orders).sort()) if (choice !== 'auto') g.serviceOrders.push([yearIndex, id, choice]);
    const result = Career.advance(g.career, signed(g), poolFor(g).byId, g.seed, orders, clean, g.teamId);
    g.phase = 'season';
    return result;
  }
  function careerReview(g) {
    // Picks who refused to sign count against the club: they are in the class size with nothing to show.
    const lost = Object.fromEntries(TEAMS.map((t) => [t.id, refusals(g, t.id).length]));
    return g.career ? Career.review(g.career, signed(g), poolFor(g).byId, lost) : [];
  }
  const PHASES = ['preview', 'scouting', 'draft', 'negotiation', 'signing', 'interviews', 'season', 'owner'];

  /*
   * Saves
   * -----
   * A save holds only the inputs of a game: settings, seed, the user's own picks, the GM answer and how
   * many seasons were played. Everything else is recomputed by replaying, which is fast (<0.2 s for five
   * seasons) and means a save cannot be edited into a different result.
   *
   * Replaying is only faithful while the simulation behaves exactly as it did when the save was made.
   * SIM_VERSION names that behaviour: bump it whenever a change alters any simulated number or pick
   * (tests/golden.cjs fails until you do). A save from another SIM_VERSION is refused, never silently
   * replayed into a different history.
   */
  const SIM_VERSION = '1.0',
    SAVE_FORMAT = 'draft-room-save',
    SAVE_VERSION = 2;

  /** The compact save for a game. */
  function toSave(g) {
    return {
      format: SAVE_FORMAT,
      version: SAVE_VERSION,
      sim: SIM_VERSION,
      teamId: g.teamId,
      local: g.local,
      seed: g.seed,
      difficulty: g.difficulty,
      rounds: g.rounds,
      phase: g.phase,
      picks: myPicks(g).map((s) => s.playerId),
      offers: g.offers,
      counters: g.counterIds,
      dev: (g.devSigns || []).filter((s) => s.teamId === g.teamId).map((s) => s.playerId),
      gmChoice: g.gmChoice,
      gm: g.gmAnswers || null,
      seasons: g.career?.years.length ?? 0,
      service: g.serviceOrders || [],
      plans: g.devPlans || [],
    };
  }

  /**
   * Replays a game from compact-save inputs. Returns null if they are invalid or do not replay.
   * CPU clubs pick up to the user's next turn, as the app does; `stopAt` instead stops at that overall pick
   * (used for v0.6.0 saves, which may have been stored mid-way through CPU picks).
   */
  function replay(s, stopAt = null) {
    try {
      if (
        !s ||
        !Object.hasOwn(R.DIFFICULTIES, s.difficulty) ||
        !Object.hasOwn(teamById, s.teamId) ||
        !ROUND_OPTIONS.includes(s.rounds) ||
        typeof s.seed !== 'string' ||
        !s.seed.length ||
        s.seed.length > 200 ||
        typeof s.local !== 'boolean' ||
        !PHASES.includes(s.phase) ||
        !Array.isArray(s.picks) ||
        !s.picks.every((id) => typeof id === 'string') ||
        !Number.isInteger(s.seasons) ||
        s.seasons < 0 ||
        s.seasons > Career.SEASONS ||
        (s.service != null && (!Array.isArray(s.service) || !s.service.every((o) => Array.isArray(o) && o.length === 3 && Number.isInteger(o[0]) && o[0] >= 1 && o[0] < s.seasons))) ||
        (s.plans != null && (!Array.isArray(s.plans) || !s.plans.every((o) => Array.isArray(o) && o.length === 5 && Number.isInteger(o[0]) && o[0] >= 0 && o[0] < s.seasons)))
      )
        return null;
      const g = createGame(s.teamId, s.local, s.seed, s.difficulty, s.rounds);
      const pristine = !s.picks.length && s.gmChoice == null && !s.seasons && s.offers == null;
      if (s.phase === 'preview') return pristine ? g : null;
      openScouting(g);
      if (s.phase === 'scouting') return pristine ? g : null;
      beginDraft(g);
      const cpuPicks = () => {
        while (g.phase === 'draft' && g.schedule[g.cursor].teamId !== g.teamId && (stopAt == null || g.cursor < stopAt))
          addPick(g, aiChoice(g).id);
      };
      for (const id of s.picks) {
        cpuPicks();
        if (g.phase !== 'draft' || g.schedule[g.cursor].teamId !== g.teamId) return null; // more picks than turns
        addPick(g, id); // throws on an illegal pick
      }
      cpuPicks();
      if ((s.phase === 'draft') !== (g.phase === 'draft')) return null;
      if (g.phase === 'draft') return s.offers == null && s.gmChoice == null && !s.seasons ? g : null;
      // Negotiations: first offers, then (if anyone countered) which counter-offers were accepted.
      if (s.offers == null) return s.phase === 'negotiation' && s.gmChoice == null && !s.seasons ? g : null;
      if (!Array.isArray(s.offers) || !s.offers.every((o) => Array.isArray(o) && o.length === 2)) return null;
      negotiate(g, Object.fromEntries(s.offers));
      if (g.phase === 'negotiation') {
        if (s.counters == null) return s.phase === 'negotiation' && s.gmChoice == null && !s.seasons ? g : null;
        settleCounters(g, s.counters);
      } else if (s.counters != null && s.counters.length) return null;
      if (s.phase === 'negotiation') return null;
      if (s.phase === 'signing') return s.gmChoice == null && !s.seasons && !(s.dev || []).length ? g : null;
      if (g.phase === 'signing') signDevelopment(g, s.dev || []);
      if (s.gmChoice != null) {
        if (s.gm != null && (typeof s.gm !== 'object' || Array.isArray(s.gm))) return null;
        chooseGM(g, s.gmChoice, s.gm || {});
        if (s.gm && JSON.stringify(g.gmAnswers) !== JSON.stringify(s.gm)) return null; // unknown or extra answers
      }
      if (['season', 'owner'].includes(s.phase) && !s.seasons) return null;
      if (s.seasons) {
        runSeason(g, plansFor(s.plans, 0)); // requires the GM answer
        while (g.career.years.length < s.seasons) {
          const yi = g.career.years.length;
          nextSeason(g, Object.fromEntries((s.service || []).filter((o) => o[0] === yi).map((o) => [o[1], o[2]])), plansFor(s.plans, yi));
        }
        if (JSON.stringify(g.devPlans || []) !== JSON.stringify(s.plans || [])) return null; // plans that changed nothing
      }
      if (g.phase !== 'draft') g.phase = s.phase; // e.g. revisiting interviews after season 1
      return g;
    } catch (_) {
      return null;
    }
  }

  /**
   * Rebuilds a v0.6.0 save, which stored the whole game object. Derived fields are ignored; the inputs
   * are replayed and the stored pick list must match the replay exactly (so CPU picks cannot be edited).
   */
  function restore(g0) {
    if (!g0 || g0.version !== VERSION || g0.draftDate !== Bio.DRAFT_DATE || !Array.isArray(g0.picks)) return null;
    if (g0.cursor !== g0.picks.length || !g0.picks.every((p) => p && typeof p.playerId === 'string')) return null;
    const seasons = g0.career == null ? 0 : g0.career.years?.length;
    if (g0.career != null && !seasons) return null;
    const g = replay(
      {
        rounds: 7,
        ...g0,
        picks: g0.picks.filter((p) => p.teamId === g0.teamId).map((p) => p.playerId),
        dev: (g0.devSigns || []).filter((p) => p.teamId === g0.teamId).map((p) => p.playerId),
        counters: g0.counterIds ?? null,
        gm: g0.gmAnswers ?? null,
        seasons,
      },
      g0.picks.length,
    );
    if (!g) return null;
    const ids = (list) => list.map((p) => p.teamId + ':' + p.playerId).join();
    return ids(g.picks) === ids(g0.picks) ? g : null;
  }

  /**
   * Loads any supported save: a compact save, a v0.6.0 export ({format:'draft-room-v06', game}) or a bare
   * v0.6.0 game object. Returns { game } or { error: 'sim' | 'invalid', sim }.
   */
  function loadSave(data) {
    if (data?.format === SAVE_FORMAT) {
      if (data.version !== SAVE_VERSION) return { error: 'invalid' };
      if (data.sim !== SIM_VERSION) return { error: 'sim', sim: String(data.sim) };
      const game = replay(data);
      return game ? { game } : { error: 'invalid' };
    }
    // v0.6.0 saves predate SIM_VERSION; their simulation is the one named '0.6'.
    const legacy = data?.format === 'draft-room-v06' ? data.game : data;
    if (legacy?.version === VERSION && SIM_VERSION !== '0.6') return { error: 'sim', sim: '0.6' };
    const game = restore(legacy);
    return game ? { game } : { error: 'invalid' };
  }
  const validate = (g) => restore(g) !== null;
  const api = {
    scouting: S,
    grades: D.grades,
    teamFor,
    openScouting,
    CONFIG,
    Career,
    quotaStatus,
    nextSeason,
    careerReview,
    ko: K,
    bio: Bio,
    catalog: D.catalog,
    eligible: Bio.eligible,
    DRAFT_DATE: Bio.DRAFT_DATE,
    ENTRY_YEAR: Bio.ENTRY_YEAR,
    RELEASE,
    VERSION,
    rules: R,
    press: Press,
    publicPool,
    beginDraft,
    gmOptions,
    chooseGM,
    fanState,
    ROUNDS,
    ROUND_OPTIONS,

    TEAMS,

    makeSchedule,
    createGame,
    available,
    addPick,
    aiChoice,
    advanceToUser,
    myPicks,
    simulatePlayer,
    runSeason,
    evaluate,
    validate,
    restore,
    signDevelopment,
    negotiate,
    settleCounters,
    defaultOffers,
    affordableCounters,
    signAll,
    asks,
    spent,
    budgetLeft,
    refusals,
    signedPicks,
    mySignedPicks,
    gmQuestions,
    pledgeOutcomes,
    contracts: Deal,
    serviceOptions,
    SERVICE_CHOICES,
    planOptions,
    tuning: TUNING,
    undrafted,
    signed,
    mySigned,
    replay,
    toSave,
    loadSave,
    SIM_VERSION,
    SAVE_FORMAT,
    rng,
    clamp,
  };
  Voices.install(api);
  root.DraftCore = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* Shared HTML helpers for the UI. Every view is a pure function (state -> HTML string).
   Views may only show public scouting data: never trueTools, potentialTools or endState. */
(function (root) {
  'use strict';
  const C = root.DraftCore;
  const UI = (root.DraftUI = root.DraftUI || {});

  const esc = (s) =>
    String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const tag = (text, cls = '') => `<span class="tag ${cls}">${esc(text)}</span>`;
  const signed = (n) => (n > 0 ? '+' : '') + n;
  const num = (n, dp = 0) => (n == null ? '—' : dp ? n.toFixed(dp) : String(n));
  /** Batting average style: .312 */
  const rate = (n) => (n == null ? '—' : n.toFixed(3).replace(/^0/, ''));
  const teamName = (id) => C.teamById[id]?.short || '무소속';
  const teamDot = (id) => (C.teamById[id] ? `<i class="team-dot" style="background:${C.teamById[id].color}"></i>` : '');
  const player = (g, id) => C.getPlayer(g, id);
  const playerLink = (id, name) =>
    `<button class="link" data-action="career-player" data-id="${esc(id)}">${esc(name)}</button>`;
  const hand = (p) => `${p.throwHand}투${p.batHand}타`;
  /** Colour class for a 20–80 grade. */
  const gradeClass = (n) => 'g' + Math.max(30, Math.min(70, Math.floor(n / 10) * 10));
  const grade = (n) => `<span class="g ${gradeClass(n)}">${n}</span>`;

  const obp = (s) => (s?.pa ? (s.hits + s.bb) / s.pa : null);
  const slg = (s) => (s?.ab ? (s.hits + s.doubles + 2 * s.triples + 3 * s.hr) / s.ab : null);
  const per9 = (n, outs) => (outs ? ((n * 27) / outs).toFixed(1) : '—');

  function statLine(s) {
    if (!s || !s.games) return '출전 기록 없음';
    return s.kind === 'pitcher'
      ? `${s.games}경기 ${s.gs}선발 · ${C.innings(s.outs)}이닝 · ERA ${num(s.era, 2)} · ${s.wins}승 ${s.holds}홀드 ${s.saves}세이브 · ${s.k}K ${s.bb}BB (9이닝당 ${per9(s.k, s.outs)}K ${per9(s.bb, s.outs)}BB)`
      : `${s.games}경기 ${s.pa}타석 · ${rate(s.avg)}/${rate(obp(s))}/${rate(slg(s))} (타율/출루율/장타율) · ${s.hr}홈런 ${s.rbi}타점 ${s.sb}도루`;
  }

  /** Where a signed player is now: '' if still with the club that signed him. */
  function statusLabel(state, originTeamId) {
    if (!state) return '';
    if (state.status === 'released') return '방출';
    if (state.status === 'retired') return '은퇴';
    const moved = state.currentTeamId !== originTeamId ? `→ ${teamName(state.currentTeamId)}` : '';
    return [moved, state.service ? '군 복무 중' : ''].filter(Boolean).join(' · ');
  }
  function serviceStatus(state) {
    if (state.exempt) return `면제 (${state.exempt} 병역 특례)`;
    if (state.service) return `복무 중 · ${C.Career.SERVICE_LABELS?.[state.service.type] ?? ''}`.trim();
    if (state.served) return '마침';
    return '미필';
  }

  /** Current / future grade table for one player (the scouting card used everywhere). */
  /** The other side's scouting card, in the same shape as a player's main card. */
  const altCard = (p) => ({
    role: p.alt.role,
    tools: p.alt.tools,
    futureTools: p.alt.scouting.futureTools,
    ready: p.alt.ready,
    scoutCeiling: p.alt.scoutCeiling,
    floorGrade: p.alt.scouting.floorGrade,
    ceilingGrade: p.alt.scouting.ceilingGrade,
    pickTags: [],
    uncertainty: p.uncertainty,
  });

  /** Current / future grade table: a player's main card, or another card such as `altCard(p)`. */
  function toolTable(p, title = '스카우팅 평가 (20–80)') {
    const rows = C.grades
      .keys(p.role)
      .map(
        (k) =>
          `<tr><th>${C.grades.LABELS[k]}</th><td><b class="g ${gradeClass(p.tools[k])}">${p.tools[k]}</b><span class="bar"><i style="width:${((p.tools[k] - 20) / 60) * 100}%"></i></span></td><td>${p.futureTools[k]}</td></tr>`,
      )
      .join('');
    return `<section class="tool-estimates">
      <h4>${esc(title)}</h4>
      <div class="overall">
        <div><b>${p.ready}</b>현재</div><div><b>${p.scoutCeiling}</b>미래 가치</div>
        <div><b>${p.floorGrade}</b>플로어</div><div><b>${p.ceilingGrade}</b>실링</div>
      </div>
      <table class="tool-grade-table"><thead><tr><th>툴</th><th>현재</th><th>미래</th></tr></thead><tbody>${rows}</tbody></table>
      <p class="note">${[p.tools.eye != null ? `선구안 ${p.tools.eye}` : '', ...p.pickTags, `불확실성 ${p.uncertainty}`].filter(Boolean).join(' · ')}</p>
    </section>`;
  }

  /** Compact public tool grades at one point in time. */
  function toolSnapshot(p, tools, title, role = p.role) {
    return `<section class="tool-snapshot"><h4>${esc(title)}</h4><div>${C.grades
      .keys(role)
      .map((k) => `<span>${C.grades.LABELS[k]}<b>${tools?.[k] ?? '—'}</b></span>`)
      .join('')}</div></section>`;
  }

  /** "+2" style change in top velocity against the previous season (or the draft-day reading). */
  function velocityChange(g, rec) {
    const hist = g.career ? C.Career.history(g.career, rec.playerId) : [];
    const i = hist.findIndex((r) => r.year === rec.year);
    const before = i > 0 ? hist[i - 1].velocity : C.getPlayer(g, rec.playerId).velocity;
    const d = rec.velocity - before;
    return d ? (d > 0 ? '+' : '') + d : '변화 없음';
  }

  /** Minimal Markdown for the update log: headings, nested lists, bold, inline code and paragraphs. */
  function markdown(md) {
    const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
    let html = '',
      depth = 0;
    const close = (to) => {
      while (depth > to) (html += '</ul>'), depth--;
    };
    for (const line of md.split('\n')) {
      const item = line.match(/^(\s*)- (.*)$/);
      if (item) {
        const level = Math.floor(item[1].length / 2) + 1;
        while (depth < level) (html += '<ul>'), depth++;
        close(level);
        html += `<li>${inline(item[2])}</li>`;
        continue;
      }
      close(0);
      const h = line.match(/^(#{1,3}) (.*)$/);
      if (h) html += `<h${h[1].length + 1}>${inline(h[2])}</h${h[1].length + 1}>`;
      else if (line.trim()) html += `<p>${inline(line)}</p>`;
    }
    close(0);
    return html;
  }
  /** The update log split by version: [{ title, body }], newest first. */
  function releases() {
    const md = root.DraftChangelog || '';
    return md
      .split(/^## /m)
      .slice(1)
      .map((part) => {
        const [title, ...rest] = part.split('\n');
        return { title: title.trim(), body: rest.join('\n').trim() };
      });
  }

  const kindOf = (role) => (role === 'SP' || role === 'RP' ? 'pitcher' : 'hitter');

  Object.assign(UI, {
    kindOf,
    markdown,
    releases,
    velocityChange,
    esc, tag, signed, num, rate, teamName, teamDot, player, playerLink, hand, grade, gradeClass,
    statLine, toolTable, toolSnapshot, altCard, obp, slg, statusLabel, serviceStatus,
  });
})(typeof window !== 'undefined' ? window : globalThis);
</script>

    <div class="cols even">${g.forecasts
      .map(
        (f) => `<section class="outlet">
          <h2>${esc(f.name)}</h2><p>${esc(f.style)} 중심</p>
          ${rounds
            .map((round) => `${g.local ? `<h3 style="margin:10px 0 4px">${round === 0 ? '지역 1차' : '전국 1라운드'}</h3>` : ''}${mockTable(g, f, round)}`)
            .join('')}
        </section>`,
      )
      .join('')}</div>
    ${archive ? '' : `<div class="actions"><button class="btn primary" data-action="scout-briefing">스카우트 팀장 추천 보기</button></div>`}`;
  }

  function briefing(g, archive = false) {
    const t = C.teamFor(g),
      report = g.scoutReport;
    const cards = report.candidates
      .map((c, i) => {
        const p = player(g, c.playerId),
          gone = g.picks.find((s) => s.playerId === p.id);
        // c.lines[0] and [2] restate the grades shown in the grade row; [1] is the club-need reasoning.
        return `<article class="box recommendation ${i === 0 ? 'primary' : ''}">
          <span class="kicker">${i === 0 ? '1순위 추천' : '대안 ' + i} · ${esc(c.angle)}</span>
          <h3>${esc(p.name)}</h3>
          <p class="muted">${C.ROLES[p.role]} · ${esc(p.school)} · ${esc(p.pathway)} · 공개 순위 ${p.rank}위</p>
          ${gone ? `<p>${tag(`${UI.teamName(gone.teamId)} ${gone.label} 지명`, 'solid')}</p>` : ''}
          <div class="grade-row"><div><b>${p.ready}</b>현재</div><div><b>${p.scoutCeiling}</b>미래 가치</div><div><b>${p.floorGrade}</b>플로어</div><div><b>${p.ceilingGrade}</b>실링</div></div>
          <div class="tags">${p.pickTags.map((x) => tag(x)).join('')}${tag('불확실성 ' + p.uncertainty)}</div>
          <p style="margin-top:10px">${esc(c.lines[1])}</p>
          <p style="margin-top:6px"><b>우려</b> ${esc(p.weakness)}</p>
        </article>`;
      })
      .join('');
    return `
    ${archive ? '' : `<div class="page-head"><h1>스카우트 팀장 추천</h1>
      <p>${esc(t.short)} ${report.scope} 지명을 앞두고 팀장이 고른 세 명입니다. 앞 순번 구단이 먼저 데려갈 수 있고, 다른 선수를 뽑아도 불이익은 없습니다.</p></div>`}
    ${archive ? '' : UI.clubPanel(t)}
    <div class="cols three">${cards}</div>
    ${archive ? '' : `<div class="actions"><button class="btn primary" data-action="begin-draft">드래프트 시작</button></div>`}`;
  }

  Object.assign(UI, { forecasts, briefing });
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* Screen 3: the draft board, the selected prospect's profile and the pick log. */
(function (root) {
  'use strict';
  const C = root.DraftCore,
    UI = root.DraftUI;
  const { esc, tag, player, hand } = UI;

  const PATHWAYS = ['고졸', '대졸', '대학 얼리', '2년제', '독립구단', '해외파', '야구 유학', '마이너 복귀', '해외독립 복귀', '해외리그 복귀', 'MLB 경험 복귀'];
  const TIERS = ['명문', '강호', '중견', '약소', '미분류'];
  const PICK_TYPES = ['즉전감', '플로어', '실링', '육성형', '역할형'];
  const roundLabel = (slot) => (slot?.round === 0 ? '지역 1차' : `${slot?.round || 1}라운드`);

  function filterPlayers(g, v, stars, team) {
    const q = v.query.trim();
    const list = C.available(g).filter(
      (p) =>
        (v.pickType === 'ALL' || p.pickTags.includes(v.pickType)) &&
        (v.role === 'ALL' || p.role === v.role) &&
        (v.pathway === 'ALL' || p.pathway === v.pathway) &&
        (v.tier === 'ALL' || (p.schoolTier || '미분류') === v.tier) &&
        (!v.onlyStars || stars.has(p.id)) &&
        (!q || `${p.name} ${p.pathText} ${p.region} ${p.birthplace}`.includes(q)),
    );
    return C.rules.sortPlayers(list, v.sort, v.sortDir, team);
  }

  function sortValue(p, key, team) {
    if (key === 'rank') return `${p.ready} / ${p.scoutCeiling}`;
    const n = C.rules.sortValue(p, key, team);
    if (n == null) return '—';
    if (key === 'outs') return C.innings(n);
    if (key === 'era') return n.toFixed(2);
    if (key === 'avg' || key === 'ops') return UI.rate(n);
    return String(n);
  }

  const columnLabel = (sort) => (sort === 'rank' ? '현재 / 미래' : C.rules.SORTS[sort].label);

  function sortOptions(selected) {
    const groups = [...new Set(Object.values(C.rules.SORTS).map((s) => s.group))];
    return groups
      .map(
        (group) =>
          `<optgroup label="${group}">${Object.entries(C.rules.SORTS)
            .filter(([, s]) => s.group === group)
            .map(([id, s]) => `<option value="${id}" ${selected === id ? 'selected' : ''}>${s.label}</option>`)
            .join('')}</optgroup>`,
      )
      .join('');
  }

  function rows(g, list, v, stars, team, selected) {
    if (!list.length)
      return `<div class="empty">조건에 맞는 후보가 없습니다. <button class="link" data-action="clear-filters">필터 초기화</button></div>`;
    const label = columnLabel(v.sort);
    return list
      .map((p) => {
        const fit = C.fit(p, team);
        return `<button class="player-row" data-action="player" data-id="${p.id}" aria-pressed="${selected === p.id}">
          <span class="rk">${p.rank}</span>
          <span><span class="nm">${stars.has(p.id) ? '★ ' : ''}${esc(p.name)}<small>${hand(p)}</small></span>
            <span class="meta">${C.ROLES[p.role]} · ${esc(p.school)} · ${esc(p.pathway)}${p.intent ? ` · <b class="warn">${C.contracts.INTENT_LABELS[p.intent]}</b>` : ''}${p.twoWay ? ' · <b>이도류</b>' : ''}</span></span>
          <span class="val">${sortValue(p, v.sort, team)}<small>${esc(label)}</small></span>
          <span class="fit ${fit >= 80 ? 'core' : ''}">${C.fitLabel(p, team)}</span>
        </button>`;
      })
      .join('');
  }

  function amateurLine(p) {
    const r = p.record;
    const where =
      p.pathway === '고졸' ? '고교 대회' : p.pathway === '야구 유학' ? '해외 고교 대회' : ['대졸', '대학 얼리', '2년제'].includes(p.pathway) ? '대학 리그' : p.pathway === '독립구단' ? '독립리그' : '해외 리그';
    const main =
      r.kind === 'pitcher'
        ? `<span><b>${r.era.toFixed(2)}</b>ERA</span><span><b>${C.innings(r.outs)}</b>이닝</span><span><b>${r.k}</b>삼진</span><span><b>${r.bb}</b>볼넷</span>`
        : `<span><b>${UI.rate(r.avg)}</b>타율</span><span><b>${UI.rate(r.ops)}</b>OPS</span><span><b>${r.hr}</b>홈런</span><span><b>${r.sb}</b>도루</span>`;
    const extra = r.kind === 'pitcher' ? `${r.wins}승` : `${r.pa}타석 ${r.rbi}타점 ${r.runs}득점`;
    return `<div class="stat-line">${main}</div><p class="note">${where} ${r.games}경기 · ${extra}</p>`;
  }

  function profile(g, p, stars, team) {
    if (!p) return '<div class="box empty">왼쪽 목록에서 선수를 고르세요.</div>';
    const fit = C.fit(p, team);
    const advice = C.scoutAdvice(p, g).lines;
    return `<article class="box profile-body">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">
        <div>
          <h2>${esc(p.name)}</h2>
          <p class="sub">${C.ROLES[p.role]} · ${esc(p.archetype)} · ${hand(p)} · ${p.height}cm ${p.weight}kg</p>
          <p class="sub">${esc(p.school)} · ${esc(p.pathway)} · 만 ${p.age}세 · 공개 순위 ${p.rank}위</p>
        </div>
        <button class="btn quiet small" data-action="star" data-id="${p.id}" aria-pressed="${stars.has(p.id)}">${stars.has(p.id) ? '★ 관심' : '☆ 관심'}</button>
      </div>
      ${p.intent ? `<p class="callout">${p.intent === 'abroad' ? '<b>해외 구단 관심</b> · 미국 구단의 제안을 받았다고 알려졌습니다. 계약금을 크게 요구하고, 조건이 맞지 않으면 해외로 갈 수 있습니다.' : '<b>진학 희망</b> · 대학 진학도 생각하고 있다고 밝혔습니다. 계약금을 더 요구하고, 협상이 틀어지면 대학에 갈 수 있습니다.'}</p>` : ''}
      ${p.twoWay ? `<p class="callout ok"><b>투타 겸업 유망주</b> · ${C.ROLES[p.alt.role]}로도 현재 ${p.alt.ready} · 미래 ${p.alt.scoutCeiling}로 평가받습니다. 입단 뒤 겸업을 이어 갈지, 한쪽에 전념할지 정할 수 있습니다.</p>` : p.alt.scoutCeiling >= C.tuning.altTalent.publicMinFV ? `<p class="note">${C.ROLES[p.alt.role]}로도 가능성이 있다는 평가(현재 ${p.alt.ready} · 미래 ${p.alt.scoutCeiling})가 있습니다.</p>` : ''}
      ${g.difficulty === 'easy' ? `<p class="favorite-note note">어릴 때 응원한 구단: ${C.TEAMS[p.favoriteTeam].short} (쉬움 난이도에서만 공개)</p>` : ''}
      <section>${UI.toolTable(p)}</section>
      ${p.twoWay ? `<section>${UI.toolTable(UI.altCard(p), `보조 포지션 스카우팅 · ${C.ROLES[p.alt.role]} (20–80)`)}</section>` : ''}
      <section>
        <h4>지명 전 시즌 기록</h4>
        ${amateurLine(p)}
        ${p.proExperience ? `<p class="note">${esc(p.proExperience.recordScope)} · 해외 ${p.proExperience.seasons}시즌. 국내 프로 미입단자의 복귀 지원이며, 리그 수준이 달라 국내 기록과 바로 비교하기 어렵습니다.</p>` : ''}
        ${p.awards.length ? `<div class="tags">${p.awards.map((x) => tag(x)).join('')}</div>` : ''}
        ${p.velocity ? `<p class="note">최고 구속 ${p.velocity}km/h</p>` : ''}
      </section>
      <section>
        <h4>스카우팅 리포트</h4>
        <dl class="facts"><dt>강점</dt><dd>${esc(p.strength)}</dd><dt>과제</dt><dd>${esc(p.weakness)}</dd>
        <dt>${esc(team.short)} 적합</dt><dd>${C.fitLabel(p, team)}${fit >= 60 ? ` · 보강 ${team.needs.indexOf(p.role) + 1}순위 포지션` : ''}</dd>
        <dt>첫해 전망</dt><dd>${C.outlook(p)} · ${C.upsideLabel(p)}</dd></dl>
      </section>
      <section class="advice">
        <h4>팀장 의견</h4>
        <ul>${advice.map((l) => `<li>${esc(l)}</li>`).join('')}</ul>
      </section>
      <section>
        <details><summary>배경 · 이력</summary>
          <dl class="facts">
            <dt>생년월일</dt><dd>${p.birthday}</dd><dt>출생지</dt><dd>${esc(p.birthplace)}</dd>
            <dt>야구부 평판</dt><dd>${esc(p.schoolTier || '해당 없음')}${p.schoolTier ? ` · ${esc(p.schoolStyle)}` : ''}</dd>
            ${p.schoolTournament ? `<dt>대회 성적</dt><dd>${esc(p.schoolTournament.event)} ${esc(p.schoolTournament.result)}${p.schoolTournament.national ? `<br>${esc(p.schoolTournament.national.event)} ${esc(p.schoolTournament.national.result)}` : ''}</dd>` : ''}
            <dt>지역 1차</dt><dd>${p.regionalEligible ? esc(p.regionalRegion) + ' 대상' : '대상 아님'}</dd>
            <dt>성격</dt><dd>${esc(p.personality)}</dd>
          </dl>
          <ol class="history">${p.history
            .map((h) => `<li>${esc(h.name)} <span class="muted">${h.start.slice(0, 7)} – ${h.end ? h.end.slice(0, 7) : '현재'} · ${esc(h.status)}</span>${h.note ? `<small>${esc(h.note)}</small>` : ''}</li>`)
            .join('')}</ol>
        </details>
      </section>
      <div class="actions"><button class="btn primary wide" data-action="pick" data-id="${p.id}">${esc(p.name)} 지명</button></div>
    </article>`;
  }

  function myPicks(g) {
    const mine = C.myPicks(g),
      total = g.rounds + (g.local ? 1 : 0);
    return `<section class="box">
      <h3>${UI.teamName(g.teamId)} 지명 <small class="muted">${mine.length}/${total}</small></h3>
      ${mine.length
        ? `<ul class="mine-list">${mine
            .map((s) => {
              const p = player(g, s.playerId);
              return `<li><span>${esc(s.label)}</span><b>${esc(p.name)}${p.intent ? ` <small class="warn">${C.contracts.INTENT_LABELS[p.intent]}</small>` : ''}</b><span>${C.ROLES[p.role]}</span></li>`;
            })
            .join('')}</ul>`
        : '<p class="note">아직 지명한 선수가 없습니다.</p>'}
    </section>`;
  }

  function log(g) {
    return `<details class="box" style="margin-top:14px"><summary>전체 지명 기록 (${g.picks.length})</summary>
      ${g.picks.length
        ? `<div class="log-list">${g.picks
            .map((s) => {
              const p = player(g, s.playerId);
              return `<div${s.teamId === g.teamId ? ' class="good"' : ''}>${s.overall}. ${UI.teamName(s.teamId)} ${esc(s.label)} · ${esc(p.name)} <span class="muted">${C.ROLES[p.role]}</span>${s.refused ? ' <span class="warn">계약 거부</span>' : ''}</div>`;
            })
            .join('')}</div>`
        : '<p class="note">아직 지명이 없습니다.</p>'}
    </details>`;
  }

  function quota(g) {
    const q = C.quotaStatus(g);
    if (!q.missing) return `<p class="callout ok">대졸 의무 지명 충족 (${q.count}/1).</p>`;
    return `<p class="callout">${
      q.remaining <= q.missing
        ? '<b>마지막 전국 지명권입니다.</b> 국내 대학 졸업예정자만 지명할 수 있습니다.'
        : '<b>대졸 의무 지명 0/1</b> · 국내 4년제·2년제 대학 졸업예정자를 1명 이상 뽑아야 합니다(대학 얼리 제외).'
    }</p>`;
  }

  function board(g, v, stars, selectedId) {
    const t = C.teamFor(g),
      slot = g.schedule[g.cursor],
      mine = C.myPicks(g).length,
      total = g.rounds + (g.local ? 1 : 0);
    const list = filterPlayers(g, v, stars, t);
    const selected = selectedId && C.available(g).some((p) => p.id === selectedId) ? player(g, selectedId) : null;
    const strip = C.TEAMS.map((club) => {
      const picked = g.picks.find((s) => s.round === slot.round && s.teamId === club.id);
      const you = club.id === g.teamId;
      return `<div class="${you ? 'you' : ''}"><b>${club.short}</b><span>${picked ? esc(player(g, picked.playerId).name) : you ? '지명 차례' : '—'}</span></div>`;
    }).join('');
    const chip = (action, id, label, on) => `<button class="chip" data-action="${action}" data-id="${id}" aria-pressed="${on}">${label}</button>`;
    return `
    <div class="on-clock">
      <div><span class="kicker">${roundLabel(slot)} · 전체 ${g.cursor + 1}번째</span><h1>${esc(t.short)}의 지명 차례</h1></div>
      <p class="count"><b>${mine}</b> / ${total}명 지명</p>
    </div>
    <div class="round-strip" aria-label="이번 라운드 지명 현황">${strip}</div>
    ${slot.round === 0 ? `<p class="callout">지역 1차 지명: ${esc(t.region)} 지역 고졸 후보만 보입니다.</p>` : quota(g)}
    <div class="cols">
      <div>
        <section class="box">
          <div class="board-tools">
            <div class="line">
              <label class="sr-only" for="search">선수·학교 검색</label>
              <input id="search" type="search" placeholder="이름·학교·지역 검색" value="${esc(v.query)}" autocomplete="off">
              <label class="sr-only" for="sort">정렬</label><select id="sort">${sortOptions(v.sort)}</select>
              <button class="btn quiet small" data-action="sort-direction" aria-label="정렬 방향 바꾸기">${v.sortDir === 'asc' ? '오름차순' : '내림차순'}</button>
            </div>
            <div class="chips">${[['ALL', '전체'], ...Object.entries(C.ROLES)].map(([id, name]) => chip('role', id, name, v.role === id)).join('')}${`<button class="chip" data-action="only-stars" aria-pressed="${v.onlyStars}">★ 관심</button>`}</div>
            <div class="chips">${[['ALL', '유형 전체'], ...PICK_TYPES.map((x) => [x, x])].map(([id, name]) => chip('pick-type', id, name, v.pickType === id)).join('')}</div>
            <div class="line">
              <label class="sr-only" for="pathway">출신</label><select id="pathway">${['ALL', ...PATHWAYS].map((x) => `<option value="${x}" ${v.pathway === x ? 'selected' : ''}>${x === 'ALL' ? '출신 전체' : x}</option>`).join('')}</select>
              <label class="sr-only" for="tier">야구부 평판</label><select id="tier">${['ALL', ...TIERS].map((x) => `<option value="${x}" ${v.tier === x ? 'selected' : ''}>${x === 'ALL' ? '평판 전체' : x}</option>`).join('')}</select>
              <span class="note" id="candidate-count" style="margin-left:auto">${list.length}명</span>
            </div>
          </div>
          <div class="roster-head"><span>순위</span><span>선수</span><span>${esc(columnLabel(v.sort))}</span><span>적합</span></div>
          <div class="roster" id="roster">${rows(g, list, v, stars, t, selectedId)}</div>
        </section>
        ${log(g)}
      </div>
      <div><div id="profile" class="profile">${profile(g, selected, stars, t)}</div><div style="margin-top:14px">${myPicks(g)}</div></div>
    </div>`;
  }

  Object.assign(UI, { board, rows, profile, filterPlayers, myPicksBox: myPicks, pickLog: log, roundLabel });
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* Screen 3½: signing-bonus negotiations with our picks, then counter-offers. */
(function (root) {
  'use strict';
  const C = root.DraftCore,
    UI = root.DraftUI;
  const { esc, tag, player, playerLink } = UI;

  /** 245 → "2억 4500만 원" (amounts are in 백만 원). */
  function won(n) {
    const eok = Math.floor(n / 100),
      man = (n % 100) * 100;
    return n <= 0 ? '0원' : `${eok ? `${eok}억` : ''}${eok && man ? ' ' : ''}${man ? `${man.toLocaleString('ko-KR')}만` : ''} 원`;
  }
  const RATIOS = [0.8, 0.9, 1, 1.1, 1.25, 1.5];
  const step = () => C.tuning.contracts.step;
  const offerOptions = (ask) => [...new Set(RATIOS.map((k) => Math.max(step(), Math.round((ask * k) / step()) * step())))];
  const chanceLabel = (x) => (x >= 0.85 ? '높음' : x >= 0.6 ? '보통' : x >= 0.3 ? '낮음' : '매우 낮음');
  const boostPct = (g, left) => Math.round(C.contracts.growthBoost(left, g.budgets[g.teamId]) * 100);

  function budgetBox(g, committed, note) {
    const budget = g.budgets[g.teamId],
      left = budget - committed,
      dev = C.tuning.contracts.devCost;
    return `<aside class="box budget-box">
      <h3>${esc(UI.teamName(g.teamId))} 신인 예산</h3>
      <dl class="facts">
        <dt>예산</dt><dd>${won(budget)}</dd>
        <dt>${esc(note)}</dt><dd>${won(committed)}</dd>
        <dt>남는 돈</dt><dd class="${left < 0 ? 'warn' : ''}">${left < 0 ? '−' + won(-left) : won(left)}</dd>
      </dl>
      <p class="note">남는 돈으로 육성선수를 1명에 ${won(dev)}씩 계약합니다. 그러고도 남은 돈은 육성 지원금이 되어, 우리가 뽑은 선수들의 첫 ${C.tuning.contracts.growthBoost.seasons}시즌 성장 속도를 높입니다(지금 기준 +${boostPct(g, Math.max(0, left))}%, 최대 +${Math.round(C.tuning.contracts.growthBoost.max * 100)}%).</p>
    </aside>`;
  }

  function firstOffers(g, offers) {
    const asks = C.asks(g),
      defaults = C.defaultOffers(g), // every ask, scaled down evenly if they do not fit the budget
      total = asks.reduce((n, a) => n + (offers[a.playerId] ?? defaults[a.playerId]), 0),
      over = total > g.budgets[g.teamId];
    const rows = asks
      .map((a) => {
        const p = player(g, a.playerId),
          offer = offers[a.playerId] ?? defaults[a.playerId],
          chance = offer ? C.contracts.publicChance(p, offer, a.ask, g.difficulty) : 0;
        const opts = [...new Set([...offerOptions(a.ask), defaults[a.playerId]])]
          .sort((x, y) => x - y)
          .map((v) => `<option value="${v}" ${v === offer ? 'selected' : ''}>${won(v)} (${Math.round((v / a.ask) * 100)}%)</option>`)
          .join('');
        return `<tr>
          <td>${esc(a.label)}</td>
          <td>${playerLink(p.id, p.name)}<small>${C.ROLES[p.role]} · ${esc(p.pathway)} · FV ${p.scoutCeiling}${p.intent ? ` · <b class="warn">${C.contracts.INTENT_LABELS[p.intent]}</b>` : ''}</small></td>
          <td class="n">${won(a.ask)}</td>
          <td><select data-offer="${esc(p.id)}" aria-label="${esc(p.name)} 제시액"><option value="0" ${offer === 0 ? 'selected' : ''}>계약 포기</option>${opts}</select></td>
          <td>${offer ? esc(chanceLabel(chance)) : '<span class="warn">포기</span>'}</td>
        </tr>`;
      })
      .join('');
    return `
    <div class="page-head">
      <h1>계약 협상</h1>
      <p>지명한 선수마다 계약금을 한 번 제시합니다. 선수는 받아들이거나, 금액을 올려 다시 요구하거나, 계약을 거부합니다. 거부한 선수는 대학이나 해외로 떠나고, 지명권은 돌려받지 못합니다.</p>
    </div>
    <div class="cols">
      <section>
        <div class="table-scroll"><table class="t">
          <thead><tr><th>지명</th><th>선수</th><th class="n">요구액</th><th>제시액</th><th>첫 제시 수락</th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div>
        ${asks.reduce((n, a) => n + a.ask, 0) > g.budgets[g.teamId] ? '<p class="callout">요구액을 모두 들어주면 예산을 넘습니다. 기본 제시액은 요구액을 같은 비율로 깎은 금액입니다.</p>' : ''}
        <p class="note">수락 가능성은 공개된 정보만으로 본 추정입니다. 어릴 때 응원한 팀이면 요구액이 낮고 협상도 잘 풀리지만, 그 정보는 요구액에만 드러납니다. 진학 희망·해외 구단 관심 선수는 요구액이 높고 협상이 틀어지기 쉽습니다.</p>
      </section>
      <div>
        ${budgetBox(g, total, '제시액 합계')}
        <div class="actions">
          <button class="btn primary wide" data-action="offer-confirm" ${over ? 'disabled' : ''}>이 금액으로 제시</button>
          ${over ? '<span class="note warn">제시액 합계가 예산을 넘습니다.</span>' : ''}
        </div>
      </div>
    </div>`;
  }

  function counters(g, accepted) {
    const mine = g.talks.filter((t) => t.teamId === g.teamId),
      open = mine.filter((t) => t.result === 'counter'),
      committed = C.spent(g) + open.filter((t) => accepted.has(t.playerId)).reduce((n, t) => n + t.counter, 0),
      over = committed > g.budgets[g.teamId];
    const done = mine
      .filter((t) => t.result !== 'counter')
      .map((t) => `<li><b>${esc(player(g, t.playerId).name)}</b> ${t.result === 'signed' ? `${won(t.bonus)}에 계약` : '<span class="warn">계약 거부</span>'}</li>`)
      .join('');
    const rows = open
      .map((t) => {
        const p = player(g, t.playerId),
          on = accepted.has(t.playerId);
        return `<tr class="${on ? 'mine' : ''}">
          <td>${playerLink(p.id, p.name)}<small>${C.ROLES[p.role]} · FV ${p.scoutCeiling}${p.intent ? ` · ${C.contracts.INTENT_LABELS[p.intent]}` : ''}</small></td>
          <td class="n">${won(t.offer)}</td><td class="n"><b>${won(t.counter)}</b></td>
          <td><button class="btn small ${on ? 'primary' : 'quiet'}" data-action="counter-toggle" data-id="${esc(p.id)}" aria-pressed="${on}">${on ? '수락' : '거절'}</button></td>
        </tr>`;
      })
      .join('');
    return `
    <div class="page-head">
      <h1>재협상</h1>
      <p>${open.length}명이 금액을 올려 다시 요구했습니다. 이번에 받아들이면 바로 계약하고, 거절하면 선수는 떠납니다.</p>
    </div>
    <div class="cols">
      <section>
        <div class="table-scroll"><table class="t">
          <thead><tr><th>선수</th><th class="n">우리 제시</th><th class="n">선수 요구</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div>
        <h3 style="margin-top:14px">첫 제시 결과</h3>
        <ul class="event-list">${done}</ul>
      </section>
      <div>
        ${budgetBox(g, committed, '계약금 합계')}
        <div class="actions">
          <button class="btn primary wide" data-action="counter-confirm" ${over ? 'disabled' : ''}>결정</button>
          ${over ? '<span class="note warn">예산을 넘습니다.</span>' : ''}
        </div>
      </div>
    </div>`;
  }

  function negotiation(g, offers, accepted) {
    return (g.offers ? counters(g, accepted) : firstOffers(g, offers)) + UI.pickLog(g);
  }

  /** Contract results, shown once negotiations close. */
  function contractResults(g) {
    const mine = g.talks.filter((t) => t.teamId === g.teamId),
      others = C.refusals(g).filter((t) => t.teamId !== g.teamId);
    const line = (t) => {
      const p = player(g, t.playerId),
        s = g.picks.find((x) => x.playerId === t.playerId);
      return t.result === 'signed'
        ? `<li>${esc(s.label)} <b>${esc(p.name)}</b> ${won(t.bonus)}</li>`
        : `<li>${esc(s.label)} <b>${esc(p.name)}</b> ${tag('계약 거부', 'warn')} <small>${esc(t.path)}</small></li>`;
    };
    return `<h2 class="rule">계약 결과 <small>계약금 합계 ${won(mine.reduce((n, t) => n + t.bonus, 0))}</small></h2>
      <ul class="event-list">${mine.map(line).join('')}</ul>
      ${others.length ? `<details><summary>다른 구단 지명 거부 ${others.length}건</summary><ul class="event-list">${others.map((t) => `<li>${esc(UI.teamName(t.teamId))} ${esc(g.picks.find((x) => x.playerId === t.playerId).label)} <b>${esc(player(g, t.playerId).name)}</b> <small>${esc(t.path)}</small></li>`).join('')}</ul></details>` : ''}`;
  }

  Object.assign(UI, { negotiation, contractResults, won, budgetBox });
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* Screen 3½: development ("육성") contracts with undrafted players, right after the draft. */
(function (root) {
  'use strict';
  const C = root.DraftCore,
    UI = root.DraftUI;
  const { esc, tag, hand } = UI;

  /** How many development contracts the club can still afford (at most the league limit). */
  const devLimit = (g) => Math.min(C.tuning.devContracts.max, Math.floor(C.budgetLeft(g) / C.tuning.contracts.devCost));

  function signing(g, chosen, role) {
    const max = devLimit(g),
      t = C.teamFor(g);
    const list = C.undrafted(g).filter((p) => role === 'ALL' || p.role === role).slice(0, 80);
    const chip = (id, name) => `<button class="chip" data-action="dev-role" data-id="${id}" aria-pressed="${role === id}">${name}</button>`;
    const rows = list
      .map((p) => {
        const on = chosen.has(p.id),
          full = !on && chosen.size >= max;
        return `<tr class="${on ? 'mine' : ''}">
          <td class="n">${p.rank}</td>
          <td><b>${esc(p.name)}</b> <small>${C.ROLES[p.role]} · ${esc(p.school)} · ${esc(p.pathway)} · ${hand(p)}${p.velocity ? ` · ${p.velocity}km/h` : ''}</small></td>
          <td class="n">${p.ready} / ${p.scoutCeiling}</td>
          <td class="hide-narrow">${esc(p.strength)}</td>
          <td><button class="btn small ${on ? 'primary' : 'quiet'}" data-action="dev-toggle" data-id="${p.id}" aria-pressed="${on}" ${full ? 'disabled' : ''}>${on ? '선택됨' : '선택'}</button></td>
        </tr>`;
      })
      .join('');
    const picked = [...chosen].map((id) => C.getPlayer(g, id));
    return `
    <div class="page-head">
      <h1>육성선수 계약</h1>
      <p>드래프트에서 지명되지 않은 선수와 육성선수 계약을 맺습니다. 1명에 ${UI.won(C.tuning.contracts.devCost)}이고, 지금 예산으로 ${max}명까지 가능합니다(리그 한도 ${C.tuning.devContracts.max}명). 육성선수는 첫 시즌에는 1군 주전이 될 수 없고, 이후에는 지명 선수와 똑같이 경쟁합니다. 우리가 먼저 고르고, 이어서 다른 구단들이 계약합니다.</p>
    </div>
    ${UI.contractResults(g)}
    <div class="cols">
      <section>
        <div class="chips" style="margin-bottom:8px">${[['ALL', '전체'], ...Object.entries(C.ROLES)].map(([id, name]) => chip(id, name)).join('')}</div>
        <div class="table-scroll"><table class="t">
          <thead><tr><th class="n">순위</th><th>선수</th><th class="n">현재 / 미래</th><th class="hide-narrow">스카우트 노트</th><th></th></tr></thead>
          <tbody>${rows || '<tr><td colspan="5" class="empty">남은 선수가 없습니다.</td></tr>'}</tbody>
        </table></div>
        <p class="note">미지명 선수 중 공개 순위 상위 80명까지 보여 줍니다.</p>
      </section>
      <aside class="box">
        <h3>${esc(t.short)} 육성선수 <small class="muted">${chosen.size}/${max}</small></h3>
        ${picked.length ? `<ul class="mine-list">${picked.map((p) => `<li><span>육성</span><b>${esc(p.name)}</b><span>${C.ROLES[p.role]}</span></li>`).join('')}</ul>` : '<p class="note">아직 고른 선수가 없습니다.</p>'}
        ${UI.budgetBox(g, C.spent(g) + chosen.size * C.tuning.contracts.devCost, '계약금 + 육성선수')}
        <div class="actions">
          <button class="btn primary wide" data-action="dev-confirm">${chosen.size ? `${chosen.size}명과 계약` : '계약 없이 넘어가기'}</button>
        </div>
      </aside>
    </div>
    ${UI.pickLog(g)}`;
  }

  Object.assign(UI, { signing, devLimit });
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* Screen 4: the GM's press conference promise and the rookies' first interviews. */
(function (root) {
  'use strict';
  const C = root.DraftCore,
    UI = root.DraftUI;
  const { esc, signed, player } = UI;

  /** The press conference: three questions, each answered once, then confirmed together. */
  function gm(g, answers = {}) {
    const qs = C.gmQuestions(g);
    if (g.gmChoice) {
      const chosen = qs.map((q) => ({ q, o: q.options.find((o) => o.id === (q.id === 'pledge' ? g.gmChoice : g.gmAnswers?.[q.id])) })).filter((x) => x.o);
      const pledge = chosen.find((x) => x.q.id === 'pledge').o;
      return `<section class="box gm-section">
        <h2>단장 기자회견 <small class="muted">답변 확정</small></h2>
        ${chosen
          .map(({ q, o }) => `<div style="margin-top:10px"><p class="note">${esc(q.question)}</p><blockquote style="margin:4px 0">${esc(o.answer)}</blockquote><p class="note">팬심 ${signed(o.delta)}${o.pledge ? ` · 약속: ${esc(o.pledge)}` : ''}</p></div>`)
          .join('')}
        <p><b>첫해 약속</b> ${esc(pledge.promise)}</p>
        <p class="note">${esc(pledge.reaction)} 약속은 정해진 시즌이 끝나면 평가합니다.</p>
      </section>`;
    }
    const ready = qs.every((q) => answers[q.id]);
    return `<section class="box gm-section">
      <h2>단장 기자회견</h2>
      <p>기자 질문 ${qs.length}개에 답합니다. 답변은 팬심에 반영되고, 약속한 것은 나중에 평가받습니다. 선수 성장에는 영향이 없습니다.</p>
      ${qs
        .map(
          (q, i) => `<h3 style="margin-top:14px">${i + 1}. ${esc(q.question)}</h3>
          <div class="options">${q.options
            .map((o) => {
              const on = answers[q.id] === o.id;
              return `<div class="${on ? 'chosen' : ''}">
                <h3>${esc(o.title)}</h3>
                <blockquote>${esc(o.answer)}</blockquote>
                ${o.promise ? `<p><b>평가 기준</b><br>${esc(o.promise)}</p>` : o.pledge ? `<p><b>약속</b> ${esc(o.pledge)}</p>` : ''}
                ${o.reaction ? `<p class="note">${esc(o.reaction)}</p>` : ''}
                <button class="btn ${on ? 'primary' : ''}" data-action="gm-answer" data-q="${q.id}" data-id="${o.id}" aria-pressed="${on}">${on ? '선택함' : '이 답변'} (팬심 ${signed(o.delta)})</button>
              </div>`;
            })
            .join('')}</div>`,
        )
        .join('')}
      <div class="actions"><button class="btn primary" data-action="gm-confirm" ${ready ? '' : 'disabled'}>답변 확정</button>${ready ? '' : '<span class="note">모든 질문에 답하면 확정할 수 있습니다.</span>'}</div>
    </section>`;
  }

  function devList(g) {
    const dev = (g.devSigns || []).filter((s) => s.teamId === g.teamId);
    if (!dev.length) return '';
    return `<h2 class="rule">육성선수 계약 <small>${dev.length}명</small></h2>
      <ul class="event-list">${dev
        .map((s) => {
          const p = player(g, s.playerId);
          return `<li><b>${esc(p.name)}</b> ${C.ROLES[p.role]} · ${esc(p.school)} · ${esc(p.pathway)} <small>${esc(p.strength)}</small></li>`;
        })
        .join('')}</ul>`;
  }

  function interviews(g, answers, plans = {}) {
    const quotes = C.mySignedPicks(g)
      .map((s) => {
        const p = player(g, s.playerId);
        return `<article class="box quote">
          <span class="kicker">${esc(s.label)} · ${C.ROLES[p.role]}</span>
          <h3>${esc(p.name)} <small class="muted">${esc(p.school)}</small></h3>
          <blockquote>${esc(C.interview(p, s, g, 'ceremony'))}</blockquote>
          <p class="note">${C.outlook(p)} · ${esc(p.personality)}</p>
        </article>`;
      })
      .join('');
    return `
    <div class="page-head"><h1>드래프트 종료</h1>
      <p>${esc(C.teamFor(g).short)}의 신인 ${C.mySignedPicks(g).length}명이 계약했습니다${C.refusals(g, g.teamId).length ? `(지명 거부 ${C.refusals(g, g.teamId).length}명)` : ''}. 기자회견을 마치면 ${C.ENTRY_YEAR} 시즌을 시작할 수 있습니다.</p></div>
    ${gm(g, answers)}
    <h2 class="rule">입단 소감</h2>
    <div class="quotes">${quotes}</div>
    ${devList(g)}
    ${g.gmChoice && !g.career ? UI.planPanel(g, plans, `${C.ENTRY_YEAR} 시즌 육성 계획`) : ''}
    ${UI.pickLog(g)}
    <div class="actions">
      <button class="btn primary" data-action="simulate" ${g.gmChoice ? '' : 'disabled'}>${g.career ? '시즌 화면으로 돌아가기' : `${C.ENTRY_YEAR} 시즌 진행`}</button>
      ${g.gmChoice ? '' : '<span class="note">먼저 기자회견 답변을 확정하세요.</span>'}
    </div>`;
  }

  Object.assign(UI, { gm, interviews });
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* Development plans: focus, position and two-way choices for our players before a season. */
(function (root) {
  'use strict';
  const C = root.DraftCore,
    UI = root.DraftUI;
  const { esc, tag, player, playerLink } = UI;

  const focusLabel = (key) => (key === 'balanced' ? '균형' : C.grades.LABELS[key] || key);

  /** `plans`: playerId → { role?, focus?, twoWay? } being edited. */
  function planPanel(g, plans, heading) {
    const opts = C.planOptions(g);
    if (!opts.length) return '';
    const F = C.tuning.focus;
    const rows = opts
      .map((o) => {
        const p = player(g, o.playerId),
          st = g.career?.players[o.playerId],
          cur = plans[o.playerId] || {},
          role = cur.role ?? o.role,
          kind = UI.kindOf(role),
          focus = cur.focus ?? (kind === o.kind ? o.focus : 'balanced'),
          twoWay = cur.twoWay ?? o.twoWay;
        const focusKeys = ['balanced', ...C.Career.FOCUS_KEYS[kind]];
        const opt = (v, label, on) => `<option value="${v}" ${on ? 'selected' : ''}>${esc(label)}</option>`;
        const roleSelect = o.roleOptions.length
          ? `<select data-plan-role="${esc(o.playerId)}" aria-label="${esc(p.name)} 포지션">${opt(o.role, `${C.ROLES[o.role]} 유지`, role === o.role)}${o.roleOptions
              .map((r) => opt(r, UI.kindOf(r) !== o.kind ? `${C.ROLES[r]} 전향` : `${C.ROLES[r]}로 이동`, role === r))
              .join('')}</select>`
          : `<span class="muted">${o.inService ? '복무 중' : C.ROLES[o.role]}</span>`;
        const showOther = o.twoWayCapable || o.roleOptions.includes(o.other.role);
        return `<tr>
          <td>${playerLink(p.id, p.name)}${o.twoWay ? ` ${tag('이도류')}` : ''}<small>${C.ROLES[o.role]} · 공개 기량 ${st?.scoutReady ?? p.ready} · FV ${st?.scoutFV ?? p.scoutCeiling}${showOther ? ` · ${C.ROLES[o.other.role]}로는 ${o.other.ready} / FV ${o.other.fv}` : ''}</small></td>
          <td>${roleSelect}</td>
          <td><select data-plan-focus="${esc(o.playerId)}" aria-label="${esc(p.name)} 육성 방향">${focusKeys.map((k) => opt(k, focusLabel(k), focus === k)).join('')}</select></td>
          <td>${o.twoWayCapable ? `<select data-plan-twoway="${esc(o.playerId)}" aria-label="${esc(p.name)} 투타 겸업">${opt('true', '겸업', twoWay)}${opt('false', '한쪽 전념', !twoWay)}</select>` : ''}</td>
        </tr>`;
      })
      .join('');
    return `<h2 class="rule">${esc(heading)}</h2>
      <p class="note">육성 방향을 정하면 그 능력은 ${F.chosen}배 빨리, 나머지는 ${F.others}배로 자랍니다. 포지션을 옮기면 첫 시즌은 적응 기간이라 1군 경쟁과 성장이 조금 불리합니다. 내야→외야는 수비가 쉬워지고, 외야→내야는 어려워집니다. 투수↔타자 전향은 만 ${C.tuning.positions.sideSwitchMaxAge}세까지 가능합니다. 이도류는 두 쪽 모두 뛰지만 각각 조금 느리게 자랍니다.</p>
      <div class="table-scroll"><table class="t plan-table"><thead><tr><th>선수</th><th>포지션</th><th>육성 방향</th><th>투타 겸업</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  Object.assign(UI, { planPanel, focusLabel });
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* Screens 5–6: the season hub, the all-club records room, a player's career and the draft review. */
(function (root) {
  'use strict';
  const C = root.DraftCore,
    UI = root.DraftUI;
  const { esc, tag, num, rate, teamName, player, playerLink } = UI;

  /** One row per drafted player, with stats for one season or the career total. */
  function rows(g, year = 'all', teamId = 'ALL', scope = 'origin', sort = 'rank', level = 'stats') {
    const years = g.career?.years || [],
      chosen = year === 'all' ? null : years.find((y) => String(y.year) === String(year)) || years.at(-1);
    const sum = (list) => Math.round(list.reduce((n, v) => n + (v || 0), 0) * 10) / 10;
    const out = C.signed(g)
      .flatMap((s) => {
        const p = player(g, s.playerId),
          state = g.career?.players[p.id],
          hist = g.career ? C.Career.history(g.career, p.id) : [];
        const rec = chosen ? chosen.records.find((r) => r.playerId === p.id) : null;
        // Position that season, or now for career totals; stats are totals for that kind of play.
        const role = (chosen ? rec?.role : state?.role) ?? p.role,
          kind = UI.kindOf(role);
        const secondWar = (r) => r.second?.war || 0;
        const base = {
          p, s, state, rec, role, kind,
          stats: chosen ? rec?.stats : C.Career.totalStats(hist, 'stats', kind),
          futures: chosen ? rec?.futures : C.Career.totalStats(hist, 'futures', kind),
          teamId: scope === 'origin' ? s.teamId : state ? state.currentTeamId : s.teamId,
          contribution: chosen ? rec?.contribution || 0 : hist.reduce((n, r) => n + r.contribution, 0),
          war: chosen ? Math.round(((rec?.war ?? 0) - (rec ? secondWar(rec) : 0)) * 10) / 10 : sum(hist.map((r) => (r.war || 0) - secondWar(r))),
          // Top velocity that season; for career totals, the latest one.
          velocity: chosen ? (UI.kindOf(role) === 'pitcher' ? rec?.velocity ?? null : null) : hist.findLast((r) => r.velocity && r.role === role)?.velocity ?? (role === p.role ? p.velocity : null) ?? null,
          honors: years.flatMap((y) => y.awards).filter((a) => a.playerId === p.id && (!chosen || a.year === chosen.year)).length,
        };
        // A two-way player also appears under his second side.
        const seconds = hist.filter((r) => r.second && (!chosen || r === rec));
        if (!seconds.length) return [base];
        const r2 = seconds.at(-1).second,
          kind2 = UI.kindOf(r2.role),
          wrap = (key) => seconds.map((r) => ({ [key]: r.second[key] }));
        return [
          base,
          {
            ...base,
            second: true,
            role: r2.role,
            kind: kind2,
            stats: C.Career.totalStats(wrap('stats'), 'stats', kind2),
            futures: C.Career.totalStats(wrap('futures'), 'futures', kind2),
            war: sum(seconds.map(secondWar)),
            velocity: kind2 === 'pitcher' ? seconds.findLast((r) => r.second.velocity)?.second.velocity ?? null : null,
          },
        ];
      })
      .filter((x) => teamId === 'ALL' || x.teamId === teamId);
    const value = (x) => {
      const st = x[level];
      const only = (kind, v) => (st?.kind === kind ? v : null);
      switch (sort) {
        case 'rank': return x.s.overall;
        case 'contribution': return x.contribution;
        case 'war': return x.war;
        case 'games': return st?.games ?? null;
        case 'hr': return only('hitter', st?.hr);
        case 'ops': return only('hitter', st?.ops);
        case 'wins': return only('pitcher', st?.wins);
        case 'era': return only('pitcher', st?.era);
        case 'outs': return only('pitcher', st?.outs);
        default: return x.honors;
      }
    };
    const ascending = sort === 'rank' || sort === 'era';
    return out.sort((a, b) => {
      const av = value(a), bv = value(b);
      if (av == null && bv != null) return 1;
      if (bv == null && av != null) return -1;
      return (av == null ? 0 : (av - bv) * (ascending ? 1 : -1)) || a.s.overall - b.s.overall;
    });
  }

  function recordTable(g, list, level = 'stats') {
    if (!list.length) return '<p class="empty">해당하는 선수가 없습니다.</p>';
    const mixed = list.some((x) => x.s.teamId !== g.teamId);
    return ['hitter', 'pitcher']
      .map((kind) => {
        const group = list.filter((x) => x.kind === kind);
        if (!group.length) return '';
        const labels = kind === 'hitter' ? ['G', 'PA', 'AVG', 'OBP', 'SLG', 'OPS', 'HR', 'RBI', 'SB'] : ['G', 'GS', 'IP', 'ERA', 'W', 'HLD', 'SV', 'K', 'BB', 'QS', '구속'];
        const body = group
          .map((x) => {
            const s = x[level];
            const values = !s
              ? labels.map((l) => (l === '구속' && x.velocity ? x.velocity : '—'))
              : kind === 'hitter'
