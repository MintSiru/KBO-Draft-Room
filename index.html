<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f2ec">
<meta name="description" content="가상의 KBO 신인 드래프트를 진행하고 지명한 선수들의 10년 경력을 시뮬레이션합니다.">
<title>드래프트 룸 v1.0.1 — KBO 신인 드래프트</title>
<style>
/* Draft Room — one stylesheet. Scorebook look: paper, ink rules, tables; the club colour is the only accent. */
:root {
  --paper: #f4f2ec;
  --surface: #fffdf8;
  --sunken: #ebe8df;
  --ink: #1c1c1a;
  --ink-2: #45443f;
  --muted: #6f6d66;
  --rule: #d8d4c8;
  --good: #2c6a3a;
  --warn: #8f5310;
  --bad: #a0302a;
  --club: #1c1c1a; /* replaced with the chosen club colour at runtime */
  --radius: 3px;
  color-scheme: light;
  font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', system-ui, -apple-system,
    'Segoe UI', sans-serif;
  font-size: 15px;
  line-height: 1.55;
  color: var(--ink);
  background: var(--paper);
  -webkit-text-size-adjust: 100%;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); }
h1, h2, h3, h4, p, ol, ul, blockquote { margin: 0; }
h1, h2, h3, h4 { line-height: 1.3; word-break: keep-all; }
p, li { word-break: keep-all; overflow-wrap: anywhere; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: 0.45; }
:focus-visible { outline: 2px solid var(--club); outline-offset: 2px; }
small { font-size: 13px; }
.num, td.n, th.n { font-variant-numeric: tabular-nums; text-align: right; }
.muted { color: var(--muted); }
.good { color: var(--good); }
.warn { color: var(--warn); }
.show-narrow { display: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }

/* ---------- Masthead, steps, footer ---------- */
.masthead { background: var(--surface); border-bottom: 2px solid var(--ink); border-top: 4px solid var(--club); }
.masthead .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px; flex-wrap: wrap; }
.wordmark { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.wordmark b { font-size: 20px; letter-spacing: -0.02em; }
.wordmark span { font-size: 13px; color: var(--muted); }
.masthead nav { display: flex; gap: 4px; flex-wrap: wrap; }
.steps { display: flex; gap: 0; list-style: none; padding: 0; margin: 14px 0 22px; border-bottom: 1px solid var(--rule); }
.steps li { font-size: 13px; color: var(--muted); padding: 8px 14px 8px 0; margin-right: 14px; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.steps li b { font-variant-numeric: tabular-nums; margin-right: 5px; }
.steps li.done { color: var(--ink-2); }
.steps li.now { color: var(--ink); font-weight: 700; border-bottom-color: var(--club); }
footer.colophon { border-top: 1px solid var(--rule); margin-top: 48px; padding: 18px 0 28px; font-size: 13px; color: var(--muted); }
footer.colophon .wrap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
main { min-height: 60vh; }

/* ---------- Type ---------- */
.page-head { margin: 4px 0 20px; }
.page-head h1 { font-size: 26px; letter-spacing: -0.02em; }
.page-head p { color: var(--ink-2); margin-top: 6px; max-width: 760px; }
.kicker { font-size: 13px; font-weight: 700; color: var(--club); display: block; margin-bottom: 4px; }
h2.rule { font-size: 18px; border-bottom: 1px solid var(--ink); padding-bottom: 6px; margin: 28px 0 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
h2.rule small { font-weight: 400; color: var(--muted); }
h3 { font-size: 16px; }
.note { font-size: 13px; color: var(--muted); margin: 8px 0; }
.callout { border-left: 3px solid var(--warn); background: var(--surface); padding: 10px 14px; font-size: 14px; margin: 12px 0; }
.callout.ok { border-left-color: var(--good); }

/* ---------- Controls ---------- */
.btn { white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--ink); background: var(--surface); border-radius: var(--radius); padding: 7px 13px; font-size: 14px; font-weight: 600; line-height: 1.3; text-decoration: none; }
.btn:hover:not(:disabled) { background: var(--sunken); }
.btn.quiet { border-color: var(--rule); font-weight: 500; }
.btn.small { padding: 4px 9px; font-size: 13px; }
.btn.primary { background: var(--club); border-color: var(--club); color: #fff; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.12); background: var(--club); }
.btn.wide { width: 100%; padding: 11px 16px; font-size: 15px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 22px 0 0; }
.actions .note { margin: 0; }
.link { border: 0; background: none; padding: 0; font-weight: 600; color: var(--ink); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; text-align: left; }
.link:hover { text-decoration-color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--ink); border-radius: var(--radius); overflow: hidden; }
.seg button { border: 0; border-left: 1px solid var(--ink); background: var(--surface); padding: 7px 14px; font-size: 14px; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed='true'] { background: var(--ink); color: #fff; font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { border: 1px solid var(--rule); background: var(--surface); border-radius: var(--radius); padding: 4px 9px; font-size: 13px; }
.chip[aria-pressed='true'] { border-color: var(--ink); background: var(--ink); color: #fff; }
select, input[type='search'], input[type='text'] { border: 1px solid var(--rule); background: var(--surface); border-radius: var(--radius); padding: 6px 8px; font-size: 14px; min-height: 34px; min-width: 0; }
label.field { display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--muted); }
label.field select { color: var(--ink); }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--club); margin: 0; }

/* ---------- Tags & grades ---------- */
.tag { display: inline-block; font-size: 12px; line-height: 1.4; padding: 1px 6px; border: 1px solid var(--rule); border-radius: 2px; color: var(--ink-2); background: var(--surface); white-space: nowrap; }
.tag.solid { background: var(--ink); border-color: var(--ink); color: #fff; }
.tag.good { color: var(--good); border-color: currentColor; }
.tag.warn { color: var(--warn); border-color: currentColor; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.g { font-variant-numeric: tabular-nums; font-weight: 700; }
.g70 { color: #0d5c2f; } .g60 { color: var(--good); } .g50 { color: var(--ink); } .g40 { color: var(--ink-2); } .g30 { color: var(--muted); }
.bar { display: inline-block; width: 70px; height: 6px; background: var(--sunken); vertical-align: middle; margin-left: 8px; position: relative; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--ink-2); }
.team-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }

/* ---------- Boxes & tables ---------- */
.box { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 16px 18px; }
.box + .box { margin-top: 14px; }
.cols > .box + .box { margin-top: 0; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 22px; align-items: start; }
.cols.even { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cols.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.table-scroll { overflow-x: auto; max-width: 100%; overscroll-behavior-x: contain; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; background: var(--surface); }
table.t th { font-size: 12px; font-weight: 600; color: var(--muted); text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--ink); white-space: nowrap; }
table.t td { padding: 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.t th.n, table.t td.n { text-align: right; }
table.t tr.mine td { background: color-mix(in srgb, var(--club) 7%, var(--surface)); }
table.t tr.mine td:first-child { box-shadow: inset 3px 0 0 var(--club); }
table.t td small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
table.record-table { white-space: nowrap; }
table.record-table td:first-child, table.record-table th:first-child { position: sticky; left: 0; background: var(--surface); z-index: 1; }
dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 14px; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; }

/* ---------- Setup ---------- */
.club-table button { width: 100%; text-align: left; }
.club-table tr { cursor: pointer; }
.club-table tr:hover td { background: var(--sunken); }
.club-table tr[aria-selected='true'] td { background: color-mix(in srgb, var(--club) 9%, var(--surface)); }
.club-table tr[aria-selected='true'] td:first-child { box-shadow: inset 3px 0 0 var(--club); }
.club-table .pick-btn { border: 0; background: none; padding: 0; font-weight: 700; }
.settings-row { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--rule); flex-wrap: wrap; }
.settings-row:first-of-type { border-top: 0; padding-top: 0; }
.settings-row p { font-size: 13px; color: var(--muted); flex-basis: 100%; }
.club-sheet h2 { font-size: 22px; display: flex; align-items: center; gap: 8px; }
.club-sheet .team-dot { width: 12px; height: 12px; }
.scouting-club { margin: 14px 0; }
.scouting-club h3 { font-size: 15px; margin-bottom: 6px; }
.scouting-club ul { list-style: none; padding: 0; border-top: 1px solid var(--rule); }
.scouting-club li { padding: 7px 0; border-bottom: 1px solid var(--rule); font-size: 14px; }
.scouting-club li span { display: block; font-size: 13px; color: var(--muted); }

/* ---------- Mock drafts & recommendations ---------- */
.outlet h2 { font-size: 18px; }
.outlet > p { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.hit { color: var(--good); font-weight: 600; }
.recommendation { border-top: 3px solid var(--rule); }
.recommendation.primary { border-top-color: var(--club); }
.recommendation h3 { font-size: 20px; margin: 4px 0 2px; }
.grade-row { display: flex; gap: 18px; margin: 10px 0; }
.grade-row div { font-size: 12px; color: var(--muted); }
.grade-row b { display: block; font-size: 24px; color: var(--ink); font-variant-numeric: tabular-nums; }

/* ---------- Draft board ---------- */
.on-clock { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
.on-clock h1 { font-size: 24px; }
.on-clock .count { font-size: 14px; color: var(--muted); }
.on-clock .count b { font-size: 22px; color: var(--ink); }
.round-strip { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); border: 1px solid var(--rule); background: var(--surface); margin-bottom: 14px; }
.round-strip div { padding: 6px 8px; border-left: 1px solid var(--rule); font-size: 13px; min-width: 0; }
.round-strip div:first-child { border-left: 0; }
.round-strip b { display: block; font-size: 12px; }
.round-strip span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.round-strip .you { background: var(--ink); color: #fff; }
.round-strip .you span { color: #fff; }
.board-tools { display: grid; gap: 8px; padding-bottom: 10px; border-bottom: 1px solid var(--ink); }
.board-tools .line { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.board-tools input[type='search'] { flex: 1 1 180px; }
.roster { max-height: 560px; overflow-y: auto; }
.player-row { display: grid; grid-template-columns: 36px minmax(0, 1fr) 84px 64px; gap: 8px; align-items: center; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--rule); background: var(--surface); padding: 8px 6px; }
.player-row:hover { background: var(--sunken); }
.player-row[aria-pressed='true'] { background: color-mix(in srgb, var(--club) 9%, var(--surface)); box-shadow: inset 3px 0 0 var(--club); }
.player-row .rk { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.player-row .nm { font-weight: 700; }
.player-row .nm small { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 4px; }
.player-row .meta { display: block; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player-row .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.player-row .val small { display: block; font-size: 11px; font-weight: 400; color: var(--muted); }
.player-row .fit { font-size: 12px; text-align: right; color: var(--muted); }
.player-row .fit.core { color: var(--good); font-weight: 700; }
.roster-head { display: grid; grid-template-columns: 36px minmax(0, 1fr) 84px 64px; white-space: nowrap; gap: 8px; font-size: 12px; color: var(--muted); padding: 6px; }
.roster-head span:nth-child(n + 3) { text-align: right; }
.empty { padding: 28px 12px; text-align: center; color: var(--muted); }
.profile { position: sticky; top: 12px; }
.profile-body h2 { font-size: 24px; }
.profile-body .sub { color: var(--ink-2); font-size: 14px; }
.profile-body section { border-top: 1px solid var(--rule); padding-top: 10px; margin-top: 12px; }
.profile-body h4 { font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
.stat-line { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 14px; }
.stat-line b { font-size: 18px; font-variant-numeric: tabular-nums; margin-right: 3px; }
.tool-grade-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.tool-grade-table th, .tool-grade-table td { padding: 4px 0; border-bottom: 1px solid var(--rule); text-align: left; }
.tool-grade-table th { font-weight: 500; }
.tool-grade-table thead th { font-size: 12px; color: var(--muted); border-bottom-color: var(--ink); }
.tool-grade-table td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.overall { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-bottom: 10px; }
.overall div { font-size: 12px; color: var(--muted); }
.overall b { display: block; font-size: 22px; color: var(--ink); font-variant-numeric: tabular-nums; }
.advice ul { padding-left: 18px; font-size: 14px; }
.advice li { margin: 3px 0; }
.favorite-note { font-size: 14px; }
details > summary { cursor: pointer; font-weight: 600; font-size: 14px; }
details[open] > summary { margin-bottom: 6px; }
.history { list-style: none; padding: 0; font-size: 14px; }
.history li { padding: 4px 0; border-bottom: 1px dotted var(--rule); }
.history li small { display: block; color: var(--muted); }
.mine-list { list-style: none; padding: 0; font-size: 14px; }
.mine-list li { display: grid; grid-template-columns: 58px 1fr auto; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--rule); }
.mine-list li span:last-child { color: var(--muted); font-size: 13px; }
.log-list { columns: 2; column-gap: 22px; font-size: 13px; margin-top: 6px; }
.log-list div { break-inside: avoid; padding: 3px 0; border-bottom: 1px dotted var(--rule); }

/* ---------- After the draft ---------- */
.gm-section .options { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-top: 12px; }
.gm-section .options > div.chosen { border-color: var(--club); box-shadow: inset 3px 0 0 var(--club); }
.budget-box dl { margin: 8px 0; }
.updates { margin-top: 14px; }
.updates ul { margin: 8px 0 10px; padding-left: 18px; font-size: 14px; }
.changelog details { border-bottom: 1px solid var(--rule); padding: 8px 0; }
.changelog summary { font-weight: 700; cursor: pointer; }
.changelog h3, .changelog h4 { margin: 12px 0 4px; font-size: 15px; }
.changelog ul { padding-left: 18px; margin: 4px 0; }
.changelog li, .changelog p { font-size: 14px; margin: 3px 0; }
.gm-section .options > div { border: 1px solid var(--rule); padding: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
.gm-section .options .btn { margin-top: auto; }
.gm-section blockquote, .quote blockquote { font-size: 15px; border-left: 3px solid var(--rule); padding-left: 12px; color: var(--ink-2); }
.quotes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.quote h3 { font-size: 17px; }
.quote blockquote { margin-top: 8px; }
.summary-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--rule); background: var(--surface); margin: 12px 0; }
.summary-strip div { padding: 10px 14px; border-left: 1px solid var(--rule); font-size: 13px; color: var(--muted); }
.summary-strip div:first-child { border-left: 0; }
.summary-strip b { display: block; font-size: 22px; color: var(--ink); font-variant-numeric: tabular-nums; }
.year-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--ink); margin: 6px 0 4px; flex-wrap: wrap; }
.year-tabs button { border: 1px solid transparent; border-bottom: 0; background: none; padding: 7px 14px; font-size: 14px; color: var(--muted); margin-bottom: -1px; }
.year-tabs button[aria-pressed='true'] { border-color: var(--ink); background: var(--paper); color: var(--ink); font-weight: 700; }
.development-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.development-grid article { border: 1px solid var(--rule); padding: 10px 12px; background: var(--surface); font-size: 14px; }
.development-grid .move { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; margin: 4px 0; }
.development-grid .move small { font-size: 12px; font-weight: 400; color: var(--muted); }
.development-grid p { font-size: 13px; color: var(--ink-2); }
.tool-snapshot { margin: 8px 0; font-size: 13px; }
.tool-snapshot h4 { font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
.tool-snapshot div { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.tool-snapshot b { font-variant-numeric: tabular-nums; margin-left: 4px; }
.standings td:first-child { width: 32px; }
.event-list { list-style: none; padding: 0; }
.event-list li { padding: 8px 0; border-bottom: 1px solid var(--rule); font-size: 14px; }
.event-list li small { display: block; color: var(--muted); }
.grade-card { text-align: left; }
.grade-card .letter { font-size: 64px; font-weight: 800; line-height: 1; color: var(--club); }
.grade-card .score { font-size: 18px; font-variant-numeric: tabular-nums; }
.score-bars { display: grid; gap: 10px; }
.score-bars div { font-size: 14px; }
.score-bars span { display: block; height: 6px; background: var(--sunken); margin-top: 4px; }
.score-bars span i { display: block; height: 100%; background: var(--club); }
.record-filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
.record-filters label { flex: 1 1 130px; }
.record-filters select { width: 100%; }
.career-profile h2 { font-size: 24px; }
.career-profile h3 { font-size: 16px; margin: 18px 0 6px; border-bottom: 1px solid var(--ink); padding-bottom: 4px; }
.career-profile p { font-size: 14px; margin: 4px 0; }
.year-report { border-bottom: 1px solid var(--rule); padding: 8px 0; font-size: 14px; }
.year-report header { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.news-article { border-bottom: 1px solid var(--rule); padding: 14px 0; }
.news-article h3 { font-size: 18px; margin: 2px 0 6px; }
.news-article .comments { margin-top: 8px; font-size: 14px; }
.news-article .comments p { padding: 4px 0; border-top: 1px dotted var(--rule); }
.fan-timeline { list-style: none; padding: 0; font-size: 14px; }
.fan-timeline li { display: grid; grid-template-columns: 1fr 48px 48px; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--rule); }
.catalog-list details { border-bottom: 1px solid var(--rule); padding: 8px 0; }
.catalog-list ul { columns: 2; column-gap: 18px; list-style: none; padding: 0; font-size: 14px; }
.catalog-list li { break-inside: avoid; padding: 2px 0; }
.catalog-list li span { color: var(--muted); font-size: 13px; margin-left: 6px; }
.guide ol { padding-left: 20px; font-size: 14px; }
.guide li { margin: 6px 0; }

/* ---------- Modal & toast ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgb(28 28 26 / 0.45); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px; overflow-y: auto; }
.modal { width: 100%; max-width: 580px; background: var(--surface); border: 1px solid var(--ink); border-radius: var(--radius); }
.modal.wide { max-width: 920px; }
.modal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--ink); }
.modal-head h2 { font-size: 17px; }
.modal-body { padding: 16px 18px 20px; max-height: 78vh; overflow-y: auto; }
.modal-body .actions { margin-top: 16px; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 9px 16px; border-radius: var(--radius); font-size: 14px; z-index: 70; max-width: 90%; }

/* ---------- Narrow screens ---------- */
@media (max-width: 960px) {
  .cols { grid-template-columns: minmax(0, 1fr); }
  .cols.three { grid-template-columns: minmax(0, 1fr); }
  .profile { position: static; }
  .round-strip { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .round-strip div:nth-child(6) { border-left: 0; }

}

  .player-row, .roster-head { grid-template-columns: 30px minmax(0, 1fr) 72px; }
  .show-narrow { display: inline; }
  .player-row .fit, .roster-head span:nth-child(4) { display: none; }

  .masthead nav .btn { padding: 5px 9px; font-size: 13px; }
  .hide-narrow { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

<script>
window.DraftChangelog = "# 변경 이력\n\n## 1.0.1 — 이도류 보조 포지션 스카우팅\n\n게임 결과는 1.0.0과 같습니다(시뮬레이션 지문 일치). 1.0.0 저장이 그대로 열립니다.\n\n- **보조 포지션 스카우팅**: 이도류 유망주의 선수 정보에 보조 포지션 카드(현재·미래 가치·플로어·실링과 툴별 현재·미래 등급)가 주 포지션 카드 아래에 붙습니다.\n- **선수 경력**\n  - 이도류 선수에게 지명 당시 보조 포지션 평가와 보조 포지션의 현재 세부 기량(종합·FV)을 보여 줍니다.\n  - 해마다 보조 포지션의 시즌 종료 평가가 나옵니다.\n- 투타 전향한 선수는 현재 세부 기량이 전향한 포지션 기준으로 표시됩니다(이전에는 지명 당시 포지션의 툴 이름으로 나왔습니다). 반대쪽 기량도 함께 보여 줍니다.\n\n## 1.0.0 — 이도류·포지션 변경·육성 방향 (E단계)\n\n선수 성장 규칙이 추가되어 `SIM_VERSION`을 1.0으로 올렸습니다. 0.9 이전 저장은 이어 할 수 없습니다(자동 저장은 따로 보관합니다).\n\n- **육성 방향**: 첫 시즌 전과 비시즌마다 우리 선수별로 집중할 능력을 고릅니다(투수: 구위·커맨드·변화구·체력, 타자: 컨택·장타력·주력·수비·선구안). 고른 능력은 1.6배 빨리, 나머지는 0.85배로 자랍니다. 상무에서도 적용됩니다.\n- **포지션 변경**\n  - 선발↔불펜: 불펜으로 가면 짧은 이닝이라 구위가 조금 오르고, 선발로 가면 조금 내려갑니다.\n  - 포수→내야·외야, 내야↔외야: 외야로 가면 수비가 쉬워지고, 외야→내야는 어려워집니다. 포지션 가치(WAR 보정)도 바뀝니다.\n  - 투수↔타자 전향: 만 26세까지 가능합니다. 선수마다 반대쪽 재능이 숨어 있고, 스카우트가 가능성을 본 선수는 공개 평가가 보입니다.\n  - 옮긴 첫 시즌은 적응 기간이라 1군 경쟁과 성장이 조금 불리합니다.\n  - CPU 구단도 체력이 약한 선발을 불펜으로, 수비가 약한 포수를 내야로 옮기고, 드물게 투타 전향을 시킵니다.\n- **이도류**\n  - 선수 풀에 드물게(풀당 0–2명) 투타 겸업 유망주가 나옵니다. 드래프트 보드와 선수 정보에 표시됩니다.\n  - 겸업 중에는 두 쪽 모두 뛰고 두 쪽 모두 자라지만, 각각 0.75배로 느립니다. 두 번째 포지션은 1군 주전은 못 하고 백업·대타·짧은 등판으로 나섭니다.\n  - 언제든 한쪽에 전념하도록 바꿀 수 있습니다. CPU 구단은 3년 차부터 두 쪽 차이가 크면 겸업을 접습니다.\n  - 기록실에는 두 번째 포지션 기록이 따로 한 줄 나오고, WAR은 두 쪽을 합칩니다.\n- 기록실은 지명 당시가 아니라 그 시즌(또는 지금)의 포지션으로 투수·야수를 나누고, 통산 기록도 포지션 종류별로 따로 셉니다. 선수 경력에 포지션 변경 이력과 육성 방향이 나옵니다.\n\n## 0.9.0 — 계약 협상·지명 거부·기자회견 (D단계)\n\n협상 규칙이 추가되어 `SIM_VERSION`을 0.9로 올렸습니다. 0.8 이전 저장은 이어 할 수 없습니다(자동 저장은 따로 보관합니다).\n\n- **구단 예산**: 구단마다 신인 예산이 정해집니다(약 12–15억 원, 지역 1차를 켜면 3억 원 추가). 계약금과 육성선수 계약이 모두 이 예산에서 나갑니다.\n- **계약 협상**\n  - 드래프트가 끝나면 지명한 선수마다 계약금을 한 번 제시합니다. 선수는 받아들이거나, 금액을 올려 다시 요구하거나, 거부합니다.\n  - 요구액은 지명 순번의 관례 금액과 선수의 공개 순위로 정해집니다.\n  - 어릴 때 응원한 팀에는 요구액이 낮고 협상도 잘 풀립니다(쉬움 난이도에서만 응원 팀이 보입니다). 난이도가 높을수록 협상이 조금 더 어렵습니다.\n  - CPU 구단도 예산 안에서 협상합니다. 리그 전체에서 드래프트마다 2–3명이 계약을 거부합니다.\n- **진학 희망·해외 구단 관심**\n  - 고졸 후보 일부는 대학 진학을 생각한다고 밝히고, 드물게 최상위 후보는 해외 구단의 관심을 받습니다.\n  - 이런 선수는 요구액이 높고 거부할 가능성도 큽니다. 드래프트 보드와 선수 정보에 표시됩니다.\n- **지명 거부**\n  - 계약을 거부한 선수는 대학에 진학하거나 해외 구단과 계약합니다. 지명권은 돌아오지 않습니다.\n  - 거부한 선수는 최종 평가 인원에 포함되고, 팬심도 1명마다 3점 떨어집니다.\n- **육성선수 계약 비용**: 1명에 3000만 원입니다. 예산이 모자라면 5명을 다 채울 수 없습니다.\n- **육성 지원금**: 계약금과 육성선수 계약 뒤 남은 예산은 첫 3시즌 동안 그 구단 선수들의 성장 속도를 최대 15% 높입니다.\n- **단장 기자회견 개편**: 기자 질문 세 개에 답합니다.\n  - 첫 지명 선수를 뽑은 이유: 즉시 전력이라고 답하면 첫해 1군 출전을, 길게 키운다고 답하면 4시즌 안에 주전을 약속하게 됩니다.\n  - 계약 결과: 지명 거부, 과한 지출, 남은 예산 가운데 상황에 맞는 질문이 나옵니다.\n  - 약속: 기존 세 가지에 '5년 안에 주전 셋'을 추가했습니다.\n  - 약속은 정해진 시즌이 끝나면 평가되어 팬심에 반영됩니다.\n- **업데이트 기록**: 시작 화면에서 최신 변경 내용을 보고, 전체 업데이트 기록을 열 수 있습니다.\n\n## 0.8.0 — 10시즌·병역·은퇴 (C단계)\n\n시즌 규칙이 바뀌어 `SIM_VERSION`을 0.8로 올렸습니다. 0.7 이전 저장은 이어 할 수 없습니다(자동 저장은 따로 보관합니다).\n\n- **10시즌**: 2027–2036년까지 진행합니다. 중간 평가는 언제든 볼 수 있습니다.\n- **데뷔율 조정**\n  - 이전 규칙은 콜업 기준이 낮아, 10년이면 11라운드 지명자의 98%가 1군에 데뷔하고 한 드래프트에서 구단당 주전이 9명씩 나왔습니다.\n  - 콜업·주전 기준을 1군 기존 선수 수준으로 올리고, 같은 포지션 동기 주전 정원을 줄였습니다.\n  - 나이가 들수록 성장 폭이 줄도록 해서, 나이 많은 지명자는 상한까지 다 크지 못합니다.\n  - 결과(600회, 10년 누적): 1군 데뷔는 1라운드 99%, 3라운드 87%, 5라운드 66%, 8라운드 41%, 11라운드 27%, 육성선수 23%. 한 드래프트에서 나오는 주전은 구단당 한 해 최대 2.7명 안팎입니다.\n- **병역**\n  - 현역(18개월), 사회복무요원(21개월), 상무(퓨처스에서 뛰며 복무), 예술체육요원(특례).\n  - 2년 차부터 비시즌마다 우리 선수의 입대를 정합니다(구단 판단, 상무 지원, 현역 입대, 미루기). 만 28세가 되는 해에는 입대해야 합니다.\n  - 상무는 지원해도 떨어질 수 있습니다. 현역·사회복무요원은 기량이 조금 떨어지고, 전역한 해에는 시즌 중반에 돌아옵니다.\n- **국가대표**\n  - 2028 LA 올림픽: 동메달 이상이면 특례.\n  - 2030 도하·2034 리야드 아시안게임: 25세 이하와 와일드카드를 뽑고, 금메달이면 특례.\n- **은퇴와 재입단**\n  - 방출된 선수는 다른 구단에 입단하거나, 1년 뒤 은퇴합니다.\n  - 1군 기회가 없거나 재활이 이어지거나 기량이 떨어진 선수는 스스로 은퇴하기도 합니다.\n  - 10년 뒤 선수로 남는 비율은 약 52%입니다.\n- **기록**\n  - 타자는 출루율·장타율을, 투수는 9이닝당 삼진·볼넷을 보여 줍니다.\n  - 게임 내 추정 WAR을 기록실·선수 경력·최종 평가에 씁니다. 최종 평가의 기여 항목도 WAR 기준입니다.\n- **성적 분포 조정**: 규정 수준 타자의 중앙값이 .273/.340/.427, 선발투수 ERA 중앙값이 3.94, 9이닝당 삼진 7.3·볼넷 3.3입니다. 선발 승수와 이닝을 줄였고, 불펜 삼진은 늘렸습니다. 마무리 기준을 올리고 시즌 홈런 상한도 조금 낮췄습니다.\n- **FV 재평가**: 스카우트가 매 시즌 나이와 발전을 보고 미래 가치를 다시 매깁니다. 트레이드 가치에도 반영됩니다.\n- **팬심**: 시즌마다 순위, 우승, 동기 주전 수, 국가대표 메달에 따라 움직입니다. 오래된 감정은 해마다 조금씩 옅어집니다.\n- **다른 팀에서 온 동기**: 시즌 화면에서 트레이드나 재입단으로 우리 팀에 온 선수의 기록을 따로 보여 줍니다. 비시즌 이동은 우리 팀 것을 먼저 보여 주고, 다른 구단 것은 접어 둡니다.\n- **이름**: 2005–2010년생에 흔한 이름, 외자 이름, 드문 성(남궁·황보·제갈·선우·독고 포함)을 추가했습니다. 성 비율은 실제 인구 비율에 가깝게 맞췄습니다.\n- **난이도 이름**: 이지·노말·하드를 쉬움·보통·어려움으로 바꿨습니다.\n- 예제 저장을 `examples/demo-ten-seasons.json`(10시즌, 상무 지원 포함)으로 바꿨습니다.\n\n## 0.7.0 — 선수 풀 400명·라운드 선택·육성선수 (B단계)\n\n선수 생성 규칙이 바뀌어 `SIM_VERSION`을 0.7로 올렸습니다. 0.6.x 저장은 이어 할 수 없습니다(자동 저장은 지우지 않고 따로 보관합니다).\n\n- **선수 풀 400명**: 8개 지역 × 50칸(고졸 264, 대졸 56, 대학 얼리 24, 2년제 24, 독립 12, 해외 대학 6, 마이너·해외독립 복귀 13, 특수 1).\n  - **2년제 대학**: 8개교와 전용 리그, '퓨처 베이스볼배 전문대학 야구대회'를 추가했습니다. 4년제 얼리와 같은 나이지만 조금 더 완성된 상태로 나오고, 대졸 의무 지명 대상입니다.\n  - **드문 경력**: 야구 유학파(일본·미국 고교, 풀당 약 20%), MLB 경험 복귀(약 12%), NPB 2군·CPBL·LMB·ABL 복귀(약 15%).\n  - 학교·구단 83곳을 추가해 소속 명단이 243곳이 됐습니다.\n  - 연고 지역 선수는 45% 확률로 연고 구단을 좋아하는 구단으로 꼽습니다.\n- **구속 분포 개편**: 투수마다 어깨 힘을 뽑아 구속에 크게, 구위에 조금 반영합니다. 공개 순위 1–10위 중앙값 151km/h, 61–110위 145km/h입니다. 공은 빠르지만 제구가 낮아 60위 밖으로 밀린 148km/h 이상 투수가 풀마다 20명 남짓 나옵니다.\n- **라운드 선택**: 5·8·11라운드 중에서 고릅니다(기본 11).\n- **육성선수 계약**: 드래프트 직후 미지명 선수 중 최대 5명과 계약합니다. CPU 구단도 3–5명씩 계약하고, 육성선수는 첫 시즌 1군 주전이 될 수 없습니다. 기록실과 5년 추적에 함께 나옵니다.\n- **팬심 버그 수정**: 지역 1차를 켜면 1라운드 상위 지명을 꿀픽으로 잘못 판정하던 문제를 고쳤습니다.\n- 스카우트 노트·댓글·인터뷰에 2년제·유학파 문장과 \"구속에 비해 공이 가볍다\" 유형을 추가했습니다.\n\n## 0.6.4 — 문장·이름·대회 다듬기 (A단계)\n\n게임 결과는 그대로입니다. 시뮬레이션 지문이 일치하고, 600회 밸런스 실험 결과도 바이트 단위로 같습니다. 기존 저장도 그대로 열립니다.\n\n- **연도별 구속**: 투수의 최고 구속이 해마다 실제 구위 변화를 따라 오르내립니다. 보직·성장 카드, 선수 경력(전년 대비), 기록실 투수 표에 표시됩니다.\n- **학교·구단 이름 89곳 수정**: AI·반도체·해양·항공 같은 특수학교와 달빛·솔바람·누리 같은 작명을 지명 기반의 현실적인 가상 이름으로 바꿨습니다. 바뀐 목록은 `audit/renames-v063.csv`에 있고, 전체 명단을 NEIS와 대조하는 `audit/check-catalog-neis.py`를 추가했습니다.\n- **전국대회**\n  - 고교: 권역 주말리그 4강 32개교가 '다이아몬드 데일리배 전국고교야구대회'에 나갑니다.\n  - 대학: 3개 권역 리그 4강 12개교가 '퓨처 베이스볼배 대학야구 왕중왕전'에 나갑니다.\n  - 선수 프로필에 권역·전국 성적이 나오고, 결승 진출은 수상 경력에 들어갑니다.\n- **문장 전면 개편** (`core/writer.js`, `core/voices.js`)\n  - 스카우트 노트: 공개 능력치·구속·성장 여지로 짧게 씁니다. 같은 유형이어도 선수마다 다릅니다.\n  - 기사: 날짜·순번·출신교·나이·아마추어 기록·구속·관계자 멘트로 구성합니다.\n  - 댓글: 닉네임 23개 + 구단 팬 닉네임 중에서 상황(보강, 이른 지명, 꿀픽, 연고, 구속, 포지션 중복…)에 맞춰 3개가 달립니다.\n  - 입단 소감·감독 코멘트·팀장 조언·시즌 보직 설명도 여러 표현 중에서 고릅니다.\n- 문장 선택은 모두 시뮬레이션과 분리된 난수로 합니다. 문장을 얼마나 고쳐도 결과와 기존 저장이 바뀌지 않습니다.\n- golden 테스트는 새로 붙는 설명용 필드에 흔들리지 않도록, 시뮬레이션 값만 골라 비교하는 `sim` 지문으로 바꿨습니다.\n\n### 알려진 문제 (B단계에서 수정)\n- 지역 1차를 켜면, 팬심 계산이 1라운드 상위 지명을 \"앞 순번 선수를 늦게 잡은 꿀픽\"으로 잘못 판정합니다. 지명 번호에 지역 1차 10명이 포함되기 때문입니다. 기사 문장은 이번에 바로잡았지만, 팬심 숫자는 시뮬레이션 값이라 B단계에서 `SIM_VERSION`을 올릴 때 함께 고칩니다.\n- 하위 라운드 투수의 구속이 130대 후반–140대 초반에 몰려 있습니다. 선수 생성 규칙을 바꿔야 해서 B단계에서 고칩니다.\n\n## 0.6.3 — 시즌 시뮬레이션 분리와 튜닝 파일\n\n게임 결과는 0.6.2와 같습니다. golden 테스트가 일치하고, 600회 밸런스 실험 결과가 바이트 단위로 같습니다. 저장 호환에도 변화가 없습니다(`SIM_VERSION` 0.6 유지).\n\n- 시즌·경력·평가의 밸런스 숫자 282개(연차별·구간 배열 값 포함)를 `src/core/tuning.js` 한 곳에 이름과 설명을 붙여 모았습니다. 실수로 바뀌지 않게 잠가 두었습니다.\n- 약 250줄이던 `simulatePlayer`를 단계별 함수로 나눴습니다. 부상 `rollHealth`, 보직 `decideRole`, 출전 경기 `firstTeamGames`/`futuresGames`, 기록 `hitterStats`/`pitcherStats`, 성장 `developTools`, 점수 `performanceOf`/`contributionOf`/`planScoreOf`입니다.\n- `career.js`의 리그 승률, 개인상, 방출·트레이드, 5년 평가 숫자도 옮겼습니다. 소수 상수가 하나도 남지 않았습니다.\n- 튜닝 값 검사와 보직 규칙·성장 상한·계획 점수 범위 단위 테스트를 추가했습니다.\n\n## 0.6.2 — 저장 형식 정리\n\n게임 규칙과 결과는 0.6.1과 같습니다(골든 마스터 일치).\n\n- 저장이 게임의 입력(설정·시드·내 지명·기자회견 답·진행 시즌 수)만 담습니다. 5년 진행 파일이 1.3MB에서 약 360바이트로 줄었고, 화면을 그릴 때마다 560KB를 직렬화하던 자동 저장도 가벼워졌습니다.\n- 저장에 시뮬레이션 버전(`sim`)을 기록합니다. 버전이 다른 저장은 다른 결과로 다시 만들지 않고 거부합니다. 자동 저장은 따로 보관하고 안내합니다.\n- `tests/golden.cjs`가 시뮬레이션 결과가 바뀌면 `SIM_VERSION`을 올리도록 강제합니다.\n- v0.6.0 저장은 계속 불러오고, 새 형식으로 바꿔 저장합니다. 1.3MB 데모는 호환성 테스트용 `tests/fixtures/legacy-v060-save.json`으로 옮기고, `examples/demo-five-seasons.json`을 새 형식으로 넣었습니다.\n- `release.py`가 zip에 `tests/fixtures/`를 포함합니다.\n\n## 0.6.1 — 코드 정리와 화면 개편\n\n게임 규칙과 밸런스는 0.6.0과 같습니다. 모든 선수 생성·지명·시즌 결과가 0.6.0과 똑같은지 골든 마스터와 600회 밸런스 실험으로 확인했습니다. 0.6.0 저장 파일도 그대로 열립니다.\n\n### 화면\n- 스타일시트 6개를 하나로 합치고 화면을 새로 만들었습니다. 종이·잉크 톤의 표 중심 화면에, 고른 구단 색 하나만 강조색으로 씁니다.\n- 영어 장식 라벨, 광고 카피체 제목, 히어로 배너, 게임 속 변경 이력 배너, 반복 면책 문구를 걷어 냈습니다.\n- 기본 글씨를 15px로 키우고, 8–10px 글씨를 없앴습니다.\n- 드래프트 보드 기본 정렬에서 선수의 현재/미래 등급을 바로 보여 줍니다.\n- 시즌 화면의 `1/5` 줄바꿈 깨짐을 고쳤습니다.\n\n### 코드\n- 저장소를 `src/core`, `src/ui`, `src/styles` 구조로 정리했습니다. 루트에 흩어져 있던 파일과 남아 있던 V0.5 소스·테스트를 치웠습니다.\n- 한 줄에 수천 자이던 코드를 읽을 수 있게 펼쳤습니다. 버전 번호 파일명(`view05`, `rules04`, `grades06` …)을 역할 이름으로 바꿨습니다.\n- 인터뷰·코멘트·조언 문장을 `core/voices.js`로 분리했습니다.\n- 저장 복원을 “입력만 읽고 전부 다시 계산”하는 방식으로 바꿨습니다. 문구 수정이 기존 저장을 무효로 만들지 않고, CPU 지명 변조를 잡아냅니다.\n- 숨은 전역 상태(`activePool`)를 없애고, 중복된 보강 점수 공식을 합쳤습니다. 공개 선수 투영은 캐시합니다.\n- 조사 오류(“현재 기량와/는/가”), 구단 마크 충돌(롯데 `LG`, KIA `KT` 등), 인터뷰의 지명 순번 계산을 고쳤습니다.\n- 쓰이지 않던 파일·함수·필드를 삭제했습니다.\n- `release.py`가 저장소 밖이 아니라 `dist/`에 결과를 만듭니다.\n\n## 0.6.0 — Read the Player\n\nV0.5 테스트 피드백에 대응한 독립 빌드입니다.\n\n### 수정\n- 매년 다시 추첨되던 안착 비중을 줄이고 기존 보직의 유지·축소·재활을 구분했습니다.\n- 루키 출전량을 모든 연차에 적용하던 제한을 없앴습니다.\n- 선발 5승 상한과 지나치게 낮은 홈런 산식을 교체했습니다.\n- 세부 툴별 성장과 완성 시기를 도입하고 공개 전망·실제 상한의 의미를 분리했습니다.\n- 최대어급 전망의 생성 빈도를 낮췄습니다. 실제 지명 라운드로 잠재력을 깎지 않습니다.\n- 공개 기량을 시즌 시작/종료로 구분하여 콜업과 성장 시점의 혼동을 줄였습니다.\n- 20–80 전환 중 발견한 아마추어 도루의 음수 경계값을 보정했습니다.\n- 작은 화면의 진행 단계 일부 가림을 2행 배치로 수정했습니다.\n\n### 추가\n- 20–80 현재 기량·미래 가치·플로어·실링과 투수/야수 세부 툴.\n- 즉전감·플로어·실링 중복 태그와 후보 필터.\n- 모의 지명 뒤 스카우트 팀장 추천 1명·대안 2명, 성향과 세부 보강.\n- 시즌별 보직 이유·공개 기량 변화 카드, 세부 툴 경력 조회.\n- 해외 복귀 8개 후보 슬롯, 희귀한 짧은 MLB 경력, 가상 소속 28개.\n- 이지 전용 선호 구단 공개. 노말·하드에서는 숨깁니다.\n- 투수 선발·QS 기록과 승수 정렬.\n\n### 유지 및 제외\n전국 7라운드·대졸 의무·대학 얼리·5시즌·수상·자동 이적·기록실·뉴스·팬심을 유지합니다. 계약 협상·지명 거부는 다음 버전 후보이며 구현하지 않았습니다. V0.5 저장과 호환되지 않습니다.\n";

/* 20–80 scouting scale.

  const LABELS = {
    stuff: '구위',
    command: '커맨드',
    breaking: '변화구',
    stamina: '체력',
    contact: '컨택',
    power: '장타력',
    speed: '주력',
    defense: '수비',
    eye: '선구안',
  };
  const WEIGHTS = {
    SP: { stuff: 0.3, command: 0.25, breaking: 0.25, stamina: 0.2 },
    RP: { stuff: 0.4, command: 0.25, breaking: 0.3, stamina: 0.05 },
    C: { contact: 0.28, power: 0.2, speed: 0.04, defense: 0.48 },
    IF: { contact: 0.34, power: 0.26, speed: 0.1, defense: 0.3 },
    OF: { contact: 0.32, power: 0.35, speed: 0.14, defense: 0.19 },
  };

  const overall = (tools, role) => Object.entries(WEIGHTS[role]).reduce((a, [k, w]) => a + tools[k] * w, 0);

  // Base-grade range for each talent band. The pool has 110/56/24/8/2 players per band.
  const TALENT_BANDS = [[34, 43], [43, 49], [49, 56], [56, 62], [63, 69]];
  // Tool offsets per archetype index (see ARCHETYPES in prospects.js).
  const PITCHER_SHAPES = [
    { stuff: 11, command: -6, breaking: 1, stamina: -2 }, // power arm
    { stuff: -5, command: 12, breaking: -2, stamina: 3 }, // command
    { stuff: -3, command: 2, breaking: 10, stamina: 0 }, // breaking ball
    { stuff: 0, command: 7, breaking: 2, stamina: 2 }, // sinker / control
    { stuff: 3, command: -5, breaking: 10, stamina: 5 }, // big curveball
  ];
  const HITTER_SHAPES = [
    { contact: 0, power: -7, speed: 5, defense: 10 }, // glove first
    { contact: -2, power: 15, speed: -8, defense: -5 }, // slugger
    { contact: 10, power: -6, speed: 6, defense: 1 }, // contact
    { contact: 3, power: -4, speed: 0, defense: 6 }, // balanced / eye
    { contact: 0, power: -5, speed: 12, defense: 4 }, // speed

      (growthCurve === 'late' ? 2 : 0) +

            potentialTools[k] * (rawProject ? 0.65 : 0.83) +
              trueTools[k] * (rawProject ? 0.35 : 0.17) +
              observerBias * 0.6,

      velocity,
      ready,
      trueReady,
      upside,
      scoutCeiling,
      ceilingGrade,
      floorGrade,
      tools,
      futureTools,
      trueTools,
      potentialTools,
      uncertainty,
      pickTags,
      growthCurve,

    if (f.local) add('반가움', ['연고지 출신이라 더 정감 간다', '동네 학교 출신 반갑다', `${p.school} 경기 몇 번 봤는데 잘하더라`]);
    if (isPitcher(p) && p.velocity >= 148) add('기대', [`${p.velocity} 던지는 신인이면 일단 합격`, '구속은 확실히 매력 있다', '제구만 잡히면 무섭겠다']);

    else add('인내', ['2~3년은 기다려야 할 듯', '퓨처스에서 몸 좀 만들고 오자', '급하게 쓰지 말고 제대로 키우자']);
    if (p.pathway === '독립구단') add('응원', ['독립리그에서 버틴 거 대단하다', '다시 기회 잡은 거 멋지다']);
    if (p.pathway === '대졸') add('담담', ['대학 4년 동안 꾸준했지', '대졸이라 적응은 빠를 듯']);
    if (p.pathway === '2년제') add('담담', ['2년제에서 몸 좀 만들고 나왔겠지', '전문대 리그 기록 좋던데', '고졸 때보다 확실히 성장했다더라']);

      ['기동형 유격수', '첫발과 넓은 수비 범위가 돋보인다.', '프로 일정에 버틸 체력을 늘려야 한다.', '체력 보강'],

    ],
    OF: [
      ['중견수 유망주', '빠른 첫발과 넓은 수비 범위를 갖췄다.', '타석에서 공격 범위가 넓은 편이다.', '선구안'],
      ['장타형 외야수', '높은 타구 속도와 담장을 넘길 힘이 있다.', '삼진을 줄이고 코너 수비를 다져야 한다.', '변화구 대응'],
      ['콘택트 외야수', '배트 컨트롤과 반대 방향 타격이 좋다.', '장타를 늘리기 위한 근력이 부족하다.', '타구 질'],

      ['기동형 외야수', '주루 판단과 번트, 작전 수행이 좋다.', '강한 타구를 꾸준히 만드는 것이 과제다.', '타격 중심 이동'],
    ],
  };
  // Amateur tournaments. Descriptive only: results come from their own streams and never change players.
  const HS_NATIONAL = '다이아몬드 데일리배 전국고교야구대회',
    COLLEGE_NATIONAL = '퓨처 베이스볼배 대학야구 왕중왕전',
    JUNIOR_COLLEGE_NATIONAL = '퓨처 베이스볼배 전문대학 야구대회',
    NATIONAL_QUALIFIERS = 4; // top four of each regional/conference event go to the national event
  const COLLEGE_CONFERENCES = [

    ['충청·호남권', ['대전·충청·전북', '광주·전남·제주']],

  const placeLabel = (i) => (i === 0 ? '우승' : i === 1 ? '준우승' : i < 4 ? '4강' : i < 8 ? '8강' : '예선');
  const strength = (s) => Bio.TIERS[s.tier].team;

  /** Single-elimination bracket; the strongest entrants get byes up to the next power of two. */
  function bracket(entrants, r) {
    let size = 1;
    while (size < entrants.length) size *= 2;
    const seeded = [...entrants].sort((a, b) => strength(b) - strength(a) || a.id.localeCompare(b.id));
    const reached = new Map(seeded.map((s) => [s.id, size]));
    // Standard seeding so top seeds meet late (1 v 16, 8 v 9, ...); missing low seeds are byes.
    let order = [0];
    while (order.length < size) order = order.flatMap((i) => [i, order.length * 2 - 1 - i]);
    let round = order.map((i) => seeded[i] ?? null);
    for (let alive = size; alive > 1; alive /= 2) {
      const next = [];
      for (let i = 0; i < round.length; i += 2) {
        const [a, b] = [round[i], round[i + 1]];
        const winner = !a ? b : !b ? a : r() < 1 / (1 + Math.exp((strength(b) - strength(a)) * 4)) ? a : b;
        if (winner) reached.set(winner.id, alive / 2);
        next.push(winner);
      }
      round = next;
    }
    return reached; // id -> best round reached (1 = champion, 2 = final, 4 = semi-final ...)
  }
  const roundLabel = (n) => (n === 1 ? '우승' : n === 2 ? '준우승' : `${n}강`);

  function schoolHonors(seed) {
    const map = {};
    // Regional events. The seed key keeps its original label so the rankings (and players) stay the same.
    const regional = REGIONS.map((region) => ({
      key: region + ' 고교대회',
      label: region + ' 권역 주말리그',
      list: Cat.institutions.filter((x) => ['high-school', 'hs-club'].includes(x.kind) && x.region === region),
    }));
    const hsQualifiers = [];
    for (const group of regional) {
      const r = rng(seed + '-school-event-' + group.key);
      const ranks = group.list.map((s) => ({ s, score: Bio.TIERS[s.tier].team * 60 + r() * 55 })).sort((a, b) => b.score - a.score);
      ranks.forEach(({ s }, i) => {
        map[s.id] = { event: group.label, result: placeLabel(i), award: i < 2 ? `${group.label} ${placeLabel(i)}` : null, national: null };
        if (i < NATIONAL_QUALIFIERS) hsQualifiers.push(s);
      });
    }
    // College league: one ranking over all colleges (original stream), read per conference.
    const colleges = Cat.institutions.filter((x) => x.kind === 'college');
    const r = rng(seed + '-school-event-전국 대학대회');
    const collegeRank = colleges.map((s) => ({ s, score: Bio.TIERS[s.tier].team * 60 + r() * 55 })).sort((a, b) => b.score - a.score).map((x) => x.s);
    const collegeQualifiers = [];
    for (const [name, regions] of COLLEGE_CONFERENCES) {
      const label = `대학리그 ${name}`;
      collegeRank.filter((s) => regions.includes(s.region)).forEach((s, i) => {
        map[s.id] = { event: label, result: placeLabel(i), award: i < 2 ? `${label} ${placeLabel(i)}` : null, national: null };
        if (i < NATIONAL_QUALIFIERS) collegeQualifiers.push(s);
      });
    }
    // Two-year colleges: one league, then the top four meet in their own tournament.
    const juniors = Cat.institutions.filter((x) => x.kind === 'college2');
    const rj = rng(seed + '-school-event-2년제');
    const juniorQualifiers = [];
    juniors
      .map((s) => ({ s, score: Bio.TIERS[s.tier].team * 60 + rj() * 55 }))
      .sort((a, b) => b.score - a.score)
      .forEach(({ s }, i) => {
        map[s.id] = { event: '전문대학 리그', result: `${i + 1}위`, award: i === 0 ? '전문대학 리그 1위' : null, national: null };
        if (i < NATIONAL_QUALIFIERS) juniorQualifiers.push(s);
      });
    // National events from the qualifiers.
    for (const [event, entrants] of [[HS_NATIONAL, hsQualifiers], [COLLEGE_NATIONAL, collegeQualifiers], [JUNIOR_COLLEGE_NATIONAL, juniorQualifiers]]) {
      const reached = bracket(entrants, rng(seed + '-national-' + event));
      for (const s of entrants) {
        const result = roundLabel(reached.get(s.id));
        map[s.id].national = { event, result, award: reached.get(s.id) <= 2 ? `${event} ${result}` : null };
      }
    }
    return map;
  }

  // Pool composition. Each of the 8 regions gets 50 slots: 33 high-schoolers and 17 others (136 in total).
  const POOL_SIZE = 400,
    SLOTS_PER_REGION = 50,
    HIGH_SCHOOL_PER_REGION = 33;
  const OTHER_PATHWAYS = [
    ['대졸', 56],
    ['대학 얼리', 24],
    ['2년제', 24],
    ['독립구단', 12],
    ['해외파', 6],
    ['마이너 복귀', 10],
    ['해외독립 복귀', 3],
  ];
  // One returnee slot is special: rarely a brief MLB career or another foreign league, otherwise the minors.
  const RARE_RETURN = { mlb: 0.12, otherLeague: 0.15 };
  const STUDY_ABROAD_CHANCE = 0.2; // one high-school slot per pool, sometimes, is a player who studied abroad
  // Talent bands; the extra depth of a 400-player pool sits mostly in the lower bands.
  const BAND_COUNTS = [250, 100, 36, 11, 3];
  const repeat = (value, n) => Array(n).fill(value);

  const pitcherRole = (role) => role === 'SP' || role === 'RP';
  /** Index into the club list. Players lean towards a club from the region where they grew up. */
  function favoriteTeam(region, r) {
    const local = CLUBS.map((t, i) => (t.region === region ? i : -1)).filter((i) => i >= 0);
    if (local.length && r() < TUNING.generation.localFavorite) return local[Math.floor(r() * local.length)];
    return Math.floor(r() * CLUBS.length);
  }
  function rollRole(r) {
    const roll = r();
    return roll < 0.32 ? 'SP' : roll < 0.49 ? 'RP' : roll < 0.58 ? 'C' : roll < 0.81 ? 'IF' : 'OF';
  }
  function throwingHand(role, type, r) {
    if (pitcherRole(role)) return type === 2 || r() < 0.21 ? '좌' : '우'; // type 2 is the changeup lefty
    return role === 'OF' && r() < 0.25 ? '좌' : '우';
  }
  const battingHand = (r) => (r() < 0.015 ? '양' : r() < 0.43 ? '좌' : '우');

  function generatePool(seed) {
    const r = rng(seed + '-pool-v6'),
      usedNames = new Set(),
      players = [],
      honors = schoolHonors(seed);
    const rare = rng(seed + '-rare-return')();
    const special = rare < RARE_RETURN.mlb ? 'MLB 경험 복귀' : rare < RARE_RETURN.mlb + RARE_RETURN.otherLeague ? '해외리그 복귀' : '마이너 복귀';
    const otherPaths = shuffle([...OTHER_PATHWAYS.flatMap(([path, n]) => repeat(path, n)), special], r);
    const abroad = rng(seed + '-study-abroad');
    const studyAbroadSlot = abroad() < STUDY_ABROAD_CHANCE ? Math.floor(abroad() * HIGH_SCHOOL_PER_REGION * REGIONS.length) : -1;
    const bands = shuffle(
      BAND_COUNTS.flatMap((n, band) => repeat(band, n)),
      rng(seed + '-talent-bands'),
    );
    const othersPerRegion = SLOTS_PER_REGION - HIGH_SCHOOL_PER_REGION;
    for (let i = 0; i < POOL_SIZE; i++) {
      const regionIndex = Math.floor(i / SLOTS_PER_REGION),
        slot = i % SLOTS_PER_REGION,
        region = REGIONS[regionIndex],
        hsIndex = regionIndex * HIGH_SCHOOL_PER_REGION + slot,
        pathway =
          slot >= HIGH_SCHOOL_PER_REGION
            ? otherPaths[regionIndex * othersPerRegion + slot - HIGH_SCHOOL_PER_REGION]
            : hsIndex === studyAbroadSlot
              ? '야구 유학'
              : '고졸',
        high = pathway === '고졸';
      const identity = Names.makeName(r, usedNames),
        bio = Bio.makeBiography(r, region, pathway),
        { name } = identity,
        { school, age } = bio;
      const schoolStyle = SCHOOL_STYLES[hash(bio.currentInstitutionId) % SCHOOL_STYLES.length];
      const reputation = Bio.TIERS[bio.schoolTier] || { ready: 0, team: 0.52 };
      const schoolTournament = honors[bio.currentInstitutionId] || null;
      const role = rollRole(r),
        pitcher = pitcherRole(role);
      const type = Math.floor(r() * 5),
        a = ARCHETYPES[role][type];
      const talent = G.make(role, type, bio, bands[i], r);
      const { ready, trueReady, upside, scoutCeiling, publicScore, control, power, speed, defense } = talent;
      const throwHand = throwingHand(role, type, r);
      const batHand = battingHand(r);
      const velocity = talent.velocity;
      const height = type === 4 && role === 'SP' ? 190 + Math.floor(r() * 7) : 174 + Math.floor(r() * 19),
        weight = round(68 + (height - 174) * 0.6 + r() * 15 + (type === 1 && !pitcher ? 7 : 0));
      const awards = [];
      if (high && ready >= 45 && r() < 0.35) awards.push('U-18 대표팀');
      if (['대졸', '대학 얼리', '2년제'].includes(pathway) && ready >= 45 && r() < 0.25) awards.push('대학 대표팀');
      // Shared school results: school reputation affects team success, not a direct AVG/ERA multiplier.
      if (schoolTournament?.award) awards.push(schoolTournament.award);
      if (schoolTournament?.national?.award) awards.push(schoolTournament.national.award);
      if (ready >= 45 && r() < 0.25) awards.push(pitcher ? '소속 대회 우수투수상' : '소속 대회 타격상');
      const record = amateurRecord(
        {
          role,
          ready,
          control,
          power,
          speed,
          schoolTier: bio.schoolTier,
          teamSupport: 0.85 + reputation.team * 0.4,
        },
        r,
      );
      if (bio.proExperience) applyOverseasRecord(record, bio.proExperience.level, pitcher, talent, r);
      players.push({
        id: 'p' + String(i + 1).padStart(3, '0'),
        ...identity,
        ...bio,
        ...talent,
        region,
        pathway,
        school,
        schoolStyle,
        schoolTournament,
        role,
        type,
        archetype: a[0],
        focus: a[3],
        age,
        height,
        weight,
        throwHand,
        batHand,
        ready,
        trueReady,
        upside,
        scoutCeiling,
        publicScore,
        velocity,
        control,
        power,
        speed,
        defense,
        awards,
        record,
        risk: 0.05 + r() * 0.11,
        personality: pick(PERSONALITIES, r),
        favoriteTeam: favoriteTeam(bio.highSchoolRegion, r),
        lateDevelopment: talent.growthCurve === 'late',
        confidence: record.games >= 25 ? '보통' : '관찰 표본 적음',
      });
    }
    // Scouting notes come from the public grades on a text-only stream, after all players are generated.
    for (const p of players) Object.assign(p, W.scoutNotes(p, rng(seed + '-notes-' + p.id)));
    players.sort((a, b) => b.publicScore - a.publicScore || a.id.localeCompare(b.id));
    players.forEach((p, i) => (p.rank = i + 1));
    // The other side of each player, then two-way prospects. Own streams: talent above is unaffected.
    const A = TUNING.altTalent,
      ar = rng(seed + '-alt-talent'),
      tw = rng(seed + '-two-way');
    const twoWayIds = new Set();
    const eligible = players.filter((p) => p.rank <= A.twoWay.maxRank && !p.proExperience);
    for (const chance of A.twoWay.chances) if (tw() < chance && eligible.length) twoWayIds.add(eligible.splice(Math.floor(tw() * eligible.length), 1)[0].id);
    for (const p of players) Object.assign(p, altSide(p, twoWayIds.has(p.id), ar));
    // Public scouting card for the other side (future grades, floor, ceiling). Display only, own stream per player.
    for (const p of players) p.alt.scouting = altScouting(p.alt, rng(seed + '-alt-scout-' + p.id));
    // Announced intentions (public): a few high-school players would rather go to college, and a rare
    // top prospect has interest from abroad. Own stream, so talent and ranks are unaffected.
    const I = TUNING.contracts.intent,
      ir = rng(seed + '-intent');
    let abroadCount = 0;
    for (const p of players) {
      p.intent = null;
      if (p.pathway !== '고졸' && p.pathway !== '야구 유학') continue;
      if (p.rank <= I.abroadMaxRank && p.scoutCeiling >= I.abroadMinFV && abroadCount < I.abroadMax && ir() < I.abroadChance) {
        p.intent = 'abroad';
        abroadCount++;
      } else if (p.scoutCeiling >= I.collegeMinFV && ir() < I.collegeShare) p.intent = 'college';
    }
    return { players, byId: Object.fromEntries(players.map((p) => [p.id, p])), seed: String(seed) };
  }
  /**
   * The other side of a player: hidden tools (`trueTools`, `potentialTools`) and a public estimate.
   * Pitchers' other side is a hitter (outfield or infield); hitters' is a pitcher (mostly relief).
   */
  function altSide(p, twoWay, r) {
    const A = TUNING.altTalent,
      V = TUNING.generation.velocity,
      pitcher = pitcherRole(p.role);
    const role = pitcher ? (r() < 0.6 ? 'OF' : 'IF') : twoWay && r() < 0.5 ? 'SP' : 'RP';
    const centre = twoWay ? p.upside - (A.twoWay.below[0] + r() * A.twoWay.below[1]) : A.base[0] + r() * A.base[1] + Math.max(0, p.upside - 45) * A.athleticism;
    const young = p.pathway === '고졸' || p.pathway === '야구 유학',
      [g0, gs] = young ? A.gap.young : A.gap.older,
      gap = g0 + r() * gs;
    const keys = G.keys(role).concat(pitcherRole(role) ? [] : ['eye']);
    const potentialTools = {},
      trueTools = {},
      tools = {};
    for (const k of keys) {
      potentialTools[k] = clamp(centre + normal(r) * 4, 20, 80);
      trueTools[k] = Math.min(potentialTools[k], clamp(potentialTools[k] - gap * (k === 'speed' ? 0.4 : 1), 20, 80));
      tools[k] = G.grade(trueTools[k] + normal(r) * 5);
    }
    const ready = G.grade(G.overall(tools, role)),
      scoutCeiling = Math.max(ready, G.grade(G.overall(potentialTools, role) * 0.8 + G.overall(trueTools, role) * 0.2 + normal(r) * 3));
    const velocity = pitcherRole(role) ? Math.round(clamp(V.base + (trueTools.stuff - V.pivot) * V.perStuff + normal(r) * V.noise * 2, V.min, V.max)) : null;
    return { twoWay, alt: { role, trueTools, potentialTools, tools, ready, scoutCeiling, ceilingGrade: scoutCeiling, velocity, upside: G.overall(potentialTools, role) } };
  }
  /** Scouts' future grades for the other side. Never read by the simulation. */
  function altScouting(alt, r) {
    const futureTools = Object.fromEntries(
      Object.keys(alt.tools).map((k) => [k, Math.max(alt.tools[k], G.grade(alt.potentialTools[k] * 0.8 + alt.trueTools[k] * 0.2 + normal(r) * 3))]),
    );
    return {
      futureTools,
      floorGrade: Math.min(alt.scoutCeiling, Math.max(alt.ready - 5, G.grade(alt.scoutCeiling - 9))),
      ceilingGrade: Math.max(alt.scoutCeiling, G.grade(alt.upside + normal(r) * 4)),
    };
  }
  /** Replaces the amateur line with a last overseas season (or a short MLB sample). */
  function applyOverseasRecord(record, level, pitcher, talent, r) {
    const { ready, control, power, speed } = talent;
    const mult = level === 'MLB' ? 0.33 : level === 'AAA' ? 0.84 : level === 'AA' ? 0.94 : 1.05;
    record.games = level === 'MLB' ? 4 + Math.floor(r() * 12) : record.games + 15;
    if (pitcher) {
      record.outs = level === 'MLB' ? 9 + Math.floor(r() * 70) : record.outs + 100;
      record.er = Math.max(
        1,
        round((record.outs / 27) * (5.9 - (ready - 35) * 0.085 + (level === 'MLB' ? 1 : 0))),
      );
      record.era = round((record.er * 27) / record.outs, 2);
      record.k = round((record.outs / 3) * (0.5 + talent.tools.stuff / 110));
      record.bb = round((record.outs / 3) * Math.max(0.15, 0.75 - control / 105));

        ? Math.max(C.early.min, C.early.start - yearIndex * C.early.perYear)
        : p.growthCurve === 'late'
          ? yearIndex < C.late.switchYear ? C.late.firstYears : C.late.later
          : C.normal;
    const A = Gr.ageTaper,
      over = age - A.fullUntil - (p.growthCurve === 'late' ? A.lateShift : 0),
      taper = clamp(1 - over / (A.zeroAt - A.fullUntil), A.floor, 1);
    const after = {};
    for (const [key, v] of Object.entries(tools)) {
      const speed = key === 'speed' ? 'speed' : 'other';
      const gap = p.potentialTools[key] - v,
        aging = Math.max(0, age - Gr.agingFrom[speed]) * Gr.agingPerYear[speed];
      const gain =
        gap * rate * taper * scale * focusFactor(focus, key) * (1 + boost) * p.developmentRate * (key === 'speed' ? Gr.speedShare : 1) * (1 - daysLost / H.growthDays) +
        normal(r) * Gr.noise -
        aging -
        (daysLost > H.heavyInjuryDays ? H.heavyInjuryGrowthPenalty : 0);
      after[key] = round(clamp(v + clamp(gain, Gr.minGain, Gr.maxGain), 20, p.potentialTools[key]), 3);
    }
    return after;
  }

  function performanceOf(stats) {
    const P = T.scores.performance;
    if (!stats.games) return 0;
    return stats.kind === 'pitcher' ? clamp((P.eraPivot - stats.era) / P.eraScale, -P.limit, P.limit) : clamp((stats.ops - P.opsPivot) / P.opsScale, -P.limit, P.limit);
  }

  function contributionOf(stats, tools) {
    const C = T.scores.contribution;
    if (!stats.games) return 0;
    return stats.kind === 'pitcher'
      ? clamp((stats.outs / 3) * C.perInning + (C.eraPivot - stats.era) * C.perEra, 0, 100)
      : clamp(stats.pa * C.perPA + (stats.ops - C.opsPivot) * C.perOps + (tools.defense - C.defensePivot) * C.perDefense, 0, 100);
  }

  /** 10–100: did the player grow as much as his public projection implied, and did he play? */
  function planScoreOf(p, { startGrade, growth, yearIndex, games, route, daysLost }) {
    const E = T.scores.expectedGrowth,
      Pr = T.scores.progress,
      L = T.scores.plan;
    const expected = Math.max(E.min, (p.scoutCeiling - startGrade) * (p.ceilingGrade - startGrade >= E.projectGap && yearIndex < E.projectYears ? E.projectShare : E.share));
    const progress = startGrade >= p.scoutCeiling - Pr.nearCeiling ? 1 : clamp(growth / expected, 0, Pr.max);
    return round(clamp(L.base + progress * L.perProgress + (games ? L.played : 0) + (route === 'regular' ? L.regular : 0) - (daysLost > T.health.planPenaltyDays ? T.health.planPenalty : 0), L.min, L.max));
  }

  // ---------------------------------------------------------------- text

  const ROUTE_LABELS = { backup: '백업·보조 역할', cameo: '짧은 1군 경험', futures: '퓨처스 육성', rehab: '장기 재활' };
  function routeLabel(route, core, pitcher) {
    return route === 'regular' ? (core ? (pitcher ? '핵심 투수' : '핵심 주전') : '1군 안착') : ROUTE_LABELS[route];
  }
  const REASONS = {
    'development-first': ['시즌 시작 기량으로는 1군 문턱을 넘지 못했다. 퓨처스에서 실전을 쌓았다.', '올해는 퓨처스에서 경기 수를 채우는 데 집중했다.', '1군보다 2군 실전이 먼저라는 판단이었다.'],
    'long-rehab': ['부상으로 {days}일을 쉬었다. 시즌 대부분을 재활로 보냈다.', '{days}일 공백. 올해는 재활이 전부였다.'],
    'role-retained': ['지난해 자리를 그대로 지켰다.', '작년에 따낸 1군 자리를 올해도 놓치지 않았다.', '보직 경쟁 없이 자리를 이어 갔다.'],
    'poor-form-and-ability': ['지난해 부진이 길었고 기량도 떨어졌다. 퓨처스로 내려가 다시 만들었다.', '부진과 기량 하락이 겹쳤다. 2군에서 재정비했다.'],
    'poor-form': ['지난해 부진으로 역할이 줄었다. 백업에서 다시 시작했다.', '성적이 떨어지면서 출전 기회도 줄었다.'],
    'role-competition': ['1군에는 남았지만 경쟁에서 밀려 출전이 줄었다.', '자리는 지켰지만 경쟁자와 기회를 나눠 가졌다.'],
    'cohort-competition': ['같은 포지션 동기들이 먼저 자리를 차지했다. 백업부터 시작했다.', '동기들과의 자리 싸움에서 한발 늦었다.'],
    'earned-role': ['캠프에서 경쟁을 이겨 1군 자리를 따냈다.', '시즌 초반부터 1군에 자리를 잡았다.', '기회를 받자마자 자리를 굳혔다.'],
    'trial-opportunity': ['1군에서 몇 차례 시험 기회를 받았다.', '1군과 2군을 오가며 기회를 받았다.'],
    'trial-investment': ['상위 지명 선수답게 1군 맛을 봤다.', '구단이 기대를 걸고 1군 기회를 줬다.'],
  };
  /** Why the player had this role. Text only, from its own stream. */
  function reasonText(reason, daysLost, investment, r) {
    const key = reason === 'trial-opportunity' && investment > 0 ? 'trial-investment' : reason;
    const line = REASONS[key][Math.floor(r() * REASONS[key].length)].replace('{days}', daysLost);
    return line + (daysLost && reason !== 'long-rehab' ? ` 부상으로 ${daysLost}일 결장했다.` : '');
  }
  /** Top velocity for the season (pitchers). Draws from its own stream, so it never affects results. */
  function seasonVelocity(p, after, r) {
    if (!isPitcher(p) || p.velocity == null) return null;
    const V = T.velocity;
    return round(clamp(p.velocity + (after.stuff - p.trueTools.stuff) * T.generation.velocity.perStuff + normal(r) * V.noise, V.min, V.max));
  }
  const growthLabel = (growth) => T.scores.growthLabels.find(([min]) => growth >= min)?.[1] ?? '기량 후퇴';

  const pickLine = (lines, r) => lines[Math.floor(r() * lines.length)];
  const RETURN_NOTES = ['전역하고 시즌 중반에 팀으로 돌아왔다.', '여름에 전역해 남은 시즌을 소화했다.', '복무를 마치고 시즌 도중 합류했다.'];

  /**
   * Public future value after a season. Scouts blend last year's estimate with what the player now looks
   * able to reach: current ability plus the part of his ceiling that his age still leaves room for.
   * Returns the unrounded estimate (stored so next year's blend does not compound rounding).
   */
  function fvUpdate(p, ability, age, yearIndex, previousRaw, r) {
    const F = T.futureValue;
    const room = clamp((F.matureAge + (p.growthCurve === 'late' ? F.lateShift : 0) - age) / F.window, 0, 1) * Math.min(1, p.developmentRate);
    const reachable = ability + Math.max(0, p.upside - ability) * room;
    const estimate = reachable + (p.observerBias || 0) / (1 + yearIndex) + normal(r) * F.noise;
    return previousRaw * (1 - F.weight) + estimate * F.weight;
  }

  /**
   * Wins above replacement, a simple estimate from the season line (not an official formula).
   * Hitters: linear-weight batting runs + position + fielding + steals + replacement level.
   * Pitchers: runs allowed per nine against a replacement pitcher for the role.
   */
  function warOf(stats, p, tools) {
    const W = T.war;
    if (!stats.games) return 0;
    if (stats.kind === 'pitcher') {
      const P = W.pitching,
        ip = stats.outs / 3;
      if (!ip) return 0;
      const replacement = P.leagueRA9 + (stats.gs >= stats.games / 2 ? P.replacement.SP : P.replacement.RP);
      return round(((replacement - stats.era * P.eraToRA) * ip) / 9 / W.runsPerWin, 1);
    }
    const H = W.hitting,
      w = H.weights,
      singles = stats.hits - stats.doubles - stats.triples - stats.hr;
    if (!stats.pa) return 0;
    const woba = (w.bb * stats.bb + w.single * singles + w.double * stats.doubles + w.triple * stats.triples + w.hr * stats.hr) / stats.pa;
    const share = stats.games / H.seasonGames;
    const runs =
      ((woba - H.league) / H.scale) * stats.pa +
      H.position[p.role] * share +
      (tools.defense - 50) * H.perDefense * share +
      stats.sb * H.perSB +
      (H.replacementPer600 * stats.pa) / 600;
    return round(runs / W.runsPerWin, 1);
  }

  const SERVICE_LABELS = { sangmu: '상무 (군 복무)', army: '현역 복무', social: '사회복무요원' };
  const SERVICE_NOTES = {
    sangmu: ['상무에서 퓨처스리그 경기를 뛰며 복무했다.', '상무 소속으로 퓨처스리그에 꾸준히 나섰다.', '상무에서 실전 감각을 유지했다.'],
    army: ['현역으로 복무하며 야구를 쉬었다. 전역 뒤 몸을 다시 만들어야 한다.', '현역 복무로 한 시즌을 비웠다.', '군 복무 기간이라 공을 잡지 못했다.'],
    social: ['사회복무요원으로 근무하며 퇴근 뒤 개인 훈련을 이어 갔다.', '사회복무요원 복무 중. 개인 운동으로 감각을 유지했다.'],
  };

  /** A season spent in military service. Sangmu plays a futures season; other service loses some sharpness. */
  function serviceSeason(p, selection, g, team, previous, yearIndex, type, focus = 'balanced') {
    const tag = (stream) => `${g.seed}-${stream}-v6-${yearIndex}-${p.id}`;
    const tools = { ...previous.tools },
      abilityBefore = G.overall(tools, p.role);
    const age = D.bio.ageAt(p.birthday, `${D.bio.ENTRY_YEAR + yearIndex}-12-31`);
    let after, futures;
    if (type === 'sangmu') {
      after = developTools(p, tools, yearIndex, age, 0, rng(tag('growth')), 0, focus);
      futures = statsFor(p, futuresGames(p, 'futures', 0, 0, rng(tag('performance'))), tools, 'futures', rng(tag('farm')), { teamRank: team.rank });
    } else {
      const r = rng(tag('growth')),
        [base, width] = T.service.decline[type];
      after = Object.fromEntries(
        Object.entries(tools).map(([k, v]) => [k, round(clamp(v - (base + r() * width) * (k === 'stuff' || k === 'speed' ? T.service.declineHeavy : 1), 20, 80), 3)]),
      );
      futures = emptyStats(p);
    }
    const abilityAfter = G.overall(after, p.role),
      growth = round(abilityAfter - abilityBefore, 2),
      observed = G.observe(after, p.role, p, yearIndex + 1, rng(tag('report')));
    const fvRaw = fvUpdate(p, abilityAfter, age, yearIndex, previous.fvRaw ?? p.scoutCeiling, rng(tag('fv')));
    const scoutFV = Math.max(observed.ready, G.grade(fvRaw));
    return {
      playerId: p.id,
      label: selection.label,
      year: D.bio.ENTRY_YEAR + yearIndex,
      teamId: team.id,
      age,
      role: p.role,
      route: 'service',
      serviceType: type,
      roleTier: 'service',
      routeLabel: SERVICE_LABELS[type],
      stats: emptyStats(p),
      futures,
      growth,
      growthLabel: growthLabel(growth),
      velocity: seasonVelocity(p, after, rng(tag('velocity'))),
      developmentNote: `${SERVICE_LABELS[type]} · 현재 기량 ${previous.scoutReady} → ${observed.ready}`,
      note: pickLine(SERVICE_NOTES[type], rng(tag('text'))),
      routeReason: 'service',
      limited: false,
      daysLost: 0,
      contribution: 0,
      war: 0,
      planScore: null,
      target: '복무',
      unexpected: false,
      startGrade: previous.scoutReady,
      startTools: { ...previous.publicTools },
      publicTools: observed.tools,
      scoutReady: observed.ready,
      scoutFV,
      endState: {
        ability: round(abilityAfter, 3),
        tools: after,
        publicTools: observed.tools,
        scoutReady: observed.ready,
        scoutFV,
        fvRaw: round(fvRaw, 3),
        route: 'service',
        roleTier: 'service',
        limited: false,
        daysLost: 0,
        age,
        performance: 0,
      },
    };
  }

  // ---------------------------------------------------------------- one season

  /**
   * Simulates one season for player `p`.
   * previous: last year's end state (null in the rookie year); context: { blockedRegular, closer }.
   */
  function simulatePlayer(p, selection, g, team, fit, previous = null, yearIndex = 0, context = {}) {
    const tag = (stream, withTeam) => `${g.seed}-${stream}-v6-${yearIndex}-${p.id}${withTeam ? '-' + team.id : ''}`;
    const perf = rng(tag('performance', true)); // role, playing time, futures games (in that order)
    const tools = { ...(previous?.tools || p.trueTools) },
      abilityBefore = G.overall(tools, p.role),
      pitcher = isPitcher(p);

    // A two-way player's second side shares the injury of the first.
    const { limited, daysLost } = context.health || rollHealth(p, rng(tag('health')));
    const growR = rng(tag('growth'));
    const impact = abilityBefore + normal(perf) * T.roles.impactNoise - (context.impactShift || 0);
    const { route, reason, core, investment } = decideRole(
      { impact, previous, yearIndex, round: selection.round, fit, daysLost, blockedRegular: context.blockedRegular },
      perf,
    );
    // Days away (service ending mid-season) cut playing time and growth like injury days, but are not injuries.
    const missed = Math.min(T.health.playingDays, daysLost + (context.absentDays || 0));
    const games = firstTeamGames(p, route, yearIndex, missed, perf, context.gamesScale ?? 1);
    const stats = statsFor(p, games, tools, route === 'regular' ? 'regular' : 'major', rng(tag('counting', true)), {
      core,
      cameo: route === 'cameo',
      closer: context.closer,
      teamRank: team.rank,
    });

    const age = D.bio.ageAt(p.birthday, `${D.bio.ENTRY_YEAR + yearIndex}-12-31`);
    const after = developTools(p, tools, yearIndex, age, missed, growR, context.growthBoost || 0, context.focus, context.growthScale ?? 1);
    const abilityAfter = G.overall(after, p.role),
      growth = round(abilityAfter - abilityBefore, 2),
      observed = G.observe(after, p.role, p, yearIndex + 1, rng(tag('report')));

    const farmGames = futuresGames(p, route, games, missed, perf, context.gamesScale ?? 1);
    const futures = statsFor(p, farmGames, tools, 'futures', rng(tag('farm')), { teamRank: team.rank });

    const startGrade = previous?.scoutReady ?? p.ready,
      startTools = previous?.publicTools ?? p.tools;
    const planScore = planScoreOf(p, { startGrade, growth, yearIndex, games, route, daysLost });
    const roleTier = core ? 'core' : route;
    const bestTool = Object.keys(after).sort((a, b) => after[b] - tools[b] - (after[a] - tools[a]))[0];
    const note = (context.absentDays ? pickLine(RETURN_NOTES, rng(tag('return-text'))) + ' ' : '') + reasonText(reason, daysLost, investment, rng(tag('text')));
    const fvRaw = fvUpdate(p, abilityAfter, age, yearIndex, previous?.fvRaw ?? p.scoutCeiling, rng(tag('fv')));

    return {
      playerId: p.id,
      label: selection.label,
      year: D.bio.ENTRY_YEAR + yearIndex,
      teamId: team.id,
      role: p.role,
      age,
      route,
      roleTier,
      routeLabel: routeLabel(route, core, pitcher),
      stats,
      futures,
      growth,
      growthLabel: growthLabel(growth),
      velocity: seasonVelocity(p, after, rng(tag('velocity'))),
      developmentNote: `${G.LABELS[bestTool]} 중심 훈련 · 현재 기량 ${startGrade} → ${observed.ready}`,
      note,
      routeReason: reason,
      limited,
      daysLost,
      contribution: round(contributionOf(stats, tools)),
      war: warOf(stats, p, tools),
      planScore,
      target: p.ready >= 45 ? '1군 경쟁 도전' : '퓨처스 적응·기술 발전',
      unexpected: route === 'regular' && selection.round >= 4,
      startGrade,
      startTools: { ...startTools },
      publicTools: observed.tools,
      scoutReady: observed.ready,
      scoutFV: Math.max(observed.ready, G.grade(fvRaw)),
      endState: {
        ability: round(abilityAfter, 3),
        tools: after,
        publicTools: observed.tools,
        scoutReady: observed.ready,
        scoutFV: Math.max(observed.ready, G.grade(fvRaw)),
        fvRaw: round(fvRaw, 3),
        route,
        roleTier,
        limited,
        daysLost,
        age,
        performance: performanceOf(stats),
      },
    };
  }

  /** First-year owner evaluation: need coverage, plan scores and future value. */
  function evaluate(g, season, players, team) {
    const F = T.firstYear;
    const roles = new Set(players.map((p) => p.role));
    const needScore = round(S.needCoverage(players, team));
    const production = round(mean(season.map((s) => s.planScore))),
      future = round(clamp(F.future.base + (mean(players.map((p) => p.scoutCeiling)) - F.future.fvPivot) * F.future.perFV + mean(season.map((s) => s.growth)) * F.future.perGrowth, 0, 100)),
      score = round(needScore * F.weights.need + production * F.weights.plan + future * F.weights.future);
    const majorCount = season.filter((s) => s.stats.games > 0).length,
      regularCount = season.filter((s) => s.route === 'regular').length;
    return {
      score,
      grade: letter(score, F.gradeCuts),
      needScore,
      production,
      future,
      text: '첫해 보직과 성장 과정을 함께 본 평가입니다.',
      missing: team.needs.filter((role) => !roles.has(role)).map((role) => D.ROLES[role]),
      majorCount,
      regularCount,
      developmentCount: season.length - majorCount,
      planMessage: `1군 경험 ${majorCount}명 · 안착 ${regularCount}명. 보강은 포지션과 세부 유형 적합도를 함께 봅니다. 미래 평가는 공개 전망과 관측된 발전에 근거합니다.`,
    };
  }

  const api = { simulatePlayer, serviceSeason, warOf, focusFactor, isPitcher, SERVICE_LABELS, evaluate, emptyStats, statsFor, decideRole, developTools, planScoreOf };
  root.DraftSeason = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* CPU draft logic (public scouting data only), difficulty settings and draft-board sorting. */
(function (root) {
  'use strict';
  const D = root.DraftData || (typeof require !== 'undefined' ? require('./prospects.js') : null);
  const S = root.DraftScouting || (typeof require !== 'undefined' ? require('./scouting.js') : null);
  const { TUNING: T } = root.DraftTuning || (typeof require !== 'undefined' ? require('./tuning.js') : null);
  const DIFFICULTIES = {
    easy: { name: '쉬움', hint: '상세 조언과 비교 후보 · 단순한 AI', noise: 12 },
    normal: { name: '보통', hint: '추천 근거 제공 · 구단 성향별 AI', noise: 5 },
    hard: { name: '어려움', hint: '핵심 관찰만 제공 · 보강·중복·희소성을 따지는 AI', noise: 1.5 },
  };
  function project(p) {
    return {
      id: p.id,
      name: p.name,
      role: p.role,
      pathway: p.pathway,
      quotaEligible: p.quotaEligible === true,
      entryCategory: p.entryCategory,
      school: p.school,
      region: p.highSchoolRegion,
      ready: p.ready,
      scoutCeiling: p.scoutCeiling,
      publicScore: p.publicScore,
      rank: p.rank,
      schoolTier: p.schoolTier,
      ceilingGrade: p.ceilingGrade,
      floorGrade: p.floorGrade,
      tools: { ...p.tools },
      futureTools: { ...p.futureTools },
      pickTags: [...p.pickTags],
      uncertainty: p.uncertainty,
      regionalEligible: !!D.bio.eligible(p, { region: p.highSchoolRegion }),
      // Public facts used by the media and scouting text.
      age: p.age,
      velocity: p.velocity,
      throwHand: p.throwHand,
      type: p.type,
      record: { ...p.record },
      awards: [...p.awards],
      proExperience: p.proExperience ? { level: p.proExperience.level } : null,
      intent: p.intent ?? null,
      twoWay: !!p.twoWay,
      // Scouts mention the other side only when it is worth something.
      altPublic: p.alt && p.alt.scoutCeiling >= T.altTalent.publicMinFV ? { role: p.alt.role, ready: p.alt.ready, scoutCeiling: p.alt.scoutCeiling } : null,
    };
  }
  function fit(p, t) {
    return S.fit(p, t);
  }
  function aiScores(candidates, team, prior, difficulty, seed) {
    const cfg = DIFFICULTIES[difficulty];
    if (!cfg) throw Error('알 수 없는 난이도입니다.');
    const r = D.rng(seed),
      top = [...candidates].sort((a, b) => b.publicScore - a.publicScore).slice(0, 30);
    return candidates
      .map((p) => {
        const owned = prior.filter((x) => x.role === p.role).length,
          f = fit(p, team),
          scarcity = 6 - Math.min(6, top.filter((x) => x.role === p.role).length);
        let score =
          difficulty === 'easy'
            ? p.publicScore + f * 0.03 - owned
            : S.score(p, team) -
              owned * (difficulty === 'hard' ? 3.5 : 2) +
              (difficulty === 'hard' && owned === 0 && f >= 60 ? scarcity * 0.65 : 0);
        // Clubs are wary of players who announced they may not sign.
        if (p.intent) score -= T.contracts.aiIntentPenalty[difficulty][p.intent];
        return { id: p.id, score: score + (r() - 0.5) * cfg.noise };
      })
      .sort((a, b) => b.score - a.score || a.id.localeCompare(b.id));
  }
  const SORTS = {

            canPlay(s) &&
            !touched.has(s.playerId) &&
            !records.some((x) => x.playerId === s.playerId && x.route === 'regular' && x.contribution >= Tr.protectContribution),
        ),
        pairs = [];
      const plans = S.plans(seed, TEAMS);
      const V = Tr.value;
      const publicValue = (s) =>
        s.scoutReady * V.perReady +
        (s.scoutFV ?? byId[s.playerId].scoutCeiling) * V.perFV -
        Math.max(0, s.age - V.agePivot) * V.perAge +
        (records.find((x) => x.playerId === s.playerId)?.contribution || 0) * V.perContribution;
      for (let i = 0; i < active.length; i++)
        for (let j = i + 1; j < active.length; j++) {
          const a = active[i],
            b = active[j],
            pa = byId[a.playerId],
            pb = byId[b.playerId];
          if (a.currentTeamId === b.currentTeamId || a.role === b.role) continue;
          const ta = { ...byTeam[a.currentTeamId], ...plans[a.currentTeamId] },
            tb = { ...byTeam[b.currentTeamId], ...plans[b.currentTeamId] },
            va = viewOf(pa, a),
            vb = viewOf(pb, b),
            gainA = fit(vb, ta) - fit(va, ta),
            gainB = fit(va, tb) - fit(vb, tb);
          if (gainA < 0 || gainB < 0 || gainA + gainB < Tr.minCombinedGain || Math.abs(publicValue(a) - publicValue(b)) > Tr.maxValueGap)
            continue;
          pairs.push({
            a,
            b,
            score: gainA + gainB - Math.abs(publicValue(a) - publicValue(b)) * Tr.gapWeight + rr() * Tr.noise,
          });
        }
      pairs.sort((a, b) => b.score - a.score || a.a.playerId.localeCompare(b.a.playerId));
      if (pairs[0]) {
        const { a, b } = pairs[0],
          from = a.currentTeamId,
          to = b.currentTeamId;
        events.push({
          id: year + '-trade-' + a.playerId + '-' + b.playerId,
          type: 'trade',
          year,
          fromTeamId: from,
          toTeamId: to,
          playerIds: [a.playerId, b.playerId],
          reason: '서로 필요한 포지션을 보완하고 공개 평가 가치가 비슷한 자원을 교환했습니다.',
        });
        a.currentTeamId = to;
        b.currentTeamId = from;
      }
    }
    return events;
  }

  // ---------------------------------------------------------------- development plans

  /** What the club can decide for each of its players before season `yearIndex`. */
  function planOptions(career, byId, yearIndex, teamId) {
    return Object.values(career.players)
      .filter((s) => s.status === 'active' && s.currentTeamId === teamId)
      .sort((a, b) => a.playerId.localeCompare(b.playerId))
      .map((s) => {
        const p = byId[s.playerId],
          playing = canPlay(s);
        return {
          playerId: s.playerId,
          role: s.role,
          kind: kindOf(s.role),
          focus: s.focus,
          focusOptions: ['balanced', ...FOCUS_KEYS[kindOf(s.role)]],
          roleOptions: playing && !s.service ? roleOptions(s, p, yearIndex) : [],
          twoWay: s.twoWay,
          twoWayCapable: !!p.twoWay && playing,
          inService: !!s.service,
          other: { role: s.other.role, ready: s.other.scoutReady, fv: s.other.scoutFV },
        };
      });
  }

  /**
   * Focus, position and two-way decisions before season `yearIndex`. The user's plans apply to his own
   * players; CPU clubs follow simple habits from the second season on. Returns the resulting events.
   */
  function planStep(career, byId, seed, yearIndex, plans, userTeamId) {
    const P = T.positions,
      W = T.twoWay,
      year = D.bio.ENTRY_YEAR + yearIndex,
      when = yearIndex ? year - 1 : year,
      events = [];
    const move = (s, to, reason) => {
      const from = s.role;
      changeRole(s, to, year);
      events.push({ id: `${year}-position-${s.playerId}`, type: 'position', year: when, preseason: !yearIndex, fromTeamId: s.currentTeamId, toTeamId: null, playerIds: [s.playerId], from, to, reason });
    };
    for (const s of Object.values(career.players).sort((a, b) => a.playerId.localeCompare(b.playerId))) {
      if (s.status !== 'active') continue;
      const p = byId[s.playerId];
      if (userTeamId && s.currentTeamId === userTeamId) {
        const plan = plans[s.playerId];
        if (!plan) continue;
        if (canPlay(s) && plan.role && plan.role !== s.role) move(s, plan.role, '구단 결정으로 포지션을 바꿨다.');
        if (plan.focus) s.focus = plan.focus;
        if (!canPlay(s)) continue;
        if (plan.twoWay === false && s.twoWay) {
          s.twoWay = false;
          events.push({ id: `${year}-two-way-${s.playerId}`, type: 'position', year: when, preseason: !yearIndex, fromTeamId: s.currentTeamId, toTeamId: null, playerIds: [s.playerId], from: s.role, to: s.role, reason: '투타 겸업을 접고 한쪽에 전념하기로 했다.' });
        }
        if (plan.twoWay === true && p.twoWay) s.twoWay = true;

      }
      if (!yearIndex || !canPlay(s)) continue;
      const r = rng(`${seed}-position-${year}-${s.playerId}`),
        C = P.cpu;
      if (s.twoWay && yearIndex >= W.dropFromYear && Math.abs(s.scoutReady - s.other.scoutReady) >= W.dropGap) {
        s.twoWay = false;
        if (s.other.scoutReady > s.scoutReady) move(s, s.other.role, '투타 겸업을 접고 더 나은 쪽을 택했다.');
        else events.push({ id: `${year}-two-way-${s.playerId}`, type: 'position', year: when, preseason: !yearIndex, fromTeamId: s.currentTeamId, toTeamId: null, playerIds: [s.playerId], from: s.role, to: s.role, reason: '투타 겸업을 접고 한쪽에 전념하기로 했다.' });
      } else if (!s.twoWay && ageIn(p, yearIndex) <= C.switchSide.maxAge && s.other.scoutReady >= s.scoutReady + C.switchSide.margin && r() < C.switchSide.chance)
        move(s, s.other.role, pitcherRole(s.role) ? '마운드보다 타석에서 가능성을 보고 타자로 전향했다.' : '강한 어깨를 살려 투수로 전향했다.');
      else if (s.role === 'SP' && s.publicTools.stamina < C.starterToRelief.maxStamina && r() < C.starterToRelief.chance) move(s, 'RP', '긴 이닝을 버티지 못해 불펜으로 옮겼다.');
      else if (s.role === 'C' && s.publicTools.defense < C.catcherToInfield.maxDefense && r() < C.catcherToInfield.chance) move(s, 'IF', '포수 수비 부담을 덜고 타격을 살리려 내야로 옮겼다.');
    }
