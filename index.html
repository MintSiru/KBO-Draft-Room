<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f2ec">
<meta name="description" content="가상의 KBO 신인 드래프트를 진행하고 지명한 선수들의 5년 경력을 시뮬레이션합니다.">
<title>드래프트 룸 v0.6.2 — KBO 신인 드래프트</title>
<style>
/* Draft Room — one stylesheet. Scorebook look: paper, ink rules, tables; the club colour is the only accent. */
:root {
  --paper: #f4f2ec;
  --surface: #fffdf8;
  --sunken: #ebe8df;
  --ink: #1c1c1a;
  --ink-2: #45443f;
  --muted: #6f6d66;
  --rule: #d8d4c8;
  --good: #2c6a3a;
  --warn: #8f5310;
  --bad: #a0302a;
  --club: #1c1c1a; /* replaced with the chosen club colour at runtime */
  --radius: 3px;
  color-scheme: light;
  font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', system-ui, -apple-system,
    'Segoe UI', sans-serif;
  font-size: 15px;
  line-height: 1.55;
  color: var(--ink);
  background: var(--paper);
  -webkit-text-size-adjust: 100%;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); }
h1, h2, h3, h4, p, ol, ul, blockquote { margin: 0; }
h1, h2, h3, h4 { line-height: 1.3; word-break: keep-all; }
p, li { word-break: keep-all; overflow-wrap: anywhere; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: 0.45; }
:focus-visible { outline: 2px solid var(--club); outline-offset: 2px; }
small { font-size: 13px; }
.num, td.n, th.n { font-variant-numeric: tabular-nums; text-align: right; }
.muted { color: var(--muted); }
.good { color: var(--good); }
.warn { color: var(--warn); }
.show-narrow { display: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }

/* ---------- Masthead, steps, footer ---------- */
.masthead { background: var(--surface); border-bottom: 2px solid var(--ink); border-top: 4px solid var(--club); }
.masthead .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px; flex-wrap: wrap; }
.wordmark { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.wordmark b { font-size: 20px; letter-spacing: -0.02em; }
.wordmark span { font-size: 13px; color: var(--muted); }
.masthead nav { display: flex; gap: 4px; flex-wrap: wrap; }
.steps { display: flex; gap: 0; list-style: none; padding: 0; margin: 14px 0 22px; border-bottom: 1px solid var(--rule); }
.steps li { font-size: 13px; color: var(--muted); padding: 8px 14px 8px 0; margin-right: 14px; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.steps li b { font-variant-numeric: tabular-nums; margin-right: 5px; }
.steps li.done { color: var(--ink-2); }
.steps li.now { color: var(--ink); font-weight: 700; border-bottom-color: var(--club); }
footer.colophon { border-top: 1px solid var(--rule); margin-top: 48px; padding: 18px 0 28px; font-size: 13px; color: var(--muted); }
footer.colophon .wrap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
main { min-height: 60vh; }

/* ---------- Type ---------- */
.page-head { margin: 4px 0 20px; }
.page-head h1 { font-size: 26px; letter-spacing: -0.02em; }
.page-head p { color: var(--ink-2); margin-top: 6px; max-width: 760px; }
.kicker { font-size: 13px; font-weight: 700; color: var(--club); display: block; margin-bottom: 4px; }
h2.rule { font-size: 18px; border-bottom: 1px solid var(--ink); padding-bottom: 6px; margin: 28px 0 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
h2.rule small { font-weight: 400; color: var(--muted); }
h3 { font-size: 16px; }
.note { font-size: 13px; color: var(--muted); margin: 8px 0; }
.callout { border-left: 3px solid var(--warn); background: var(--surface); padding: 10px 14px; font-size: 14px; margin: 12px 0; }
.callout.ok { border-left-color: var(--good); }

/* ---------- Controls ---------- */
.btn { white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--ink); background: var(--surface); border-radius: var(--radius); padding: 7px 13px; font-size: 14px; font-weight: 600; line-height: 1.3; text-decoration: none; }
.btn:hover:not(:disabled) { background: var(--sunken); }
.btn.quiet { border-color: var(--rule); font-weight: 500; }
.btn.small { padding: 4px 9px; font-size: 13px; }
.btn.primary { background: var(--club); border-color: var(--club); color: #fff; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.12); background: var(--club); }
.btn.wide { width: 100%; padding: 11px 16px; font-size: 15px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 22px 0 0; }
.actions .note { margin: 0; }
.link { border: 0; background: none; padding: 0; font-weight: 600; color: var(--ink); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; text-align: left; }
.link:hover { text-decoration-color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--ink); border-radius: var(--radius); overflow: hidden; }
.seg button { border: 0; border-left: 1px solid var(--ink); background: var(--surface); padding: 7px 14px; font-size: 14px; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed='true'] { background: var(--ink); color: #fff; font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { border: 1px solid var(--rule); background: var(--surface); border-radius: var(--radius); padding: 4px 9px; font-size: 13px; }
.chip[aria-pressed='true'] { border-color: var(--ink); background: var(--ink); color: #fff; }
select, input[type='search'], input[type='text'] { border: 1px solid var(--rule); background: var(--surface); border-radius: var(--radius); padding: 6px 8px; font-size: 14px; min-height: 34px; min-width: 0; }
label.field { display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--muted); }
label.field select { color: var(--ink); }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--club); margin: 0; }

/* ---------- Tags & grades ---------- */
.tag { display: inline-block; font-size: 12px; line-height: 1.4; padding: 1px 6px; border: 1px solid var(--rule); border-radius: 2px; color: var(--ink-2); background: var(--surface); white-space: nowrap; }
.tag.solid { background: var(--ink); border-color: var(--ink); color: #fff; }
.tag.good { color: var(--good); border-color: currentColor; }
.tag.warn { color: var(--warn); border-color: currentColor; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.g { font-variant-numeric: tabular-nums; font-weight: 700; }
.g70 { color: #0d5c2f; } .g60 { color: var(--good); } .g50 { color: var(--ink); } .g40 { color: var(--ink-2); } .g30 { color: var(--muted); }
.bar { display: inline-block; width: 70px; height: 6px; background: var(--sunken); vertical-align: middle; margin-left: 8px; position: relative; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--ink-2); }
.team-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }

/* ---------- Boxes & tables ---------- */
.box { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 16px 18px; }
.box + .box { margin-top: 14px; }
.cols > .box + .box { margin-top: 0; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 22px; align-items: start; }
.cols.even { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cols.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.table-scroll { overflow-x: auto; max-width: 100%; overscroll-behavior-x: contain; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; background: var(--surface); }
table.t th { font-size: 12px; font-weight: 600; color: var(--muted); text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--ink); white-space: nowrap; }
table.t td { padding: 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.t th.n, table.t td.n { text-align: right; }
table.t tr.mine td { background: color-mix(in srgb, var(--club) 7%, var(--surface)); }
table.t tr.mine td:first-child { box-shadow: inset 3px 0 0 var(--club); }
table.t td small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
table.record-table { white-space: nowrap; }
table.record-table td:first-child, table.record-table th:first-child { position: sticky; left: 0; background: var(--surface); z-index: 1; }
dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 14px; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; }

/* ---------- Setup ---------- */
.club-table button { width: 100%; text-align: left; }
.club-table tr { cursor: pointer; }
.club-table tr:hover td { background: var(--sunken); }
.club-table tr[aria-selected='true'] td { background: color-mix(in srgb, var(--club) 9%, var(--surface)); }
.club-table tr[aria-selected='true'] td:first-child { box-shadow: inset 3px 0 0 var(--club); }
.club-table .pick-btn { border: 0; background: none; padding: 0; font-weight: 700; }
.settings-row { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--rule); flex-wrap: wrap; }
.settings-row:first-of-type { border-top: 0; padding-top: 0; }
.settings-row p { font-size: 13px; color: var(--muted); flex-basis: 100%; }
.club-sheet h2 { font-size: 22px; display: flex; align-items: center; gap: 8px; }
.club-sheet .team-dot { width: 12px; height: 12px; }
.scouting-club { margin: 14px 0; }
.scouting-club h3 { font-size: 15px; margin-bottom: 6px; }
.scouting-club ul { list-style: none; padding: 0; border-top: 1px solid var(--rule); }
.scouting-club li { padding: 7px 0; border-bottom: 1px solid var(--rule); font-size: 14px; }
.scouting-club li span { display: block; font-size: 13px; color: var(--muted); }

/* ---------- Mock drafts & recommendations ---------- */
.outlet h2 { font-size: 18px; }
.outlet > p { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.hit { color: var(--good); font-weight: 600; }
.recommendation { border-top: 3px solid var(--rule); }
.recommendation.primary { border-top-color: var(--club); }
.recommendation h3 { font-size: 20px; margin: 4px 0 2px; }
.grade-row { display: flex; gap: 18px; margin: 10px 0; }
.grade-row div { font-size: 12px; color: var(--muted); }
.grade-row b { display: block; font-size: 24px; color: var(--ink); font-variant-numeric: tabular-nums; }

/* ---------- Draft board ---------- */
.on-clock { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
.on-clock h1 { font-size: 24px; }
.on-clock .count { font-size: 14px; color: var(--muted); }
.on-clock .count b { font-size: 22px; color: var(--ink); }
.round-strip { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); border: 1px solid var(--rule); background: var(--surface); margin-bottom: 14px; }
.round-strip div { padding: 6px 8px; border-left: 1px solid var(--rule); font-size: 13px; min-width: 0; }
.round-strip div:first-child { border-left: 0; }
.round-strip b { display: block; font-size: 12px; }
.round-strip span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.round-strip .you { background: var(--ink); color: #fff; }
.round-strip .you span { color: #fff; }
.board-tools { display: grid; gap: 8px; padding-bottom: 10px; border-bottom: 1px solid var(--ink); }
.board-tools .line { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.board-tools input[type='search'] { flex: 1 1 180px; }
.roster { max-height: 560px; overflow-y: auto; }
.player-row { display: grid; grid-template-columns: 36px minmax(0, 1fr) 84px 64px; gap: 8px; align-items: center; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--rule); background: var(--surface); padding: 8px 6px; }
.player-row:hover { background: var(--sunken); }
.player-row[aria-pressed='true'] { background: color-mix(in srgb, var(--club) 9%, var(--surface)); box-shadow: inset 3px 0 0 var(--club); }
.player-row .rk { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.player-row .nm { font-weight: 700; }
.player-row .nm small { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 4px; }
.player-row .meta { display: block; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player-row .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.player-row .val small { display: block; font-size: 11px; font-weight: 400; color: var(--muted); }
.player-row .fit { font-size: 12px; text-align: right; color: var(--muted); }
.player-row .fit.core { color: var(--good); font-weight: 700; }
.roster-head { display: grid; grid-template-columns: 36px minmax(0, 1fr) 84px 64px; white-space: nowrap; gap: 8px; font-size: 12px; color: var(--muted); padding: 6px; }
.roster-head span:nth-child(n + 3) { text-align: right; }
.empty { padding: 28px 12px; text-align: center; color: var(--muted); }
.profile { position: sticky; top: 12px; }
.profile-body h2 { font-size: 24px; }
.profile-body .sub { color: var(--ink-2); font-size: 14px; }
.profile-body section { border-top: 1px solid var(--rule); padding-top: 10px; margin-top: 12px; }
.profile-body h4 { font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
.stat-line { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 14px; }
.stat-line b { font-size: 18px; font-variant-numeric: tabular-nums; margin-right: 3px; }
.tool-grade-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.tool-grade-table th, .tool-grade-table td { padding: 4px 0; border-bottom: 1px solid var(--rule); text-align: left; }
.tool-grade-table th { font-weight: 500; }
.tool-grade-table thead th { font-size: 12px; color: var(--muted); border-bottom-color: var(--ink); }
.tool-grade-table td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.overall { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-bottom: 10px; }
.overall div { font-size: 12px; color: var(--muted); }
.overall b { display: block; font-size: 22px; color: var(--ink); font-variant-numeric: tabular-nums; }
.advice ul { padding-left: 18px; font-size: 14px; }
.advice li { margin: 3px 0; }
.favorite-note { font-size: 14px; }
details > summary { cursor: pointer; font-weight: 600; font-size: 14px; }
details[open] > summary { margin-bottom: 6px; }
.history { list-style: none; padding: 0; font-size: 14px; }
.history li { padding: 4px 0; border-bottom: 1px dotted var(--rule); }
.history li small { display: block; color: var(--muted); }
.mine-list { list-style: none; padding: 0; font-size: 14px; }
.mine-list li { display: grid; grid-template-columns: 58px 1fr auto; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--rule); }
.mine-list li span:last-child { color: var(--muted); font-size: 13px; }
.log-list { columns: 2; column-gap: 22px; font-size: 13px; margin-top: 6px; }
.log-list div { break-inside: avoid; padding: 3px 0; border-bottom: 1px dotted var(--rule); }

/* ---------- After the draft ---------- */
.gm-section .options { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
.gm-section .options > div { border: 1px solid var(--rule); padding: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
.gm-section .options .btn { margin-top: auto; }
.gm-section blockquote, .quote blockquote { font-size: 15px; border-left: 3px solid var(--rule); padding-left: 12px; color: var(--ink-2); }
.quotes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.quote h3 { font-size: 17px; }
.quote blockquote { margin-top: 8px; }
.summary-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--rule); background: var(--surface); margin: 12px 0; }
.summary-strip div { padding: 10px 14px; border-left: 1px solid var(--rule); font-size: 13px; color: var(--muted); }
.summary-strip div:first-child { border-left: 0; }
.summary-strip b { display: block; font-size: 22px; color: var(--ink); font-variant-numeric: tabular-nums; }
.year-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--ink); margin: 6px 0 4px; flex-wrap: wrap; }
.year-tabs button { border: 1px solid transparent; border-bottom: 0; background: none; padding: 7px 14px; font-size: 14px; color: var(--muted); margin-bottom: -1px; }
.year-tabs button[aria-pressed='true'] { border-color: var(--ink); background: var(--paper); color: var(--ink); font-weight: 700; }
.development-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.development-grid article { border: 1px solid var(--rule); padding: 10px 12px; background: var(--surface); font-size: 14px; }
.development-grid .move { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; margin: 4px 0; }
.development-grid .move small { font-size: 12px; font-weight: 400; color: var(--muted); }
.development-grid p { font-size: 13px; color: var(--ink-2); }
.tool-snapshot { margin: 8px 0; font-size: 13px; }
.tool-snapshot h4 { font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
.tool-snapshot div { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.tool-snapshot b { font-variant-numeric: tabular-nums; margin-left: 4px; }
.standings td:first-child { width: 32px; }
.event-list { list-style: none; padding: 0; }
.event-list li { padding: 8px 0; border-bottom: 1px solid var(--rule); font-size: 14px; }
.event-list li small { display: block; color: var(--muted); }
.grade-card { text-align: left; }
.grade-card .letter { font-size: 64px; font-weight: 800; line-height: 1; color: var(--club); }
.grade-card .score { font-size: 18px; font-variant-numeric: tabular-nums; }
.score-bars { display: grid; gap: 10px; }
.score-bars div { font-size: 14px; }
.score-bars span { display: block; height: 6px; background: var(--sunken); margin-top: 4px; }
.score-bars span i { display: block; height: 100%; background: var(--club); }
.record-filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
.record-filters label { flex: 1 1 130px; }
.record-filters select { width: 100%; }
.career-profile h2 { font-size: 24px; }
.career-profile h3 { font-size: 16px; margin: 18px 0 6px; border-bottom: 1px solid var(--ink); padding-bottom: 4px; }
.career-profile p { font-size: 14px; margin: 4px 0; }
.year-report { border-bottom: 1px solid var(--rule); padding: 8px 0; font-size: 14px; }
.year-report header { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.news-article { border-bottom: 1px solid var(--rule); padding: 14px 0; }
.news-article h3 { font-size: 18px; margin: 2px 0 6px; }
.news-article .comments { margin-top: 8px; font-size: 14px; }
.news-article .comments p { padding: 4px 0; border-top: 1px dotted var(--rule); }
.fan-timeline { list-style: none; padding: 0; font-size: 14px; }
.fan-timeline li { display: grid; grid-template-columns: 1fr 48px 48px; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--rule); }
.catalog-list details { border-bottom: 1px solid var(--rule); padding: 8px 0; }
.catalog-list ul { columns: 2; column-gap: 18px; list-style: none; padding: 0; font-size: 14px; }
.catalog-list li { break-inside: avoid; padding: 2px 0; }
.catalog-list li span { color: var(--muted); font-size: 13px; margin-left: 6px; }
.guide ol { padding-left: 20px; font-size: 14px; }
.guide li { margin: 6px 0; }

/* ---------- Modal & toast ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgb(28 28 26 / 0.45); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px; overflow-y: auto; }
.modal { width: 100%; max-width: 580px; background: var(--surface); border: 1px solid var(--ink); border-radius: var(--radius); }
.modal.wide { max-width: 920px; }
.modal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--ink); }
.modal-head h2 { font-size: 17px; }
.modal-body { padding: 16px 18px 20px; max-height: 78vh; overflow-y: auto; }
.modal-body .actions { margin-top: 16px; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 9px 16px; border-radius: var(--radius); font-size: 14px; z-index: 70; max-width: 90%; }

/* ---------- Narrow screens ---------- */
@media (max-width: 960px) {
  .cols { grid-template-columns: minmax(0, 1fr); }
  .cols.three { grid-template-columns: minmax(0, 1fr); }
  .profile { position: static; }
  .round-strip { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .round-strip div:nth-child(6) { border-left: 0; }
  .round-strip div:nth-child(n + 6) { border-top: 1px solid var(--rule); }
  .gm-section .options { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 640px) {
  :root { font-size: 15px; }
  .wrap { padding: 0 14px; }
  .steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 0; gap: 2px 8px; }
  .steps li { margin: 0; padding: 4px 0; font-size: 13px; border-bottom: 1px solid var(--rule); white-space: normal; }
  .steps li.now { border-bottom: 2px solid var(--club); }
  .page-head h1 { font-size: 22px; }

    const pledge = Press.accountability(g.gmChoice, players.map(R.project), season, teamFor(g));
    const score = clamp(base.score + pledge.bonus, 0, 100);
    return {
      ...base,
      baseScore: base.score,
      score,
      grade: score >= 89 ? 'A' : score >= 77 ? 'B' : score >= 63 ? 'C' : 'D',
      pledge,
    };
  }
  function runSeason(g) {
    if (g.cursor !== g.schedule.length || !g.gmChoice)
      throw Error('드래프트와 단장 인터뷰를 먼저 완료해야 합니다.');
    const { byId } = poolFor(g);
    if (!g.career) {
      g.career = Career.create(g.picks, byId, g.seed);
      Career.advance(g.career, g.picks, byId, g.seed);
      g.season = g.career.years[0].records.filter((s) => s.teamId === g.teamId);
      g.owner = evaluate(g, g.season);
    }
    g.phase = 'season';
    return g.season;
  }
  function nextSeason(g) {
    if (!g.career || !['season', 'owner'].includes(g.phase)) throw Error('첫 시즌을 먼저 진행해야 합니다.');
    const result = Career.advance(g.career, g.picks, poolFor(g).byId, g.seed);
    g.phase = 'season';
    return result;
  }
  function careerReview(g) {
    return g.career ? Career.review(g.career, g.picks, poolFor(g).byId) : [];
  }
  const PHASES = ['preview', 'scouting', 'draft', 'interviews', 'season', 'owner'];

  /*
   * Saves
   * -----
   * A save holds only the inputs of a game: settings, seed, the user's own picks, the GM answer and how
   * many seasons were played. Everything else is recomputed by replaying, which is fast (<0.2 s for five
   * seasons) and means a save cannot be edited into a different result.
   *
   * Replaying is only faithful while the simulation behaves exactly as it did when the save was made.
   * SIM_VERSION names that behaviour: bump it whenever a change alters any simulated number or pick
   * (tests/golden.cjs fails until you do). A save from another SIM_VERSION is refused, never silently
   * replayed into a different history.
   */
  const SIM_VERSION = '0.6',
    SAVE_FORMAT = 'draft-room-save',
    SAVE_VERSION = 2;

  /** The compact save for a game. */
  function toSave(g) {
    return {
      format: SAVE_FORMAT,
      version: SAVE_VERSION,
      sim: SIM_VERSION,
      teamId: g.teamId,
      local: g.local,
      seed: g.seed,
      difficulty: g.difficulty,
      phase: g.phase,
      picks: myPicks(g).map((s) => s.playerId),
      gmChoice: g.gmChoice,
      seasons: g.career?.years.length ?? 0,
    };
  }

  /**
   * Replays a game from compact-save inputs. Returns null if they are invalid or do not replay.
   * CPU clubs pick up to the user's next turn, as the app does; `stopAt` instead stops at that overall pick
   * (used for v0.6.0 saves, which may have been stored mid-way through CPU picks).
   */
  function replay(s, stopAt = null) {
    try {
      if (
        !s ||
        !Object.hasOwn(R.DIFFICULTIES, s.difficulty) ||
        !Object.hasOwn(teamById, s.teamId) ||
        typeof s.seed !== 'string' ||
        !s.seed.length ||
        s.seed.length > 200 ||
        typeof s.local !== 'boolean' ||
        !PHASES.includes(s.phase) ||
        !Array.isArray(s.picks) ||
        !s.picks.every((id) => typeof id === 'string') ||
        !Number.isInteger(s.seasons) ||
        s.seasons < 0 ||
        s.seasons > Career.SEASONS
      )
        return null;
      const g = createGame(s.teamId, s.local, s.seed, s.difficulty);
      const pristine = !s.picks.length && s.gmChoice == null && !s.seasons;
      if (s.phase === 'preview') return pristine ? g : null;
      openScouting(g);
      if (s.phase === 'scouting') return pristine ? g : null;
      beginDraft(g);
      const cpuPicks = () => {
        while (g.phase === 'draft' && g.schedule[g.cursor].teamId !== g.teamId && (stopAt == null || g.cursor < stopAt))
          addPick(g, aiChoice(g).id);
      };
      for (const id of s.picks) {
        cpuPicks();
        if (g.phase !== 'draft' || g.schedule[g.cursor].teamId !== g.teamId) return null; // more picks than turns
        addPick(g, id); // throws on an illegal pick
      }
      cpuPicks();
      if ((s.phase === 'draft') !== (g.phase === 'draft')) return null;
      if (s.gmChoice != null) chooseGM(g, s.gmChoice);
      if (['season', 'owner'].includes(s.phase) && !s.seasons) return null;
      if (s.seasons) {
        runSeason(g); // requires the GM answer
        while (g.career.years.length < s.seasons) nextSeason(g);
      }
      if (g.phase !== 'draft') g.phase = s.phase; // e.g. revisiting interviews after season 1
      return g;
    } catch (_) {
      return null;
    }
  }

  /**
   * Rebuilds a v0.6.0 save, which stored the whole game object. Derived fields are ignored; the inputs
   * are replayed and the stored pick list must match the replay exactly (so CPU picks cannot be edited).
   */
  function restore(g0) {
    if (!g0 || g0.version !== VERSION || g0.draftDate !== Bio.DRAFT_DATE || !Array.isArray(g0.picks)) return null;
    if (g0.cursor !== g0.picks.length || !g0.picks.every((p) => p && typeof p.playerId === 'string')) return null;
    const seasons = g0.career == null ? 0 : g0.career.years?.length;
    if (g0.career != null && !seasons) return null;
    const g = replay(
      { ...g0, picks: g0.picks.filter((p) => p.teamId === g0.teamId).map((p) => p.playerId), seasons },
      g0.picks.length,
    );
    if (!g) return null;
    const ids = (list) => list.map((p) => p.teamId + ':' + p.playerId).join();
    return ids(g.picks) === ids(g0.picks) ? g : null;
  }

  /**
   * Loads any supported save: a compact save, a v0.6.0 export ({format:'draft-room-v06', game}) or a bare
   * v0.6.0 game object. Returns { game } or { error: 'sim' | 'invalid', sim }.
   */
  function loadSave(data) {
    if (data?.format === SAVE_FORMAT) {
      if (data.version !== SAVE_VERSION) return { error: 'invalid' };
      if (data.sim !== SIM_VERSION) return { error: 'sim', sim: String(data.sim) };
      const game = replay(data);
      return game ? { game } : { error: 'invalid' };
    }
    // v0.6.0 saves predate SIM_VERSION; their simulation is the one named '0.6'.
    const legacy = data?.format === 'draft-room-v06' ? data.game : data;
    if (legacy?.version === VERSION && SIM_VERSION !== '0.6') return { error: 'sim', sim: '0.6' };
    const game = restore(legacy);
    return game ? { game } : { error: 'invalid' };
  }
  const validate = (g) => restore(g) !== null;
  const api = {
    scouting: S,
    grades: D.grades,
    teamFor,
    openScouting,
    CONFIG,
    Career,
    quotaStatus,
    nextSeason,
    careerReview,
    ko: K,
    bio: Bio,
    catalog: D.catalog,
    eligible: Bio.eligible,
    DRAFT_DATE: Bio.DRAFT_DATE,
    ENTRY_YEAR: Bio.ENTRY_YEAR,
    RELEASE,
    VERSION,
    rules: R,
    press: Press,
    publicPool,
    beginDraft,
    gmOptions,
    chooseGM,
    fanState,
    ROUNDS,
    POOL_SIZE,
    TEAMS,
    REGIONS,
    ROLES,
    teamById,
    poolFor,
    getPlayer,
    innings,
    fit,
    fitLabel,
    outlook,
    upsideLabel,
    makeSchedule,
    createGame,
    available,
    addPick,
    aiChoice,
    advanceToUser,
    myPicks,
    simulatePlayer,
    runSeason,
    evaluate,
    validate,
    restore,
    replay,
    toSave,
    loadSave,
    SIM_VERSION,
    SAVE_FORMAT,
    rng,
    clamp,
  };
  Voices.install(api);
  root.DraftCore = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* Shared HTML helpers for the UI. Every view is a pure function (state -> HTML string).
   Views may only show public scouting data: never trueTools, potentialTools or endState. */
(function (root) {
  'use strict';
  const C = root.DraftCore;
  const UI = (root.DraftUI = root.DraftUI || {});

  const esc = (s) =>
    String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const tag = (text, cls = '') => `<span class="tag ${cls}">${esc(text)}</span>`;
  const signed = (n) => (n > 0 ? '+' : '') + n;
  const num = (n, dp = 0) => (n == null ? '—' : dp ? n.toFixed(dp) : String(n));
  /** Batting average style: .312 */
  const rate = (n) => (n == null ? '—' : n.toFixed(3).replace(/^0/, ''));
  const teamName = (id) => C.teamById[id]?.short || '무소속';
  const teamDot = (id) => (C.teamById[id] ? `<i class="team-dot" style="background:${C.teamById[id].color}"></i>` : '');
  const player = (g, id) => C.getPlayer(g, id);
  const playerLink = (id, name) =>
    `<button class="link" data-action="career-player" data-id="${esc(id)}">${esc(name)}</button>`;
  const hand = (p) => `${p.throwHand}투${p.batHand}타`;
  /** Colour class for a 20–80 grade. */
  const gradeClass = (n) => 'g' + Math.max(30, Math.min(70, Math.floor(n / 10) * 10));
  const grade = (n) => `<span class="g ${gradeClass(n)}">${n}</span>`;

  function statLine(s) {
    if (!s || !s.games) return '출전 기록 없음';
    return s.kind === 'pitcher'
      ? `${s.games}경기 ${s.gs}선발 · ${C.innings(s.outs)}이닝 · ERA ${num(s.era, 2)} · ${s.wins}승 ${s.holds}홀드 ${s.saves}세이브 · ${s.k}K ${s.bb}BB`
      : `${s.games}경기 ${s.pa}타석 · 타율 ${rate(s.avg)} · OPS ${rate(s.ops)} · ${s.hr}홈런 ${s.rbi}타점 ${s.sb}도루`;
  }

  /** Current / future grade table for one player (the scouting card used everywhere). */
  function toolTable(p) {
    const rows = C.grades
      .keys(p.role)
      .map(
        (k) =>
          `<tr><th>${C.grades.LABELS[k]}</th><td><b class="g ${gradeClass(p.tools[k])}">${p.tools[k]}</b><span class="bar"><i style="width:${((p.tools[k] - 20) / 60) * 100}%"></i></span></td><td>${p.futureTools[k]}</td></tr>`,
      )
      .join('');
    return `<section class="tool-estimates">
      <h4>스카우팅 평가 (20–80)</h4>
      <div class="overall">
        <div><b>${p.ready}</b>현재</div><div><b>${p.scoutCeiling}</b>미래 가치</div>
        <div><b>${p.floorGrade}</b>플로어</div><div><b>${p.ceilingGrade}</b>실링</div>
      </div>
      <table class="tool-grade-table"><thead><tr><th>툴</th><th>현재</th><th>미래</th></tr></thead><tbody>${rows}</tbody></table>
      <p class="note">${p.tools.eye != null ? `선구안 ${p.tools.eye} · ` : ''}${p.pickTags.join(' · ')} · 불확실성 ${p.uncertainty}</p>
    </section>`;
  }

  /** Compact public tool grades at one point in time. */
  function toolSnapshot(p, tools, title) {
    return `<section class="tool-snapshot"><h4>${esc(title)}</h4><div>${C.grades
      .keys(p.role)
      .map((k) => `<span>${C.grades.LABELS[k]}<b>${tools?.[k] ?? '—'}</b></span>`)
      .join('')}</div></section>`;
  }

  Object.assign(UI, {
    esc, tag, signed, num, rate, teamName, teamDot, player, playerLink, hand, grade, gradeClass,
    statLine, toolTable, toolSnapshot,
  });
})(typeof window !== 'undefined' ? window : globalThis);
</script>
