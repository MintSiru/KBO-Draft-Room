  const TIERS = ['명문', '강호', '중견', '약소', '미분류'];
  const PICK_TYPES = ['즉전감', '플로어', '실링', '육성형', '역할형'];
  const roundLabel = (slot) => (slot?.round === 0 ? '지역 1차' : `${slot?.round || 1}라운드`);

  function filterPlayers(g, v, stars, team) {
    const q = v.query.trim();
    const list = C.available(g).filter(
      (p) =>
        (v.pickType === 'ALL' || p.pickTags.includes(v.pickType)) &&
        (v.role === 'ALL' || p.role === v.role) &&
        (v.pathway === 'ALL' || p.pathway === v.pathway) &&
        (v.tier === 'ALL' || (p.schoolTier || '미분류') === v.tier) &&
        (!v.onlyStars || stars.has(p.id)) &&
        (!q || `${p.name} ${p.pathText} ${p.region} ${p.birthplace}`.includes(q)),
    );
    return C.rules.sortPlayers(list, v.sort, v.sortDir, team);
  }

  function sortValue(p, key, team) {
    if (key === 'rank') return `${p.ready} / ${p.scoutCeiling}`;
    const n = C.rules.sortValue(p, key, team);
    if (n == null) return '—';
    if (key === 'outs') return C.innings(n);
    if (key === 'era') return n.toFixed(2);
    if (key === 'avg' || key === 'ops') return UI.rate(n);
    return String(n);
  }

  const columnLabel = (sort) => (sort === 'rank' ? '현재 / 미래' : C.rules.SORTS[sort].label);

  function sortOptions(selected) {
    const groups = [...new Set(Object.values(C.rules.SORTS).map((s) => s.group))];
    return groups
      .map(
        (group) =>
          `<optgroup label="${group}">${Object.entries(C.rules.SORTS)
            .filter(([, s]) => s.group === group)
            .map(([id, s]) => `<option value="${id}" ${selected === id ? 'selected' : ''}>${s.label}</option>`)
            .join('')}</optgroup>`,
      )
      .join('');
  }

  function rows(g, list, v, stars, team, selected) {
    if (!list.length)
      return `<div class="empty">조건에 맞는 후보가 없습니다. <button class="link" data-action="clear-filters">필터 초기화</button></div>`;
    const label = columnLabel(v.sort);
    return list
      .map((p) => {
        const fit = C.fit(p, team);
        return `<button class="player-row" data-action="player" data-id="${p.id}" aria-pressed="${selected === p.id}">
          <span class="rk">${p.rank}</span>
          <span><span class="nm">${stars.has(p.id) ? '★ ' : ''}${esc(p.name)}<small>${hand(p)}</small></span>
            <span class="meta">${C.ROLES[p.role]} · ${esc(p.school)} · ${esc(p.pathway)}</span></span>
          <span class="val">${sortValue(p, v.sort, team)}<small>${esc(label)}</small></span>
          <span class="fit ${fit >= 80 ? 'core' : ''}">${C.fitLabel(p, team)}</span>
        </button>`;
      })
      .join('');
  }

  function amateurLine(p) {
    const r = p.record;
    const where =
      p.pathway === '고졸' ? '고교 대회' : ['대졸', '대학 얼리'].includes(p.pathway) ? '대학 리그' : p.pathway === '독립구단' ? '독립리그' : '해외 리그';
    const main =
      r.kind === 'pitcher'
        ? `<span><b>${r.era.toFixed(2)}</b>ERA</span><span><b>${C.innings(r.outs)}</b>이닝</span><span><b>${r.k}</b>삼진</span><span><b>${r.bb}</b>볼넷</span>`
        : `<span><b>${UI.rate(r.avg)}</b>타율</span><span><b>${UI.rate(r.ops)}</b>OPS</span><span><b>${r.hr}</b>홈런</span><span><b>${r.sb}</b>도루</span>`;
    const extra = r.kind === 'pitcher' ? `${r.wins}승` : `${r.pa}타석 ${r.rbi}타점 ${r.runs}득점`;
    return `<div class="stat-line">${main}</div><p class="note">${where} ${r.games}경기 · ${extra}</p>`;
  }

  function profile(g, p, stars, team) {
    if (!p) return '<div class="box empty">왼쪽 목록에서 선수를 고르세요.</div>';
    const fit = C.fit(p, team);
    const advice = C.scoutAdvice(p, g).lines;
    return `<article class="box profile-body">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">
        <div>
          <h2>${esc(p.name)}</h2>
          <p class="sub">${C.ROLES[p.role]} · ${esc(p.archetype)} · ${hand(p)} · ${p.height}cm ${p.weight}kg</p>
          <p class="sub">${esc(p.school)} · ${esc(p.pathway)} · 만 ${p.age}세 · 공개 순위 ${p.rank}위</p>
        </div>
        <button class="btn quiet small" data-action="star" data-id="${p.id}" aria-pressed="${stars.has(p.id)}">${stars.has(p.id) ? '★ 관심' : '☆ 관심'}</button>
      </div>
      ${g.difficulty === 'easy' ? `<p class="favorite-note note">어릴 때 응원한 구단: ${C.TEAMS[p.favoriteTeam].short} (이지 난이도에서만 공개)</p>` : ''}
      <section>${UI.toolTable(p)}</section>
      <section>
        <h4>지명 전 시즌 기록</h4>
        ${amateurLine(p)}
        ${p.proExperience ? `<p class="note">${esc(p.proExperience.recordScope)} · 해외 ${p.proExperience.seasons}시즌. 국내 프로 미입단자의 복귀 지원이며, 리그 수준이 달라 국내 기록과 바로 비교하기 어렵습니다.</p>` : ''}
        ${p.awards.length ? `<div class="tags">${p.awards.map((x) => tag(x)).join('')}</div>` : ''}
        ${p.velocity ? `<p class="note">최고 구속 ${p.velocity}km/h</p>` : ''}
      </section>
      <section>
        <h4>스카우팅 리포트</h4>
        <dl class="facts"><dt>강점</dt><dd>${esc(p.strength)}</dd><dt>과제</dt><dd>${esc(p.weakness)}</dd>
        <dt>${esc(team.short)} 적합</dt><dd>${C.fitLabel(p, team)}${fit >= 60 ? ` · 보강 ${team.needs.indexOf(p.role) + 1}순위 포지션` : ''}</dd>
        <dt>첫해 전망</dt><dd>${C.outlook(p)} · ${C.upsideLabel(p)}</dd></dl>
      </section>
      <section class="advice">
        <h4>팀장 의견</h4>
        <ul>${advice.map((l) => `<li>${esc(l)}</li>`).join('')}</ul>
      </section>
      <section>
        <details><summary>배경 · 이력</summary>
          <dl class="facts">
            <dt>생년월일</dt><dd>${p.birthday}</dd><dt>출생지</dt><dd>${esc(p.birthplace)}</dd>
            <dt>야구부 평판</dt><dd>${esc(p.schoolTier || '해당 없음')}${p.schoolTier ? ` · ${esc(p.schoolStyle)}` : ''}${p.schoolTournament ? ` · ${esc(p.schoolTournament.event)} ${esc(p.schoolTournament.result)}` : ''}</dd>
            <dt>지역 1차</dt><dd>${p.regionalEligible ? esc(p.regionalRegion) + ' 대상' : '대상 아님'}</dd>
            <dt>성격</dt><dd>${esc(p.personality)}</dd>
          </dl>
          <ol class="history">${p.history
            .map((h) => `<li>${esc(h.name)} <span class="muted">${h.start.slice(0, 7)} – ${h.end ? h.end.slice(0, 7) : '현재'} · ${esc(h.status)}</span>${h.note ? `<small>${esc(h.note)}</small>` : ''}</li>`)
            .join('')}</ol>
        </details>
      </section>
      <div class="actions"><button class="btn primary wide" data-action="pick" data-id="${p.id}">${esc(p.name)} 지명</button></div>
    </article>`;
  }

  function myPicks(g) {
    const mine = C.myPicks(g),
      total = C.ROUNDS + (g.local ? 1 : 0);
    return `<section class="box">
      <h3>${UI.teamName(g.teamId)} 지명 <small class="muted">${mine.length}/${total}</small></h3>
      ${mine.length
        ? `<ul class="mine-list">${mine
            .map((s) => {
              const p = player(g, s.playerId);
              return `<li><span>${esc(s.label)}</span><b>${esc(p.name)}</b><span>${C.ROLES[p.role]}</span></li>`;
            })
            .join('')}</ul>`
        : '<p class="note">아직 지명한 선수가 없습니다.</p>'}
    </section>`;
  }

  function log(g) {
    return `<details class="box" style="margin-top:14px"><summary>전체 지명 기록 (${g.picks.length})</summary>
      ${g.picks.length
        ? `<div class="log-list">${g.picks
            .map((s) => {
              const p = player(g, s.playerId);
              return `<div${s.teamId === g.teamId ? ' class="good"' : ''}>${s.overall}. ${UI.teamName(s.teamId)} ${esc(s.label)} · ${esc(p.name)} <span class="muted">${C.ROLES[p.role]}</span></div>`;
            })
            .join('')}</div>`
        : '<p class="note">아직 지명이 없습니다.</p>'}
    </details>`;
  }

  function quota(g) {
    const q = C.quotaStatus(g);
    if (!q.missing) return `<p class="callout ok">대졸 의무 지명 충족 (${q.count}/1).</p>`;
    return `<p class="callout">${
      q.remaining <= q.missing
        ? '<b>마지막 전국 지명권입니다.</b> 국내 대학 졸업예정자만 지명할 수 있습니다.'
        : '<b>대졸 의무 지명 0/1</b> · 국내 대학 졸업예정자를 1명 이상 뽑아야 합니다(대학 얼리 제외).'
    }</p>`;
  }

  function board(g, v, stars, selectedId) {
    const t = C.teamFor(g),
      slot = g.schedule[g.cursor],
      mine = C.myPicks(g).length,
      total = C.ROUNDS + (g.local ? 1 : 0);
    const list = filterPlayers(g, v, stars, t);
    const selected = selectedId && C.available(g).some((p) => p.id === selectedId) ? player(g, selectedId) : null;
    const strip = C.TEAMS.map((club) => {
      const picked = g.picks.find((s) => s.round === slot.round && s.teamId === club.id);
      const you = club.id === g.teamId;
      return `<div class="${you ? 'you' : ''}"><b>${club.short}</b><span>${picked ? esc(player(g, picked.playerId).name) : you ? '지명 차례' : '—'}</span></div>`;
    }).join('');
    const chip = (action, id, label, on) => `<button class="chip" data-action="${action}" data-id="${id}" aria-pressed="${on}">${label}</button>`;
    return `
    <div class="on-clock">
      <div><span class="kicker">${roundLabel(slot)} · 전체 ${g.cursor + 1}번째</span><h1>${esc(t.short)}의 지명 차례</h1></div>
      <p class="count"><b>${mine}</b> / ${total}명 지명</p>
    </div>
    <div class="round-strip" aria-label="이번 라운드 지명 현황">${strip}</div>
    ${slot.round === 0 ? `<p class="callout">지역 1차 지명: ${esc(t.region)} 지역 고졸 후보만 보입니다.</p>` : quota(g)}
    <div class="cols">
      <div>
        <section class="box">
          <div class="board-tools">
            <div class="line">
              <label class="sr-only" for="search">선수·학교 검색</label>
              <input id="search" type="search" placeholder="이름·학교·지역 검색" value="${esc(v.query)}" autocomplete="off">
              <label class="sr-only" for="sort">정렬</label><select id="sort">${sortOptions(v.sort)}</select>
              <button class="btn quiet small" data-action="sort-direction" aria-label="정렬 방향 바꾸기">${v.sortDir === 'asc' ? '오름차순' : '내림차순'}</button>
            </div>
            <div class="chips">${[['ALL', '전체'], ...Object.entries(C.ROLES)].map(([id, name]) => chip('role', id, name, v.role === id)).join('')}${`<button class="chip" data-action="only-stars" aria-pressed="${v.onlyStars}">★ 관심</button>`}</div>
            <div class="chips">${[['ALL', '유형 전체'], ...PICK_TYPES.map((x) => [x, x])].map(([id, name]) => chip('pick-type', id, name, v.pickType === id)).join('')}</div>
            <div class="line">
              <label class="sr-only" for="pathway">출신</label><select id="pathway">${['ALL', ...PATHWAYS].map((x) => `<option value="${x}" ${v.pathway === x ? 'selected' : ''}>${x === 'ALL' ? '출신 전체' : x}</option>`).join('')}</select>
              <label class="sr-only" for="tier">야구부 평판</label><select id="tier">${['ALL', ...TIERS].map((x) => `<option value="${x}" ${v.tier === x ? 'selected' : ''}>${x === 'ALL' ? '평판 전체' : x}</option>`).join('')}</select>
              <span class="note" id="candidate-count" style="margin-left:auto">${list.length}명</span>
            </div>
          </div>
          <div class="roster-head"><span>순위</span><span>선수</span><span>${esc(columnLabel(v.sort))}</span><span>적합</span></div>
          <div class="roster" id="roster">${rows(g, list, v, stars, t, selectedId)}</div>
        </section>
        ${log(g)}
      </div>
      <div><div id="profile" class="profile">${profile(g, selected, stars, t)}</div><div style="margin-top:14px">${myPicks(g)}</div></div>
    </div>`;
  }

  Object.assign(UI, { board, rows, profile, filterPlayers, myPicksBox: myPicks, pickLog: log, roundLabel });
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* Screen 4: the GM's press conference promise and the rookies' first interviews. */
(function (root) {
  'use strict';
  const C = root.DraftCore,
    UI = root.DraftUI;
  const { esc, signed, player } = UI;

  function gm(g) {
    const opts = C.gmOptions(g),
      chosen = opts.find((c) => c.id === g.gmChoice);
    if (chosen)
      return `<section class="box gm-section">
        <h2>단장 기자회견 <small class="muted">답변 확정</small></h2>
        <h3 style="margin-top:8px">${esc(chosen.title)}</h3>
        <blockquote style="margin:8px 0">${esc(chosen.answer)}</blockquote>
        <p><b>약속</b> ${esc(chosen.promise)} · 팬심 ${signed(chosen.delta)}</p>
        <p class="note">${esc(chosen.reaction)} 첫 시즌이 끝나면 약속을 지켰는지 평가합니다.</p>
      </section>`;
    return `<section class="box gm-section">
      <h2>단장 기자회견</h2>
      <p>“이번 지명으로 첫해에 무엇을 보여 주실 겁니까?” 답변은 한 번만 고를 수 있고, 팬심과 첫해 평가에 반영됩니다. 선수 성장에는 영향이 없습니다.</p>
      <div class="options">${opts
        .map(
          (c) => `<div>
            <h3>${esc(c.title)}</h3>
            <blockquote>${esc(c.answer)}</blockquote>
            <p><b>평가 기준</b><br>${esc(c.promise)}</p>
            <p class="note">${esc(c.reaction)}</p>
            <button class="btn" data-action="gm-choice" data-id="${c.id}">이 답변 선택 (팬심 ${signed(c.delta)})</button>
          </div>`,
        )
        .join('')}</div>
    </section>`;
  }

  function interviews(g) {
    const quotes = C.myPicks(g)
      .map((s) => {
        const p = player(g, s.playerId);
        return `<article class="box quote">
          <span class="kicker">${esc(s.label)} · ${C.ROLES[p.role]}</span>
          <h3>${esc(p.name)} <small class="muted">${esc(p.school)}</small></h3>
          <blockquote>${esc(C.interview(p, s, g, 'ceremony'))}</blockquote>
          <p class="note">${C.outlook(p)} · ${esc(p.personality)}</p>
        </article>`;
      })
      .join('');
    return `
    <div class="page-head"><h1>드래프트 종료</h1>
      <p>${esc(C.teamFor(g).short)}의 신인 ${C.myPicks(g).length}명이 정해졌습니다. 단장 답변을 고르면 ${C.ENTRY_YEAR} 시즌을 시작할 수 있습니다.</p></div>
    ${gm(g)}
    <h2 class="rule">입단 소감</h2>
    <div class="quotes">${quotes}</div>
    ${UI.pickLog(g)}
    <div class="actions">
      <button class="btn primary" data-action="simulate" ${g.gmChoice ? '' : 'disabled'}>${g.career ? '시즌 화면으로 돌아가기' : `${C.ENTRY_YEAR} 시즌 진행`}</button>
      ${g.gmChoice ? '' : '<span class="note">먼저 기자회견 답변을 고르세요.</span>'}
    </div>`;
  }

  Object.assign(UI, { gm, interviews });
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* Screens 5–6: the season hub, the all-club records room, a player's career and the draft review. */
(function (root) {
  'use strict';
  const C = root.DraftCore,
    UI = root.DraftUI;
  const { esc, tag, num, rate, teamName, player, playerLink } = UI;

  /** One row per drafted player, with stats for one season or the career total. */
  function rows(g, year = 'all', teamId = 'ALL', scope = 'origin', sort = 'rank', level = 'stats') {
    const years = g.career?.years || [],
      chosen = year === 'all' ? null : years.find((y) => String(y.year) === String(year)) || years.at(-1);
    const out = g.picks
      .map((s) => {
        const p = player(g, s.playerId),
          state = g.career?.players[p.id],
          hist = g.career ? C.Career.history(g.career, p.id) : [];
        const rec = chosen ? chosen.records.find((r) => r.playerId === p.id) : null;
        return {
          p, s, state, rec,
          stats: chosen ? rec?.stats : C.Career.totalStats(hist),
          futures: chosen ? rec?.futures : C.Career.totalStats(hist, 'futures'),
          teamId: scope === 'origin' ? s.teamId : state ? state.currentTeamId : s.teamId,
          contribution: chosen ? rec?.contribution || 0 : hist.reduce((n, r) => n + r.contribution, 0),
          honors: years.flatMap((y) => y.awards).filter((a) => a.playerId === p.id && (!chosen || a.year === chosen.year)).length,
        };
      })
      .filter((x) => teamId === 'ALL' || x.teamId === teamId);
    const value = (x) => {
      const st = x[level];
      const only = (kind, v) => (st?.kind === kind ? v : null);
      switch (sort) {
        case 'rank': return x.s.overall;
        case 'contribution': return x.contribution;
        case 'games': return st?.games ?? null;
        case 'hr': return only('hitter', st?.hr);
        case 'ops': return only('hitter', st?.ops);
        case 'wins': return only('pitcher', st?.wins);
        case 'era': return only('pitcher', st?.era);
        case 'outs': return only('pitcher', st?.outs);
        default: return x.honors;
      }
    };
    const ascending = sort === 'rank' || sort === 'era';
    return out.sort((a, b) => {
      const av = value(a), bv = value(b);
      if (av == null && bv != null) return 1;
      if (bv == null && av != null) return -1;
      return (av == null ? 0 : (av - bv) * (ascending ? 1 : -1)) || a.s.overall - b.s.overall;
    });
  }

  function recordTable(g, list, level = 'stats') {
    if (!list.length) return '<p class="empty">해당하는 선수가 없습니다.</p>';
    const mixed = list.some((x) => x.s.teamId !== g.teamId);
    return ['hitter', 'pitcher']
      .map((kind) => {
        const group = list.filter((x) => x.p.record.kind === kind);
        if (!group.length) return '';
        const labels = kind === 'hitter' ? ['G', 'PA', 'AVG', 'OPS', 'HR', 'RBI', 'SB'] : ['G', 'GS', 'IP', 'ERA', 'W', 'HLD', 'SV', 'K', 'BB', 'QS'];
        const body = group
          .map((x) => {
            const s = x[level];
            const values = !s
              ? labels.map(() => '—')
              : kind === 'hitter'
                ? [s.games, s.pa, rate(s.avg), rate(s.ops), s.hr, s.rbi, s.sb]
                : [s.games, s.gs, C.innings(s.outs), num(s.era, 2), s.wins, s.holds, s.saves, s.k, s.bb, s.qs];
            const now = x.state ? x.state.currentTeamId : x.s.teamId;
            const moved = x.state?.status === 'released' ? '방출' : now !== x.s.teamId ? `→ ${teamName(now)}` : '';
            return `<tr class="${mixed && x.s.teamId === g.teamId ? 'mine' : ''}">
              <td>${playerLink(x.p.id, x.p.name)}<small>${teamName(x.s.teamId)} ${esc(x.s.label)} · ${C.ROLES[x.p.role]}</small></td>
              <td>${moved ? `<span class="warn">${moved}</span>` : ''}</td>
              ${values.map((v) => `<td class="n">${esc(v)}</td>`).join('')}
              <td class="n">${level === 'stats' ? x.contribution : '—'}</td></tr>`;
          })
          .join('');
        return `<h3 style="margin:16px 0 6px">${kind === 'hitter' ? '야수' : '투수'} <small class="muted">${group.length}명</small></h3>
          <div class="table-scroll" tabindex="0" aria-label="${kind === 'hitter' ? '야수' : '투수'} 기록 (가로 스크롤)">
          <table class="t record-table"><thead><tr><th>선수</th><th>이적</th>${labels.map((l) => `<th class="n">${l}</th>`).join('')}<th class="n">기여</th></tr></thead>
          <tbody>${body}</tbody></table></div>`;
      })
      .join('');
  }

  function development(g, year) {
    const own = new Set(C.myPicks(g).map((s) => s.playerId));
    const cards = year.records
      .filter((r) => own.has(r.playerId))
      .map((r) => {
        const p = player(g, r.playerId);
        const from = r.startGrade ?? r.scoutReady;
        return `<article>
          <div style="display:flex;justify-content:space-between;gap:6px">${playerLink(p.id, p.name)}${tag(r.routeLabel, r.route === 'regular' ? 'good' : '')}</div>
          <p class="move">${from} → ${r.scoutReady} <small>현재 기량 · 지명 당시 FV ${p.scoutCeiling}</small></p>
          <p>${esc(r.note)}</p>
          <p class="note">${esc(r.growthLabel)} · 계획 이행 ${r.planScore}점</p>
        </article>`;
      })
      .join('');
    return `<h2 class="rule">보직과 성장 <small>시즌 시작 → 종료 평가</small></h2>
      <div class="development-grid">${cards}</div>
      <p class="note">1군 콜업은 시즌 시작 기량으로 정하고, 종료 평가는 그해 성장을 반영합니다. 등급이 그대로여도 5점 단위 안에서 변화가 쌓입니다.</p>`;
  }

  function events(g, items) {
    if (!items.length) return '<p class="note">선수 이동이 없었습니다.</p>';
    return `<ul class="event-list">${items
      .map(
        (ev) => `<li><b>${ev.type === 'trade' ? `트레이드 · ${teamName(ev.fromTeamId)} ↔ ${teamName(ev.toTeamId)}` : `방출 · ${teamName(ev.fromTeamId)}`}</b>
          ${ev.playerIds.map((id) => playerLink(id, player(g, id).name)).join(' ↔ ')}
          <small>${esc(ev.reason)} (${ev.year}시즌 종료 후)</small></li>`,
      )
      .join('')}</ul>`;
  }

  function season(g, index) {
    const years = g.career.years,
      y = years[Math.min(index, years.length - 1)] || years.at(-1),
      yearNo = y.year - C.ENTRY_YEAR + 1,
      own = y.records.filter((r) => r.teamId === g.teamId),
      mine = rows(g, String(y.year), g.teamId, 'origin', 'rank'),
      standing = y.league.table.find((t) => t.teamId === g.teamId);
    const classAwards = y.awards.filter((a) => a.scope === 'draft-class'),
      champs = y.awards.filter((a) => a.scope === 'team');
    return `
    <div class="page-head">
      <span class="kicker">${yearNo}년 차 / 5</span>
      <h1>${y.year} 시즌 결과</h1>
      <p>${esc(teamName(g.teamId))} 정규시즌 ${standing.rank}위 (${standing.wins}승 ${standing.losses}패) · 한국시리즈 우승 ${esc(teamName(y.league.champion))}</p>
    </div>
    <nav class="year-tabs" aria-label="시즌 선택">${years
      .map((s, i) => `<button data-action="view-year" data-index="${i}" aria-pressed="${s.year === y.year}">${s.year}</button>`)
      .join('')}</nav>
    <div class="summary-strip">
      <div><b>${own.length}</b>우리 팀 소속 동기</div>
      <div><b>${own.filter((r) => r.stats.games > 0).length}</b>1군 출전</div>
      <div><b>${own.filter((r) => r.route === 'regular').length}</b>1군 주전급</div>
      <div><b>${standing.rank}위</b>정규시즌</div>
    </div>
    <h2 class="rule">우리가 지명한 선수 <button class="btn quiet small" data-action="records">전체 구단 기록실</button></h2>
    <p class="note">원지명 기준입니다. 다른 팀으로 옮긴 선수도 계속 보여 줍니다. 이름을 누르면 경력 전체를 볼 수 있습니다.</p>
    ${recordTable(g, mine)}
    ${development(g, y)}
    <div class="cols even" style="margin-top:8px">
      <section>
        <h2 class="rule">동기 개인상 <small>이번 드래프트 출신끼리 비교</small></h2>
        ${classAwards.length ? `<ul class="event-list">${classAwards.map((a) => `<li><b>${esc(a.title.replace('드래프트 동기 ', ''))}</b> ${playerLink(a.playerId, player(g, a.playerId).name)} <span class="muted">${teamName(a.teamId)}</span></li>`).join('')}</ul>` : '<p class="note">최소 출전 기준을 넘긴 선수가 없습니다.</p>'}
        <p class="note">우승 멤버: ${champs.map((a) => playerLink(a.playerId, player(g, a.playerId).name)).join(', ') || '없음'}</p>
        <h2 class="rule">${y.year} 비시즌</h2>
        ${events(g, y.events)}
      </section>
      <section>
        <h2 class="rule">순위표</h2>
        <table class="t standings"><tbody>${y.league.table
          .map((t) => `<tr class="${t.teamId === g.teamId ? 'mine' : ''}"><td class="n">${t.rank}</td><td>${UI.teamDot(t.teamId)}${teamName(t.teamId)}${t.teamId === y.league.champion ? ' ' + tag('우승', 'solid') : ''}</td><td class="n">${t.wins}승 ${t.losses}패</td></tr>`)
          .join('')}</tbody></table>
        <details style="margin-top:8px"><summary>포스트시즌</summary>${y.league.series
          .map((s) => `<p class="note">${s.label}: ${teamName(s.home)} ${s.homeWins}–${s.awayWins} ${teamName(s.away)} → ${teamName(s.winner)}</p>`)
          .join('')}</details>
      </section>
    </div>
    <div class="actions">
      ${years.length < 5 ? `<button class="btn primary" data-action="next-season">${years.at(-1).year + 1} 시즌 진행</button>` : '<button class="btn primary" data-action="owner">5년 최종 평가 보기</button>'}
      ${years.length < 5 ? '<button class="btn" data-action="owner">중간 평가</button>' : ''}
      <button class="btn quiet" data-action="interviews">입단 소감 다시 보기</button>
    </div>`;
  }

  function room(g, f) {
    const years = g.career?.years || [],
      list = rows(g, f.year, f.team, f.scope, f.sort, f.level);
    const opt = (v, label, cur) => `<option value="${v}" ${String(cur) === String(v) ? 'selected' : ''}>${label}</option>`;
    const sorts = { rank: '지명 순서', contribution: '1군 기여', games: '경기 수', hr: '홈런', wins: '승수', ops: 'OPS', era: 'ERA (낮은 순)', outs: '이닝', awards: '수상 수' };
    return `
    <div class="page-head"><h1>전체 구단 기록실</h1>
      <p>10개 구단이 이번 드래프트에서 뽑은 선수 모두의 기록입니다. 이름을 누르면 경력 전체를 볼 수 있습니다.</p>
      <div class="actions" style="margin-top:10px"><button class="btn" data-action="records-close">돌아가기</button></div></div>
    <div class="record-filters">
      <label class="field">구단<select id="record-team">${opt('ALL', '전체', f.team)}${C.TEAMS.map((t) => opt(t.id, t.short, f.team)).join('')}</select></label>
      <label class="field">구단 기준<select id="record-scope">${opt('origin', '원지명 구단', f.scope)}${opt('current', '현재 소속', f.scope)}</select></label>
      <label class="field">시즌<select id="record-year">${opt('all', '통산', f.year)}${years.map((y) => opt(y.year, `${y.year} (${y.year - C.ENTRY_YEAR + 1}년 차)`, f.year)).join('')}</select></label>
      <label class="field">리그<select id="record-level">${opt('stats', '1군', f.level)}${opt('futures', '퓨처스', f.level)}</select></label>
      <label class="field">정렬<select id="record-sort">${Object.entries(sorts).map(([k, l]) => opt(k, l, f.sort)).join('')}</select></label>
    </div>
    <p class="note">${list.length}명. 기여는 1군 성적으로 만든 게임 내 지수입니다(WAR 아님).${years.length ? '' : ' 아직 시즌을 진행하지 않았습니다.'}</p>
    ${recordTable(g, list, f.level)}`;
  }

  function profile(g, id) {
    const p = player(g, id),
      sel = g.picks.find((s) => s.playerId === id);
    if (!p || !sel) return '<p>지명 선수를 찾을 수 없습니다.</p>';
    const hist = g.career ? C.Career.history(g.career, id) : [],
      state = g.career?.players[id];
    const honors = (g.career?.years || []).flatMap((y) => y.awards).filter((a) => a.playerId === id),
      evs = (g.career?.events || []).filter((a) => a.playerIds.includes(id));
    const now = state ? state.currentTeamId : sel.teamId;
    const pending = state?.status === 'active' && hist.length === 5 && hist.at(-1).age <= 24 && state.scoutReady < p.scoutCeiling;
    const r = p.record;
    return `<div class="career-profile">
      <span class="kicker">${teamName(sel.teamId)} ${esc(sel.label)} 지명${now !== sel.teamId ? ` · 현재 ${teamName(now)}` : ''}</span>
      <h2>${esc(p.name)}</h2>
      <p>${C.ROLES[p.role]} · ${esc(p.pathway)}${p.quotaEligible ? ' (대졸 의무 대상)' : ''} · ${UI.hand(p)} · ${p.height}cm ${p.weight}kg</p>
      <p class="muted">${esc(p.pathText)} · ${p.birthday} 출생 · 지명 당시 만 ${p.age}세${hist.length ? `, ${hist.at(-1).year}년 말 만 ${hist.at(-1).age}세` : ''}</p>
      <p>강점: ${esc(p.strength)} 과제: ${esc(p.weakness)}</p>
      ${pending ? '<p class="callout">아직 성장 중인 젊은 선수입니다. 5년만으로 평가를 끝내기 이릅니다.</p>' : ''}
      <h3>지명 당시 평가</h3>
      ${UI.toolTable(p)}
      ${state ? UI.toolSnapshot(p, state.publicTools, `현재 세부 기량 · 종합 ${state.scoutReady}`) : ''}
      <p class="note">지명 전 시즌: ${r.kind === 'pitcher' ? `${r.games}경기 ${C.innings(r.outs)}이닝 ERA ${num(r.era, 2)} ${r.k}삼진` : `${r.games}경기 ${r.pa}타석 타율 ${rate(r.avg)} OPS ${rate(r.ops)} ${r.hr}홈런`}</p>
      <h3>연도별 기록</h3>
      ${hist.length
        ? hist
            .map(
              (y) => `<article class="year-report">
                <header><b>${y.year} · ${teamName(y.teamId)}</b>${tag(y.routeLabel, y.route === 'regular' ? 'good' : '')}</header>
                <p>1군: ${UI.statLine(y.stats)}</p>
                <p class="muted">퓨처스: ${UI.statLine(y.futures)}</p>
                <p>${esc(y.note)}</p>
                <p class="note">${esc(y.growthLabel)} · 현재 기량 ${y.startGrade ?? y.scoutReady} → ${y.scoutReady} · 계획 이행 ${y.planScore}</p>
                ${y.publicTools ? UI.toolSnapshot(p, y.publicTools, '시즌 종료 세부 기량') : ''}
              </article>`,
            )
            .join('') +
          `<p><b>1군 통산</b> ${UI.statLine(C.Career.totalStats(hist))}</p><p class="muted"><b>퓨처스 통산</b> ${UI.statLine(C.Career.totalStats(hist, 'futures'))}</p>`
        : '<p class="note">아직 프로 시즌을 치르지 않았습니다.</p>'}
      <h3>수상</h3>
      ${honors.length ? honors.map((a) => `<p>${a.year} · ${esc(a.title)} (${teamName(a.teamId)})</p>`).join('') : '<p class="note">없음</p>'}
      <h3>이적·방출</h3>
      ${events(g, evs)}
    </div>`;
  }

  function pledge(g) {
    const o = g.owner,
      c = C.press.GM_CHOICES.find((x) => x.id === g.gmChoice);
    return `<section class="box pledge-review">
      <h3>기자회견 약속: ${esc(c.title)} — ${esc(o.pledge.status)} (${UI.signed(o.pledge.bonus)}점)</h3>
      <p>${esc(o.pledge.detail)}. 첫해 평가 ${o.baseScore}점 ${UI.signed(o.pledge.bonus)} = ${o.score}점 (${o.grade}).</p>
    </section>`;
  }

  function review(g) {
    const all = C.careerReview(g),
      mine = all.find((t) => t.teamId === g.teamId),
      n = g.career.years.length,
      first = g.owner;
    const bar = (label, v) => `<div>${label} <b class="num">${Math.round(v)}%</b><span><i style="width:${Math.max(0, Math.min(100, v))}%"></i></span></div>`;
    return `
    <div class="page-head">
      <span class="kicker">${n === 5 ? '최종 평가' : `중간 평가 · ${n}시즌 경과`}</span>
      <h1>${n === 5 ? '다섯 시즌 뒤 돌아본 드래프트' : `${n}시즌까지의 드래프트 평가`}</h1>
      <p>원지명 선수가 어디서 뛰었든 전체 경력으로 평가하고, 우리 팀에서 낸 기여는 따로 셉니다.</p>
    </div>
    <div class="cols">
      <section class="box">
        <div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap">
          <div class="grade-card"><div class="letter">${mine.grade}</div><div class="score">${mine.score} / 100</div></div>
          <div class="score-bars" style="flex:1;min-width:220px">
            ${bar('1군에 데뷔한 비율', (mine.debut / mine.count) * 100)}
            ${bar('주전급으로 자리 잡은 비율', (mine.established / mine.count) * 100)}
            ${bar('기여 중 우리 팀에서 낸 비율', mine.total ? (mine.atHome / mine.total) * 100 : 0)}
          </div>
        </div>
        <dl class="facts" style="margin-top:14px">
          <dt>1군 출전</dt><dd>${mine.debut}/${mine.count}명 · 주전급 경험 ${mine.established}명</dd>
          <dt>기여 합계</dt><dd>${mine.total} (우리 팀에서 ${mine.atHome})</dd>
          <dt>기량 변화</dt><dd>지명 당시 대비 평균 ${UI.signed(mine.development)}</dd>
          <dt>기타</dt><dd>동기 개인상 ${mine.awards}회 · 방출 ${mine.released}명 · 성장 중 ${mine.pending}명</dd>
        </dl>
        <p class="note">점수 = 보강 적합 20% + 기여(인원·시즌 보정) 50% + 기량 발전 30%.</p>
      </section>
      <aside>
        <section class="box"><h3>첫해 구단주 평가</h3>
          <p style="font-size:28px;font-weight:800">${first.grade} <small class="muted">${first.score}점</small></p>
          <p class="note">보강 ${first.needScore} · 첫해 계획 ${first.production} · 미래 가치 ${first.future}</p>
        </section>
        ${pledge(g)}
      </aside>
    </div>
    <h2 class="rule">10개 구단 비교</h2>
    <div class="table-scroll" tabindex="0"><table class="t record-table">
      <thead><tr><th>구단</th><th class="n">순위</th><th class="n">평가</th><th class="n">1군 출전</th><th class="n">주전급</th><th class="n">전체 기여</th><th class="n">원구단 기여</th><th class="n">개인상</th></tr></thead>
      <tbody>${all
        .map((x, i) => `<tr class="${x.teamId === g.teamId ? 'mine' : ''}"><td><button class="link" data-action="team-records" data-id="${x.teamId}">${teamName(x.teamId)}</button></td><td class="n">${i + 1}</td><td class="n">${x.grade} ${x.score}</td><td class="n">${x.debut}/${x.count}</td><td class="n">${x.established}</td><td class="n">${x.total}</td><td class="n">${x.atHome}</td><td class="n">${x.awards}</td></tr>`)
        .join('')}</tbody>
    </table></div>
    <div class="actions">
      ${n < 5 ? `<button class="btn primary" data-action="next-season">${C.ENTRY_YEAR + n} 시즌 진행</button>` : ''}
      <button class="btn" data-action="season">시즌별 기록</button>
      <button class="btn" data-action="records">전체 구단 기록실</button>
      <button class="btn quiet" data-action="export-save">진행 파일 저장</button>
      <button class="btn quiet" data-action="download">첫해 결과 이미지</button>
    </div>`;
  }

  Object.assign(UI, { recordRows: rows, recordTable, development, season, room, careerProfile: profile, review, pledge });
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* Modal contents and the in-game toolbar. Each dialog returns { title, body, wide? }. */
(function (root) {
  'use strict';
  const C = root.DraftCore,
    UI = root.DraftUI;
  const { esc, tag, signed, player } = UI;

  /** Bar under the steps: difficulty, fan mood and the archives that stay reachable all game. */
  function gameBar(g) {
    const fan = C.fanState(g);
    return `<div class="actions" style="margin:0 0 18px;padding-bottom:12px;border-bottom:1px solid var(--rule)">
      ${tag(C.rules.DIFFICULTIES[g.difficulty].name, 'solid')}
      <button class="btn quiet small" data-action="fan-history">팬심 <b class="num">${fan.score}</b> · ${esc(fan.label)}</button>
      <button class="btn quiet small" data-action="mock-archive">언론 예상</button>
      <button class="btn quiet small" data-action="scout-archive">팀장 추천</button>
      <button class="btn quiet small" data-action="news-room">뉴스 ${g.news.length}</button>
      <button class="btn quiet small" data-action="records">기록실</button>
      <button class="btn quiet small" data-action="export-save">진행 파일 저장</button>
      <span class="note" style="margin-left:auto">${g.career ? `${g.career.years.length}/5 시즌` : '대졸 의무 1명 · 5시즌 추적'}</span>
    </div>`;
  }

  function newsCard(n) {
    return `<article class="news-article" data-news-id="${n.id}">
      <span class="kicker">${esc(n.label)}</span>
      <h3>${esc(n.headline)}</h3>
      <p>${esc(n.body)}</p>
      <div class="comments">${n.comments.map((c) => `<p><b>${esc(c.handle)}</b> <span class="muted">${esc(c.tone)}</span><br>${esc(c.text)}</p>`).join('')}</div>
    </article>`;
  }

  const catalogKinds = {
    'high-school': '고교', 'hs-club': '고교 연령 클럽', college: '국내 대학', independent: '독립구단',
    'overseas-college': '해외 대학', 'overseas-pro': '해외 프로 구단', 'overseas-independent': '해외 독립 구단',
  };

  const dialogs = {
    confirm(g, { id }) {
      const p = player(g, id),
        slot = g.schedule[g.cursor],
        t = C.teamFor(g);
      return {
        title: `${UI.roundLabel(slot)} 지명 확정`,
        body: `<h3>${esc(p.name)}</h3><p class="muted">${C.ROLES[p.role]} · ${esc(p.school)} · ${UI.hand(p)}</p>
          <p style="margin-top:8px">${C.fitLabel(p, t)} · ${C.outlook(p)}. 확정하면 되돌릴 수 없고, 다음 우리 차례까지 다른 구단 지명이 자동으로 진행됩니다.</p>
          <div class="actions"><button class="btn primary" data-action="confirm-pick" data-id="${p.id}">지명 확정</button><button class="btn quiet" data-action="close-modal">취소</button></div>`,
      };
    },
    interview(g, { selection }) {
      const p = player(g, selection.playerId),
        t = C.teamFor(g);
      return {
        title: `${selection.round === 0 ? '지역 1차' : '1라운드'} 지명 · ${esc(t.short)}`,
        body: `<h3>${esc(p.name)} <small class="muted">${C.ROLES[p.role]} · ${esc(p.school)}</small></h3>
          <p style="margin-top:10px"><b>감독</b> ${esc(C.coach(p, g))}</p>
          <p style="margin-top:8px"><b>${esc(p.name)}</b> ${esc(C.interview(p, selection, g))}</p>
          ${newsCard(g.news.find((n) => n.overall === selection.overall))}
          <div class="actions"><button class="btn primary" data-action="close-modal">계속</button></div>`,
      };
    },
    scout: (g) => ({ title: '지명 전 팀장 추천', body: UI.briefing(g, true), wide: true }),
    mock: (g) => ({ title: '지명 전 언론 예상', body: UI.forecasts(g, true), wide: true }),
    news: (g) => ({
      title: '드래프트 뉴스',
      body: g.news.length ? [...g.news].reverse().map(newsCard).join('') : '<p class="empty">지역 1차·1라운드 지명 뒤 기사가 올라옵니다.</p>',
    }),
    fans(g) {
      const f = C.fanState(g);
      return {
        title: `팬심 ${f.score} · ${f.label}`,
        body: `<ol class="fan-timeline">${f.timeline
          .map((x) => `<li><span>${esc(x.label)}</span><span class="num">${signed(x.delta)}</span><span class="num">${x.score}</span></li>`)
          .join('')}</ol><p class="note">팬심은 지명 반응과 기자회견 약속으로 움직이며, 구단주 평가 점수에는 더하지 않습니다.</p>`,
      };
    },
    reset: () => ({
      title: '새 게임',
      body: `<p>지금 진행 중인 드래프트와 시즌 기록이 지워집니다. 남겨 두려면 먼저 진행 파일을 저장하세요.</p>
        <div class="actions"><button class="btn primary" data-action="confirm-reset">지우고 새로 시작</button><button class="btn quiet" data-action="close-modal">취소</button></div>`,
    }),
    import: () => ({
      title: '진행 파일 불러오기',
      body: `<p>파일을 확인했습니다. 불러오면 지금 진행 중인 게임을 대신합니다.</p>
        <div class="actions"><button class="btn primary" data-action="confirm-import">불러오기</button><button class="btn quiet" data-action="close-modal">취소</button></div>`,
    }),
    catalog: () => ({
      title: `가상 소속 명단 · ${C.catalog.length}개`,
      body: `<p class="note">학교·구단은 모두 가상이며, 평판은 게임 속 야구부 전력입니다.</p>
        <div class="catalog-list">${Object.entries(catalogKinds)
          .map(([kind, label]) => {
            const list = C.catalog.filter((s) => s.kind === kind);
            return `<details><summary>${label} (${list.length})</summary><ul>${list
              .map((s) => `<li>${esc(s.name)}<span>${esc(s.region || s.country)}${s.tier ? ' · ' + esc(s.tier) : s.level ? ' · ' + esc(s.level) : ''}</span></li>`)
              .join('')}</ul></details>`;
          })
          .join('')}</div>`,
    }),
    career: (g, { id }) => ({ title: '선수 경력', body: UI.careerProfile(g, id), wide: true }),
    rules: () => ({ title: '플레이 가이드', body: guide(), wide: true }),
  };

  function guide() {
    return `<div class="guide">
      <h3>진행 순서</h3>
      <ol>
        <li>구단·난이도·지역 1차 지명 여부를 고릅니다. 지명 순서는 지난 시즌 성적의 역순이며 매 라운드 같습니다.</li>
        <li>언론 두 곳의 1라운드 예상과 스카우트 팀장의 추천 3명을 봅니다.</li>
        <li>전국 7라운드(지역 1차를 켜면 연고 지역 고졸 1명 추가)를 지명합니다. 구단마다 국내 대학 졸업예정자를 1명 이상 뽑아야 하며, 대학 얼리 참가자는 포함되지 않습니다.</li>
        <li>단장 기자회견에서 첫해 목표를 약속하고, 입단 소감을 듣습니다.</li>
        <li>${C.ENTRY_YEAR}–${C.ENTRY_YEAR + 4} 다섯 시즌을 한 해씩 진행합니다. 보직·기록·성장·건강이 다음 해로 이어지고, 2년 차가 끝난 뒤부터 트레이드, 3년 차가 끝난 뒤부터 방출이 생길 수 있습니다.</li>
        <li>5년이 끝나면 10개 구단의 드래프트를 비교 평가합니다.</li>
      </ol>
      <h3>능력치 읽는 법 (20–80)</h3>
      <ol>
        <li>모든 공개 능력치는 20–80 척도, 5점 단위입니다. 개별 툴 50이 1군 평균, 80은 최상급입니다.</li>
        <li><b>현재</b>는 지금 기량, <b>미래 가치(FV)</b>는 성장 후 예상 역할, <b>플로어·실링</b>은 나쁘게·잘 풀렸을 때의 전망입니다.</li>
        <li>투수: 구위·커맨드·변화구는 투구 성적, 체력은 소화 이닝에 반영됩니다. 야수: 컨택·장타력·주력·수비와 보조 항목 선구안.</li>
        <li>스카우팅에는 관측 오차가 있고, 고졸일수록 큽니다. 프로에서 뛰는 해가 늘면 평가가 정확해집니다.</li>
        <li>난이도는 조언의 양과 CPU 구단의 판단 방식만 바꿉니다. 선수 능력과 성장은 같습니다. 이지에서만 선수가 어릴 때 응원한 구단이 보입니다(효과 없음).</li>
      </ol>
      <h3>저장</h3>
      <ol>
        <li>진행 상황은 이 브라우저에 자동 저장됩니다. ‘진행 파일 저장’으로 JSON을 받아 다른 기기에서 불러올 수 있습니다.</li>
        <li>진행 파일에는 설정과 지명 같은 선택만 들어 있고, 불러올 때 나머지를 다시 계산합니다. 그래서 파일이 아주 작고, 고쳐도 결과가 바뀌지 않습니다. 게임 규칙이 바뀐 버전에서는 이전 진행 파일을 이어 할 수 없다고 알려 줍니다.</li>
        <li>V0.6 진행 파일만 불러올 수 있습니다. V0.5와는 능력치 체계가 달라 호환되지 않습니다.</li>
      </ol>
      <p class="note">구단명을 뺀 선수·학교·기록·기사는 모두 가상이며, 지역 1차·의무 지명·포스트시즌은 게임용으로 단순화한 규칙입니다. 실제 KBO 규정이나 선수 평가를 재현하지 않습니다.</p>
    </div>`;
  }

  Object.assign(UI, { gameBar, newsCard, dialogs, guide });
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* App controller: UI state, rendering, event delegation, autosave, JSON import/export and the PNG card. */
(function () {
  'use strict';
  const C = window.DraftCore,
    UI = window.DraftUI;
  const $ = (s) => document.querySelector(s);
  const STORE = 'draft-room-kbo-v6-scouting'; // unchanged since V0.6 so existing saves keep loading
  const STEPS = ['구단 선택', '예상·추천', '드래프트', '입단', '5시즌', '평가'];
  const PHASE_STEP = { preview: 2, scouting: 2, draft: 3, interviews: 4, season: 5, owner: 6 };

  const newSeed = () => Date.now() + '-' + Math.random();
  const defaultView = () => ({ query: '', sort: 'rank', sortDir: 'asc', role: 'ALL', pathway: 'ALL', tier: 'ALL', pickType: 'ALL', onlyStars: false });

  const state = {
    game: null,
    setup: { selectedTeam: 'kiwoom', difficulty: 'normal', local: false, seed: newSeed() },
    view: defaultView(), // draft-board filters
    selected: null, // player shown in the draft profile
    stars: new Set(),
    recordsOpen: false,
    records: { team: 'ALL', scope: 'origin', year: 'all', level: 'stats', sort: 'rank' },
    yearIndex: 0,
    modal: null,
    storageOK: true,
    notice: null, // shown above the setup screen, e.g. when an old save could not be continued
  };
  let lastFocus = null,
    toastTimer = null,
    lastAdvance = 0;

  // ---------- persistence ----------
  function adopt(game, stars = []) {
    state.game = game;
    Object.assign(state.setup, { selectedTeam: game.teamId, local: game.local, difficulty: game.difficulty });
    state.stars = new Set(stars.filter((id) => typeof id === 'string' && C.getPlayer(game, id)));
    state.yearIndex = (game.career?.years.length || 1) - 1;
    if (game.phase === 'draft') C.advanceToUser(game);
  }
  try {
    const saved = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (saved) {
      if (Object.hasOwn(C.rules.DIFFICULTIES, saved.difficulty)) state.setup.difficulty = saved.difficulty;
      if (Object.hasOwn(C.teamById, saved.selectedTeam)) state.setup.selectedTeam = saved.selectedTeam;
      state.setup.local = saved.local === true;
      const stored = saved.save ?? saved.game; // `game` is the v0.6.0 layout
      const loaded = stored ? C.loadSave(stored) : {};
      if (loaded.game) adopt(loaded.game, Array.isArray(saved.stars) ? saved.stars : []);
      else if (loaded.error === 'sim') {
        // Keep the old save instead of overwriting it with the next autosave.
        localStorage.setItem(`${STORE}-sim-${loaded.sim}`, JSON.stringify(saved));
        state.notice = `이전 규칙(v${loaded.sim})으로 진행하던 게임은 이 버전에서 이어 할 수 없어 따로 보관했습니다. 새 게임을 시작해 주세요.`;
      }
    }
    localStorage.setItem(STORE + '-check', '1');
    localStorage.removeItem(STORE + '-check');
  } catch (e) {
    state.storageOK = false;
  }
  function save() {
    const { selectedTeam, local, difficulty } = state.setup;
    try {
      const save = state.game ? C.toSave(state.game) : null;
      localStorage.setItem(STORE, JSON.stringify({ selectedTeam, local, difficulty, save, stars: [...state.stars] }));
    } catch (e) {
      state.storageOK = false;
    }
  }

  // ---------- rendering ----------
  const g = () => state.game;
  const team = () => (g() ? C.teamFor(g()) : { ...C.teamById[state.setup.selectedTeam], ...C.scouting.plans(state.setup.seed, C.TEAMS)[state.setup.selectedTeam] });
  const step = () => (g() ? PHASE_STEP[g().phase] : 1);

  function ensureSelection() {
    if (!g() || g().phase !== 'draft') return;
    const list = UI.filterPlayers(g(), state.view, state.stars, team());
    if (!C.available(g()).some((p) => p.id === state.selected)) state.selected = list[0]?.id || C.available(g())[0]?.id || null;
  }

  function screen() {
    const game = g();
    if (!game) return UI.setup(state.setup, team());
    if (state.recordsOpen) return UI.room(game, state.records);
    switch (game.phase) {
      case 'preview': return UI.forecasts(game);
      case 'scouting': return UI.briefing(game);
      case 'draft': return UI.board(game, state.view, state.stars, state.selected);
      case 'interviews': return UI.interviews(game);
      case 'season': return UI.season(game, state.yearIndex);
      default: return UI.review(game);
    }
  }

  function render() {
    ensureSelection();
    document.documentElement.style.setProperty('--club', team().color);
    const now = step();
    $('#steps').innerHTML = STEPS.map(
      (name, i) => `<li class="${now === i + 1 ? 'now' : now > i + 1 ? 'done' : ''}" ${now === i + 1 ? 'aria-current="step"' : ''}><b>${i + 1}</b>${name}</li>`,
    ).join('');
    $('#reset-game').hidden = !g();
    if (g()) state.notice = null;
    $('#main').innerHTML = (state.notice ? `<p class="callout">${UI.esc(state.notice)}</p>` : '') + (g() ? UI.gameBar(g()) : '') + screen();
    $('#storage-status').textContent = state.storageOK ? '진행 상황은 이 브라우저에 자동 저장됩니다.' : '이 환경에서는 자동 저장을 쓸 수 없습니다. 진행 파일 저장을 이용하세요.';
    save();
  }

  /** Re-renders only the candidate list and profile (keeps focus and scroll while filtering). */
  function refreshBoard() {
    const roster = $('#roster');
    if (!roster) return render();
    ensureSelection();
    const t = team(),
      list = UI.filterPlayers(g(), state.view, state.stars, t),
      y = roster.scrollTop;
    roster.innerHTML = UI.rows(g(), list, state.view, state.stars, t, state.selected);
    roster.scrollTop = y;
    $('#candidate-count').textContent = list.length + '명';
    $('#profile').innerHTML = UI.profile(g(), state.selected && C.getPlayer(g(), state.selected), state.stars, t);
    for (const b of document.querySelectorAll('[data-action=role],[data-action=pick-type]'))
      b.setAttribute('aria-pressed', String(b.dataset.id === state.view[b.dataset.action === 'role' ? 'role' : 'pickType']));
    document.querySelector('[data-action=only-stars]')?.setAttribute('aria-pressed', String(state.view.onlyStars));
    const dir = document.querySelector('[data-action=sort-direction]');
    if (dir) dir.textContent = state.view.sortDir === 'asc' ? '오름차순' : '내림차순';
    save();
  }

  function notify(text) {
    clearTimeout(toastTimer);
    $('#toast').textContent = text;
    $('#toast').hidden = false;
    toastTimer = setTimeout(() => ($('#toast').hidden = true), 3200);
  }
  function toTop() {
    try {
      window.scrollTo({ top: 0 });
    } catch (e) {}
  }

  // ---------- modal ----------
  function showModal(kind, data = {}) {
    lastFocus = document.activeElement;
    state.modal = { kind, ...data };
    const { title, body, wide } = UI.dialogs[kind](g(), data);
    $('#modal-root').innerHTML = `<div class="overlay" data-action="overlay-close"><section class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head"><h2 id="modal-title">${title}</h2><button class="btn quiet small" data-action="close-modal">닫기</button></div>
      <div class="modal-body">${body}</div></section></div>`;
    for (const id of ['#main', '#page-header', '#page-footer']) $(id).inert = true;
    ($('.modal-body .btn.primary') || $('.modal button'))?.focus();
  }
  function closeModal() {
    state.modal = null;
    $('#modal-root').innerHTML = '';
    for (const id of ['#main', '#page-header', '#page-footer']) $(id).inert = false;
    if (lastFocus?.isConnected) lastFocus.focus();
  }

  // ---------- files ----------
  function download(name, href) {
    const a = document.createElement('a');
    a.download = name;
    a.href = href;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }
  function exportSave() {
    if (!g()) return;
    const blob = new Blob([JSON.stringify({ ...C.toSave(g()), stars: [...state.stars] }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    download(`draft-room-${g().teamId}-${g().career?.years.at(-1)?.year || 'draft'}.json`, url);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    notify('진행 파일을 내려받았습니다.');
  }
  async function importSave(file) {
    if (!file) return;
    try {
      if (file.size > 5_000_000) throw Error('too large');
      const data = JSON.parse(await file.text());
      const loaded = C.loadSave(data);
      if (loaded.error === 'sim') return notify(`이전 규칙(v${loaded.sim})으로 만든 진행 파일이라 이 버전에서는 이어 할 수 없습니다.`);
      if (!loaded.game) throw Error('invalid');
      showModal('import', { game: loaded.game, stars: Array.isArray(data.stars) ? data.stars : [] });
    } catch (err) {
      notify('불러올 수 없는 파일입니다. 드래프트 룸 진행 파일(JSON)인지 확인해 주세요.');
    } finally {
      $('#import-file').value = '';
    }
  }

  /** First-season summary card as a PNG. */
  function downloadCard() {
    const game = g(),
      t = team(),
      o = game.owner;
    const canvas = document.createElement('canvas');
    canvas.width = 1080;
    canvas.height = 380 + game.season.length * 150;
    const x = canvas.getContext('2d');
    if (!x) return notify('이 브라우저는 이미지 저장을 지원하지 않습니다.');
    const font = "'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif";
    const text = (s, left, top, size, color = '#1c1c1a', weight = 700) => {
      x.fillStyle = color;
      x.font = `${weight} ${size}px ${font}`;
      x.fillText(s, left, top, 960);
    };
    x.fillStyle = '#f4f2ec';
    x.fillRect(0, 0, canvas.width, canvas.height);
    x.fillStyle = t.color;
    x.fillRect(0, 0, canvas.width, 14);
    text(`${t.name} · ${C.ENTRY_YEAR} 신인 드래프트`, 60, 90, 44);
    text(`${C.rules.DIFFICULTIES[game.difficulty].name} · 지역 1차 ${game.local ? '있음' : '없음'} · 팬심 ${C.fanState(game).score}`, 60, 136, 24, '#6f6d66', 500);
    text(`첫해 평가 ${o.grade} (${o.score}점)`, 60, 210, 36, t.color);
    text(`보강 ${o.needScore} · 첫해 계획 ${o.production} · 미래 가치 ${o.future} · 약속 ${UI.signed(o.pledge.bonus)}`, 60, 254, 22, '#45443f', 500);
    x.fillStyle = '#1c1c1a';
    x.fillRect(60, 290, 960, 2);
    let y = 340;
    for (const s of game.season) {
      const p = C.getPlayer(game, s.playerId),
        v = s.stats;
      text(`${s.label}  ${p.name}  ${C.ROLES[p.role]} · ${s.routeLabel}`, 60, y, 28);
      const line = !v.games
        ? `1군 출전 없음 · 퓨처스 ${s.futures.games}경기`
        : v.kind === 'pitcher'
          ? `1군 ${v.games}경기 ${C.innings(v.outs)}이닝 ERA ${v.era.toFixed(2)} · ${v.wins}승`
          : `1군 ${v.games}경기 타율 ${UI.rate(v.avg)} OPS ${UI.rate(v.ops)} · ${v.hr}홈런`;
      text(`${line} · ${s.growthLabel} · 계획 이행 ${s.planScore}`, 60, y + 40, 22, '#45443f', 500);
      x.fillStyle = '#d8d4c8';
      x.fillRect(60, y + 70, 960, 1);
      y += 150;
    }
    text('드래프트 룸 · 가상 선수와 기록을 사용한 팬메이드 게임', 60, canvas.height - 40, 18, '#6f6d66', 500);
    try {
      download(`draft-room-first-year-${t.id}-${o.grade}.png`, canvas.toDataURL('image/png'));
      notify('결과 이미지를 내려받았습니다.');
    } catch (e) {
      notify('이 환경에서는 이미지를 저장할 수 없습니다.');
    }
  }

  // ---------- events ----------
  const actions = {
    'import-save': () => $('#import-file').click(),
    'export-save': exportSave,
    'confirm-import': () => {
      if (!state.modal?.game) return;
      const { game, stars } = state.modal;
      closeModal();
      adopt(game, stars);
      Object.assign(state, { recordsOpen: false, selected: null, view: defaultView() });
      render();
      toTop();
      notify('진행 파일을 불러왔습니다.');
    },
    records: () => ((state.recordsOpen = true), render(), toTop()),
    'team-records': (id) => (Object.assign(state.records, { team: id, scope: 'origin' }), actions.records()),
    'records-close': () => ((state.recordsOpen = false), render(), toTop()),
    'career-player': (id) => showModal('career', { id }),
    'view-year': (_, btn) => ((state.yearIndex = Number(btn.dataset.index)), render(), toTop()),
    'next-season': () => {
      if (Date.now() - lastAdvance < 900) return; // guards against double taps
      lastAdvance = Date.now();
      C.nextSeason(g());
      state.yearIndex = g().career.years.length - 1;
      state.recordsOpen = false;
      render();
      toTop();
    },
    team: (id) => ((state.setup.selectedTeam = id), render()),
    difficulty: (id) => {
      if (g()) return;
      state.setup.difficulty = id;
      render();
      document.querySelector(`[data-action="difficulty"][data-id="${id}"]`)?.focus();
    },
    start: () => {
      const { selectedTeam, local, seed, difficulty } = state.setup;
      Object.assign(state, { recordsOpen: false, yearIndex: 0, selected: null, view: defaultView(), stars: new Set() });
      lastAdvance = 0;
      state.game = C.createGame(selectedTeam, local, seed, difficulty);
      render();
      toTop();
    },
    'scout-briefing': () => (C.openScouting(g()), render(), toTop()),
    'begin-draft': () => (C.beginDraft(g()), C.advanceToUser(g()), render(), toTop()),
    'scout-archive': () => showModal('scout'),
    'mock-archive': () => showModal('mock'),
    'news-room': () => showModal('news'),
    'fan-history': () => showModal('fans'),
    'gm-choice': (id) => {
      C.chooseGM(g(), id);
      render();
      document.querySelector('.gm-section')?.scrollIntoView({ block: 'start' });
    },
    'sort-direction': () => ((state.view.sortDir = state.view.sortDir === 'asc' ? 'desc' : 'asc'), refreshBoard()),
    'pick-type': (id) => ((state.view.pickType = id), refreshBoard()),
    role: (id) => ((state.view.role = id), refreshBoard()),
    'only-stars': () => ((state.view.onlyStars = !state.view.onlyStars), refreshBoard()),
    'clear-filters': () => ((state.view = defaultView()), render()),
    player: (id) => {
      state.selected = id;
      refreshBoard();
      if (window.innerWidth <= 960) $('#profile')?.scrollIntoView({ block: 'start' });
    },
    star: (id) => (state.stars.has(id) ? state.stars.delete(id) : state.stars.add(id), refreshBoard()),
    pick: (id) => g()?.phase === 'draft' && showModal('confirm', { id }),
    'confirm-pick': (id) => {
      if (state.modal?.kind !== 'confirm' || g()?.phase !== 'draft') return;
      closeModal();
      const selection = C.addPick(g(), id),
        name = C.getPlayer(g(), id).name;
      C.advanceToUser(g());
      state.selected = null;
      state.view = { ...defaultView(), sort: state.view.sort, sortDir: state.view.sortDir };
      render();
      toTop();
      if (selection.round <= 1) showModal('interview', { selection });
      else notify(`${name} 지명 완료`);
    },
    simulate: () => {
      C.runSeason(g());
      state.yearIndex = g().career.years.length - 1;
      state.recordsOpen = false;
      render();
      toTop();
    },
    owner: () => ((g().phase = 'owner'), (state.recordsOpen = false), render(), toTop()),
    season: () => ((g().phase = 'season'), (state.recordsOpen = false), render(), toTop()),
    interviews: () => ((g().phase = 'interviews'), render(), toTop()),
    rules: () => showModal('rules'),
    catalog: () => showModal('catalog'),
    reset: () => showModal('reset'),
    'confirm-reset': () => {
      closeModal();
      Object.assign(state, { game: null, recordsOpen: false, yearIndex: 0, selected: null, view: defaultView(), stars: new Set() });
      state.setup.seed = newSeed();
      render();
      toTop();
    },
    'close-modal': closeModal,
    'overlay-close': (_, btn, e) => e.target === btn && closeModal(),
    download: downloadCard,
  };

  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action]');
    if (!btn || btn.disabled) return;
    const fn = actions[btn.dataset.action];
    if (!fn) return;
    try {
      fn(btn.dataset.id, btn, e);
    } catch (err) {
      console.error(err);
      notify('처리 중 문제가 생겼습니다. 다시 시도해 주세요.');
    }
  });
  document.addEventListener('input', (e) => {
    if (e.target.id === 'search') {
      state.view.query = e.target.value;
      refreshBoard();
    }
  });
  document.addEventListener('change', (e) => {
    const id = e.target.id;
    if (id === 'import-file') return importSave(e.target.files[0]);
    if (id.startsWith('record-')) {
      state.records[id.slice(7)] = e.target.value;
      return render();
    }
    if (id === 'local-toggle') {
      state.setup.local = e.target.checked;
      render();
      return $('#local-toggle')?.focus();
    }
    if (id === 'sort') {
      state.view.sort = e.target.value;
      state.view.sortDir = C.rules.SORTS[state.view.sort].direction;
    }
    if (id === 'pathway') state.view.pathway = e.target.value;
    if (id === 'tier') state.view.tier = e.target.value;
    if (['sort', 'pathway', 'tier'].includes(id)) refreshBoard();
  });
  document.addEventListener('keydown', (e) => {
    if (!state.modal) return;
    if (e.key === 'Escape') {
      e.preventDefault();
      closeModal();
    }
    if (e.key === 'Tab') {
      const els = [...document.querySelectorAll('.modal button,.modal input,.modal select,.modal summary,.modal [tabindex="0"]')].filter((x) => !x.disabled);
      const first = els[0],
        last = els.at(-1);
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    }
  });

  render();
})();
</script>
</body>
</html>
