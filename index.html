 if(!slot)return [];const used=new Set(g.picks.map(s=>s.playerId));let list=poolFor(g).players.filter(p=>!used.has(p.id));
 if(slot.round===0)return list.filter(p=>Bio.eligible(p,teamFor(g,slot.teamId)));

function room(g,f){const years=g.career?.years||[],list=rows(g,f.year,f.team,f.scope,f.sort,f.level);return `<section class="records-head"><span class="eyebrow muted">LEAGUE ARCHIVE / ALL TEN CLUBS</span><h1>선택의 결과를, 함께 봅니다.</h1><p>우리 팀과 CPU가 지명한 모든 선수의 기록입니다. 선수 이름을 누르면 전체 경력을 확인합니다.</p><button class="ghost" data-action="records-close">← 진행 화면으로</button></section><section class="panel records-panel"><div class="record-filters"><label>구단<select id="record-team"><option value="ALL">전체 구단</option>${C.TEAMS.map(t=>`<option value="${t.id}" ${f.team===t.id?'selected':''}>${t.short}</option>`).join('')}</select></label><label>구단 기준<select id="record-scope"><option value="origin" ${f.scope==='origin'?'selected':''}>원지명 구단</option><option value="current" ${f.scope==='current'?'selected':''}>현재 소속 구단</option></select></label><label>연도<select id="record-year"><option value="all">누적 기록</option>${years.map(y=>`<option value="${y.year}" ${String(f.year)===String(y.year)?'selected':''}>${y.year} · ${y.year-C.ENTRY_YEAR+1}년 차</option>`).join('')}</select></label><label>리그<select id="record-level"><option value="stats" ${f.level==='stats'?'selected':''}>1군</option><option value="futures" ${f.level==='futures'?'selected':''}>퓨처스</option></select></label><label>정렬<select id="record-sort">${Object.entries({rank:'지명 순서',contribution:'1군 기여 지수',games:'경기 수',hr:'홈런',wins:'승수',ops:'OPS',era:'ERA 낮은 순',outs:'이닝',awards:'수상 수'}).map(([k,l])=>`<option value="${k}" ${f.sort===k?'selected':''}>${l}</option>`).join('')}</select></label></div><p class="context-note">${list.length}명 · 타율·OPS·ERA는 누적 원시 기록으로 재계산합니다. 기록 정렬은 선택한 리그 기준이며 기여 지수는 1군 전용입니다. 기여 지수는 게임용 값이며 WAR가 아닙니다.${!years.length?' 아직 시즌을 진행하지 않아 프로 기록은 없습니다.':''}</p>${table(list,f.level)}</section>`;}
function events(g,items){return items.length?`<div class="event-list">${items.map(ev=>`<article class="event-item">${tag(ev.type==='trade'?'트레이드':'방출',ev.type==='trade'?'green':'orange')}<strong>${ev.type==='trade'?team(ev.fromTeamId)+' ↔ '+team(ev.toTeamId):team(ev.fromTeamId)+' · 방출'}</strong><p>${ev.playerIds.map(id=>button(id,player(g,id).name)).join(' ↔ ')}</p><p>${e(ev.reason)}</p><small>${ev.year}시즌 종료 후 · 다음 시즌에 반영</small></article>`).join('')}</div>`:'<p class="context-note">이 비시즌에는 선수 이동이 없습니다. 첫해는 육성을 보호하며, 마지막 해에는 추가 비시즌을 진행하지 않습니다.</p>';}
function season(g,index){const years=g.career.years,y=years[Math.min(index,years.length-1)]||years.at(-1),yearNo=y.year-C.ENTRY_YEAR+1,own=y.records.filter(r=>r.teamId===g.teamId),last=years.at(-1),mine=rows(g,String(y.year),g.teamId,'origin','rank');return `<section class="hero fade-in career-hero"><div class="hero-copy"><span class="eyebrow">THE LONG GAME / YEAR ${yearNo} OF 5</span><h1>${yearNo===1?'첫 번째 시즌,<br>가능성의 시작.':yearNo===5?'다섯 번의 봄,<br>선택은 경력이 됩니다.':'성장은 계속되고,<br>이야기는 달라집니다.'}</h1><p>${y.year} 시즌 · ${team(g.teamId)}<br>기록은 확정되어 있습니다. 과거 연도를 봐도 결과는 바뀌지 않습니다.</p></div><div class="hero-numbers"><div class="hero-number"><b>${yearNo}<span>/5</span></b><span>프로 시즌</span></div><div class="hero-number"><b>${own.filter(r=>r.stats.games>0).length}</b><span>우리 팀 소속 동기 1군 경험</span></div></div></section><nav class="year-tabs" aria-label="시즌 선택">${years.map((s,i)=>`<button data-action="view-year" data-index="${i}" class="${s.year===y.year?'active':''}" aria-pressed="${s.year===y.year}">${s.year}<small>${i+1}년 차</small></button>`).join('')}</nav><div class="season-summary"><div><b>${own.length}</b><span>당시 우리 팀 소속 동기</span></div><div><b>${own.filter(r=>r.route==='regular').length}</b><span>1군 안착</span></div><div><b>${y.league.table.find(t=>t.teamId===g.teamId).rank}위</b><span>정규시즌</span></div><div><b>${team(y.league.champion)}</b><span>한국시리즈 우승</span></div></div><section class="panel records-panel"><div class="section-head"><h2>우리 팀이 지명한 선수</h2><button class="ghost" data-action="records">CPU·전체 기록 →</button></div><p class="context-note">원지명 기준이며 다른 팀으로 이적한 선수도 추적합니다. 이름을 누르면 퓨처스 기록·공개 기량 추이·수상·이력을 확인합니다.</p>${table(mine)}</section>${root.DraftView06.development(g,y)}<section class="panel records-panel"><h2>시즌의 얼굴</h2><p class="context-note">개인상은 이번 드래프트 출신끼리 비교합니다. 리그 전체 MVP·골든글러브가 아닙니다. 우승 멤버는 해당 시즌 우승팀 소속으로 1군에 출전한 선수입니다.</p><div class="honor-grid">${y.awards.filter(a=>a.scope==='draft-class').map(a=>`<article>${tag(a.title,'orange')}<h3>${button(a.playerId,player(g,a.playerId).name)}</h3><p>${team(a.teamId)} · ${y.year}</p></article>`).join('')||'<p>최소 출전 기준을 충족한 수상 후보가 없습니다.</p>'}</div><details><summary>팀 우승 멤버 ${y.awards.filter(a=>a.scope==='team').length}명</summary><p>${y.awards.filter(a=>a.scope==='team').map(a=>button(a.playerId,player(g,a.playerId).name)).join(' · ')||'해당 드래프트 출신 1군 우승 멤버가 없습니다.'}</p></details></section><section class="panel records-panel"><h2>리그와 포스트시즌</h2><p class="context-note">기존 팀 전력 + 이번 지명 선수의 기여 + 변동성의 간소화 모델입니다. 선수단 전체 기록을 재현하지 않습니다. 팀당 144경기·무승부 없음, 와일드카드 4위 1승 우위 등 게임용 규칙입니다.</p><div class="standings-grid">${y.league.table.map(t=>`<div class="${t.teamId===g.teamId?'our-team':''}"><b>${t.rank}</b><strong>${team(t.teamId)}</strong><span>${t.wins}승 ${t.losses}패</span>${t.teamId===y.league.champion?tag('우승','green'):''}</div>`).join('')}</div><details><summary>포스트시즌 결과</summary>${y.league.series.map(s=>`<p>${s.label} · ${team(s.home)} ${s.homeWins} : ${s.awayWins} ${team(s.away)} → ${team(s.winner)}</p>`).join('')}</details></section><section class="panel records-panel"><h2>${y.year} 비시즌 소식</h2>${events(g,y.events)}</section><div class="section-action">${years.length<5?`<button class="primary" data-action="next-season">${last.year+1} 시즌 진행 · ${years.length+1}/5 →</button><p>아직 진행하지 않은 다음 시즌을 한 번 확정합니다. 자동 저장됩니다.</p>`:'<button class="primary" data-action="owner">5년 드래프트 최종 평가 →</button>'}<button class="ghost" data-action="owner">${years.length===5?'평가 다시 보기':'현재까지의 평가'}</button><button class="ghost" data-action="interviews">입단 인터뷰 다시 보기</button></div>`;}
function profile(g,id){const p=player(g,id),sel=g.picks.find(s=>s.playerId===id);if(!p||!sel)return '<p>지명 선수를 찾을 수 없습니다.</p>';const hist=g.career?C.Career.history(g.career,id):[],state=g.career?.players[id],honors=(g.career?.years||[]).flatMap(y=>y.awards).filter(a=>a.playerId===id),evs=(g.career?.events||[]).filter(a=>a.playerIds.includes(id));
 return `<div class="career-profile"><span class="eyebrow muted">PLAYER ARCHIVE / ${e(sel.label)}</span><h2>${e(p.name)}</h2><p>${tag(C.ROLES[p.role])} ${tag(p.pathway)} ${tag(p.quotaEligible?'대졸 의무 대상':p.pathway==='대학 얼리'?'얼리 · 의무 제외':'일반 지원')}</p><p>${e(p.school)} · ${p.height}cm / ${p.weight}kg · ${p.throwHand}투${p.batHand}타</p><p><span class="bio-fact">${e(p.birthday)} 출생</span> <span class="bio-fact">지명 당시 만 ${p.age}세</span>${hist.length?' <span class="bio-fact">'+hist.at(-1).year+'년 말 만 '+hist.at(-1).age+'세</span>':''}</p><p><strong>${team(sel.teamId)} ${sel.label} 지명 → 현재 ${team(state?state.currentTeamId:sel.teamId)}</strong></p><p>${e(p.pathText)}</p><p>${e(p.qualification)} · ${e(p.regionalReason)}</p><p>강점: ${e(p.strength)}<br>육성 과제: ${e(p.weakness)}</p>${V.scoutTools(p)}${state?root.DraftView06.toolSnapshot(p,state.publicTools,'현재 공개 세부 기량'):''}${state?.status==='active'&&hist.length===5&&hist.at(-1).age<=24&&state.scoutReady<p.scoutCeiling?'<p class="notice">아직 육성 중 · 5년 종료 시점의 판단 유보 대상입니다. 젊은 선수의 최종 경력을 실패로 확정하지 않습니다.</p>':''}<p class="context-note">위 평가는 지명 당시 고정 자료입니다. 현재 공개 기량 추정: ${state?.scoutReady??p.ready} (20–80). 실제 기량·성장 한계를 확정하는 수치는 아닙니다.</p><details><summary>지명 전 마지막 소속 시즌 기록</summary><p>${p.record.kind==='pitcher'?`${p.record.games}경기 · ${C.innings(p.record.outs)}이닝 · ERA ${num(p.record.era,2)} · ${p.record.k}탈삼진`:`${p.record.games}경기 · ${p.record.pa}타석 · AVG ${num(p.record.avg,3)} · OPS ${num(p.record.ops,3)} · ${p.record.hr}홈런`}</p></details>${hist.length?`<h3>연도별 1군·퓨처스 경력</h3>${hist.map(r=>`<article class="year-report"><header><strong>${r.year} · ${team(r.teamId)}</strong>${tag(r.routeLabel,r.route==='regular'?'green':'')}</header><p>1군 · ${statLine(r.stats)}</p><p>퓨처스 · ${statLine(r.futures)}</p><p>${e(r.note)}</p><p>${tag(r.growthLabel)} 현재 기량 ${r.startGrade??r.scoutReady} → ${r.scoutReady} · 계획 이행 ${r.planScore}</p><small>${e(r.developmentNote)}</small>${r.publicTools?root.DraftView06.toolSnapshot(p,r.publicTools,'시즌 종료 세부 기량'):''}</article>`).join('')}<h3>누적 성적</h3><p>1군 · ${statLine(C.Career.totalStats(hist))}</p><p>퓨처스 · ${statLine(C.Career.totalStats(hist,'futures'))}</p>`:'<p class="notice">아직 프로 시즌을 진행하지 않았습니다.</p>'}<h3>수상 이력</h3>${honors.length?honors.map(a=>`<p>${a.year} · ${e(a.title)} · ${team(a.teamId)}</p>`).join(''):'<p>아직 수상 경력이 없습니다.</p>'}<h3>이적·방출 이력</h3>${events(g,evs)}</div>`;
}
function statLine(s){if(!s||!s.games)return '출전 기록 없음';return s.kind==='pitcher'?`${s.games}경기 · ${s.gs}선발 · ${C.innings(s.outs)}이닝 · ERA ${num(s.era,2)} · ${s.k}K · ${s.bb}BB · ${s.wins}승 · ${s.holds}홀드 · ${s.saves}세이브`:`${s.games}경기 · ${s.pa}타석 · AVG ${num(s.avg,3)} · OPS ${num(s.ops,3)} · ${s.hr}홈런 · ${s.rbi}타점 · ${s.sb}도루`;}
function review(g){const all=C.careerReview(g),mine=all.find(t=>t.teamId===g.teamId),n=g.career.years.length,first=g.owner;return `<section class="records-head"><span class="eyebrow muted">OWNER’S OFFICE / ${n===5?'FINAL':'INTERIM'} REVIEW</span><h1>${n===5?'다섯 시즌 뒤, 우리의 선택.':n+'시즌의 발자취, 아직 남은 가능성.'}</h1><p>원지명 선수의 전체 경력과 우리 팀에서의 기여를 구분합니다. 결과는 실제 KBO 평가가 아닌 게임용 지수입니다.</p></section><section class="owner-layout"><div class="grade-panel"><span class="eyebrow">${n}년 드래프트 평가</span><div class="grade-letter">${mine.grade}</div><div class="score">${mine.score}<span>/100</span></div></div><div class="panel pad"><h2>${team(g.teamId)}의 선택</h2><p>1군 경험 ${mine.debut}/${mine.count}명 · 1군 안착 경험 ${mine.established}명</p><p>지명 선수의 전 구단 기여 합계 <strong>${mine.total}</strong></p><p>그중 우리 팀에서 낸 기여 <strong>${mine.atHome}</strong></p><p>현재 방출 ${mine.released}명 · 동기 개인상 ${mine.awards}회</p><p>아직 젊고 전망에 도전 중인 선수 ${mine.pending}명 · 경력 판단 유보</p><p>지명 당시 대비 공개 기량 추정 변화 평균 ${mine.development>0?'+':''}${mine.development}</p><p class="context-note">보강 포지션·유형 20% + 인원·시즌 수로 정규화한 기여 50% + 공개 기량 발전 30%. 기여 지수는 WAR가 아닙니다. 영입 선수는 원지명 성과에 넣지 않습니다.</p></div></section><section class="panel records-panel"><h2>10개 구단 드래프트 비교</h2><div class="table-scroll" tabindex="0"><table class="record-table"><thead><tr><th>순위</th><th>구단</th><th>평가</th><th>1군 경험</th><th>안착 경험</th><th>전 구단 기여</th><th>원구단 기여</th><th>개인상</th></tr></thead><tbody>${all.map((x,i)=>`<tr class="${x.teamId===g.teamId?'our-team':''}"><td>${i+1}</td><td><button class="player-link" data-action="team-records" data-id="${x.teamId}">${team(x.teamId)}</button></td><td>${x.grade} · ${x.score}</td><td>${x.debut}/${x.count}</td><td>${x.established}</td><td>${x.total}</td><td>${x.atHome}</td><td>${x.awards}</td></tr>`).join('')}</tbody></table></div></section><section class="panel records-panel"><h2>첫해 약속, 첫해에 한 번만</h2><p>첫해 구단주 평가 ${first.grade} · ${first.score}점 / ${first.pledge.status} · ${e(first.pledge.detail)}</p><p class="context-note">입단 인터뷰 약속은 첫 시즌 결과로 고정됩니다. 이후 시즌에 약속 보너스나 팬심을 반복 가산하지 않습니다. 첫해 보강·계획·미래 가치 평가와 위 다년 평가는 별개입니다.</p>${V.pledge(g)}</section><div class="section-action">${n<5?`<button class="primary" data-action="next-season">${C.ENTRY_YEAR+n} 시즌 진행 →</button>`:''}<button class="ghost" data-action="season">연도별 기록</button><button class="ghost" data-action="records">전체 구단 기록실</button><button class="ghost" data-action="export-save">5년 경력·진행 파일 저장</button><button class="ghost" data-action="download">첫해 결과 이미지 저장</button></div>`;}
function guide(){return `<p><strong>V0.5 · FIVE YEARS LATER</strong> — 한 번의 드래프트를 5년 동안 추적합니다.</p><ol class="modal-rule"><li>구단·난이도·지역 1차 설정 후 언론 예상과 후보를 살펴봅니다.</li><li>전국 7라운드. 지역 OFF는 7명, ON은 지역 1명 + 전국 7명입니다.</li><li>국내 대학 졸업예정자 최소 1명이 의무입니다. 대학 얼리 2학년은 제외됩니다. 미충족 시 마지막 지명권에는 의무 대상만 표시됩니다.</li><li>후보 200명: 고졸 144 / 국내 대졸 30 / 대학 얼리 16 / 독립 6 / 해외 대학 4. 지역별 고졸 18명을 보장합니다.</li><li>상위 지명자는 첫해 시험 콜업 기회를 더 받지만 성적과 안착은 보장되지 않습니다. 선수 모델은 모든 난이도와 구단에 동일합니다.</li><li>2027~2031년 총 5시즌. 기록·성장·건강 상태가 다음 해에 이어집니다. 매년 새 드래프트를 하지는 않습니다.</li><li>전체 구단 기록실에서 원지명/현재 소속, 연도, 1군/퓨처스, 누적 기록을 조회합니다.</li><li>개인상은 이번 드래프트 동기 내 수상입니다. 팀 성적은 배경 전력 기반 간소화 모델입니다.</li><li>2년 차 종료 이후부터 제한적 자동 방출·1대1 트레이드가 가능합니다. 방출 후 기록은 보존되며 재계약은 없습니다. 마지막 해 이후 비시즌은 진행하지 않습니다.</li><li>입단 단장 약속과 팬심은 첫해 결과로 고정합니다. 5년 평가에서는 지명 성과와 원구단 기여를 분리합니다.</li><li>자동 저장 외에 진행 파일을 내보내고 불러올 수 있습니다. V0.4 저장과는 호환되지 않으며 기존 저장을 지우지 않습니다.</li></ol><p class="notice">선수·학교·기록·전력·수상·기사·댓글은 가상입니다. 지역 1차, 의무지명 대상 범위, 육성 보호 기간, 포스트시즌은 게임용 단순화 규칙이며 특정 연도의 KBO 공식 규정 전체를 재현하지 않습니다. 계약 협상·지명 거부·이도류·20–80 체계는 아직 포함하지 않습니다.</p>`;}
root.DraftView05={toolbar,quota,room,season,profile,review,guide,rows,table};
})(typeof window!=='undefined'?window:globalThis);

<script>/* V0.6 public scouting and development UI. No hidden tool values are rendered. */
(function(root){'use strict';const C=root.DraftCore,W=root.DraftView05;
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function clubPanel(t){return `<section class="scouting-club"><h3>스카우트 팀장 · ${e(t.staff.label)}</h3><p>보조 성향: ${e(t.staff.preference)} 선호 · 추천에만 반영</p><ul>${t.detailedNeeds.map(n=>`<li><b>${e(n.label)}</b><span>${e(n.reason)}</span><small>관찰 목표 ${e(C.grades.LABELS[n.key]||{ready:'현재 기량',scoutCeiling:'미래 가치',floorGrade:'플로어'}[n.key])} ${n.target}</small></li>`).join('')}</ul><p class="context-note">세부 수요는 매 게임 달라집니다. 지명 제한이 아닌 우선 관찰 목표이며, 보강 평가에도 반영합니다.</p></section>`;}
function briefing(g,archive=false){const t=C.teamFor(g),report=g.scoutReport;return `<section class="records-head"><span class="eyebrow muted">SCOUTING DIRECTOR / BEFORE THE PICK</span><h1>세 가지 선택,<br>우리 팀의 관점.</h1><p>${e(t.short)} · ${report.scope} 추천 · ${e(report.staff.label)} / ${e(report.staff.preference)} 선호</p><p class="notice">추천은 지명 전 공개 관측값만 사용하며 이 시점에 고정됩니다. CPU가 먼저 지명할 수 있습니다. 팀장의 성향은 선수의 실제 성장률을 바꾸지 않습니다.</p></section>${clubPanel(t)}<div class="scout-recommendations">${report.candidates.map((c,i)=>{const p=C.getPlayer(g,c.playerId),gone=g.picks.some(s=>s.playerId===p.id);return `<article class="panel recommendation"><span class="eyebrow muted">${i===0?'PRIMARY PICK':'ALTERNATIVE 0'+i} · ${c.angle}</span><h2>${e(p.name)} <small>${e(C.ROLES[p.role])}</small></h2><p>${e(p.school)} · ${e(p.pathway)} · 공개 ${p.rank}위 ${gone?'· 지명 완료':''}</p><div class="recommend-grades"><span>현재 <b>${p.ready}</b></span><span>미래 가치 <b>${p.scoutCeiling}</b></span><span>실링 <b>${p.ceilingGrade}</b></span></div><p class="tag green">${p.pickTags.join(' + ')}</p><ul>${c.lines.slice(0,g.difficulty==='hard'?2:3).map(l=>`<li>${e(l)}</li>`).join('')}</ul><p class="recommend-risk"><b>우려</b> ${e(p.weakness)}</p></article>`;}).join('')}</div>${archive?'':`<div class="section-action"><button class="primary" data-action="begin-draft">추천을 참고해 드래프트 시작 →</button><p>다른 선수를 선택해도 추천 불복종 감점은 없습니다.</p></div>`}`;}
function toolSnapshot(p,tools,title){return `<section class="tool-snapshot"><h4>${e(title)} · 20–80</h4><div>${C.grades.keys(p.role).map(k=>`<span>${C.grades.LABELS[k]}<b>${tools?.[k]??'—'}</b></span>`).join('')}</div></section>`;}
function development(g,year){const original=new Set(g.picks.filter(s=>s.teamId===g.teamId).map(s=>s.playerId)),records=year.records.filter(r=>original.has(r.playerId));return `<section class="panel records-panel"><div class="section-head"><h2>보직과 성장 리포트</h2><span class="tag">시작 → 종료 평가</span></div><p class="context-note">콜업은 시즌 시작 상태로 판단합니다. 종료 평가는 그해 성장 이후의 관측치입니다. 출전하지 않아도 발전할 수 있으며, 표시 등급이 같아도 작은 변화는 누적됩니다.</p><div class="development-grid">${records.map(r=>{const p=C.getPlayer(g,r.playerId);return `<article><button class="player-link" data-action="career-player" data-id="${p.id}">${e(p.name)}</button><span class="tag ${r.route==='regular'?'green':''}">${e(r.routeLabel)}</span><p class="grade-transition">${r.startGrade??r.scoutReady} <span>→</span> ${r.scoutReady}<small>지명 당시 미래 가치 ${p.scoutCeiling}</small></p><p>${e(r.note)}</p><small>${e(r.growthLabel)} · 계획 이행 ${r.planScore}점</small></article>`;}).join('')}</div></section>`;}
W.guide=()=>`<p><strong>V0.6 · READ THE PLAYER</strong> — 관찰한 장점이 성장과 기록으로 이어지는 드래프트.</p><ol class="modal-rule"><li>구단·난이도·지역 1차 설정 → 언론 예상 → 스카우트 팀장 추천 → 지명 순서입니다.</li><li>전국 7라운드. 지역 OFF는 70명, ON은 지역 1명씩 추가해 80명을 지명합니다. 국내 대학 졸업예정자를 구단마다 최소 1명 지명해야 하며 대학 얼리는 제외됩니다.</li><li>후보 200명: 고졸 136, 국내 대졸 30, 얼리 16, 국내 독립 6, 해외 대학 4, 마이너·MLB 경험 복귀 6, 해외 독립 복귀 2. 드물게 마이너 복귀 한 자리를 짧은 MLB 경력 선수로 대체합니다.</li><li>공개 능력치는 20–80, 5단위입니다. 개별 툴의 50은 게임 내 1군 평균 수준이며 80은 예외적인 재능입니다. 종합 기량은 포지션별 툴 가중 평가이며 신인 평균 50을 뜻하지 않습니다.</li><li>현재 기량은 지금의 관측값, 미래 가치(FV)는 육성 후 예상 역할입니다. 플로어/실링은 낮은 쪽/잘 풀렸을 때의 전망이며 확정 하한·상한이 아닙니다. 즉전감·플로어·실링 태그는 중복 가능합니다.</li><li>툴은 서로 다르게 성장합니다. 투수의 구위·커맨드·변화구는 투구 성적, 체력은 소화 이닝에 연결됩니다. 야수의 컨택·장타력·주력·수비는 타격과 역할에 반영되며 선구안은 보조 항목입니다.</li><li>2027–2031년 5시즌. 전년도 보직은 다음 해 유지 판단에 반영하고 출전량은 연차에 따라 확대합니다. 건강 문제·부진·보직 경쟁에 따라 역할이 줄 수 있으며 이유를 표시합니다.</li><li>선발 승수는 5이닝 이상 투구, 실점, 득점 지원, 불펜을 반영합니다. 좋은 선발의 두 자릿수 승수와 거포의 20홈런 이상이 가능합니다. 보장 성적이 아닙니다.</li><li>전체 구단 기록실에서 CPU 선수, 연도별 1군·퓨처스·누적 기록을 확인합니다. 개인상은 동기 내 수상이며 팀 전력과 포스트시즌은 간소화 모델입니다.</li><li>자동 1대1 트레이드는 2~4년 차 종료 후 가능합니다. 방출은 3~4년 차 종료 후 만 23세 이상, 2년 연속 1군 기록 없음, 공개 기량 40 미만일 때 검토합니다. 방출 후 재계약은 없습니다.</li><li>이지에서만 선수의 선호 구단을 공개합니다. 노말·하드에서 비공개이며 V0.6에서는 계약이나 성장에 영향을 주지 않습니다. 계약 협상·지명 거부는 포함하지 않습니다.</li><li>진행 JSON 저장·복원이 가능합니다. V0.5와 모델이 달라 호환되지 않으며 기존 V0.5 파일과 저장을 덮어쓰지 않습니다.</li></ol><p class="notice">해외 복귀는 국내 프로 미입단자의 첫 국내 도전이라는 가상 지원 규칙입니다. 실제 연도별 복귀 유예·계약·드래프트 자격을 재현하지 않습니다. 해외 기록은 리그 수준과 표본이 달라 국내 기록과 직접 비교할 수 없습니다. 구단명 외 선수·소속·기록·전력·기사 등은 가상 데이터입니다.</p>`;
root.DraftView06={clubPanel,briefing,toolSnapshot,development};
})(typeof window!=='undefined'?window:globalThis);
</script>
<script>/* UI for the self-contained DRAFT ROOM prototype. */
(function(){
  'use strict';
  const C=window.DraftCore,V=window.DraftView04,W=window.DraftView05,X=window.DraftView06, $=s=>document.querySelector(s), STORE='draft-room-kbo-v6-scouting';
  const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let difficulty='normal',sortDir='asc',setupSeed=Date.now()+'-'+Math.random(),pickTypeFilter='ALL';
  let selectedTeam='kiwoom',local=false,game=null,selectedPlayer=null,roleFilter='ALL',pathwayFilter='ALL',tierFilter='ALL',query='',sort='rank',onlyStars=false,stars=new Set(),modal=null,lastFocus=null,toastTimer;
  let storageAvailable=true,recordsOpen=false,yearIndex=0,lastAdvance=0;
  const recordFilters={team:'ALL',scope:'origin',year:'all',level:'stats',sort:'rank'};
  try {
    const saved=JSON.parse(localStorage.getItem(STORE)||'null');
    if(saved){if(Object.hasOwn(C.rules.DIFFICULTIES,saved.difficulty))difficulty=saved.difficulty;if(Object.hasOwn(C.teamById,saved.selectedTeam))selectedTeam=saved.selectedTeam;local=saved.local===true;stars=new Set((Array.isArray(saved.stars)?saved.stars:[]).filter(id=>typeof id==='string'&&Object.hasOwn(C.playerById,id)));if(C.validate(saved.game)){game=saved.game;local=game.local;difficulty=game.difficulty;selectedTeam=game.teamId;if(game.phase==='draft')C.advanceToUser(game);yearIndex=(game.career?.years.length||1)-1;}}
    localStorage.setItem(STORE+'-check','1');localStorage.removeItem(STORE+'-check');
  }catch(e){storageAvailable=false;}
  function save(){try{localStorage.setItem(STORE,JSON.stringify({selectedTeam,local,difficulty,game,stars:[...stars]}));}catch(e){storageAvailable=false;}}
  function badge(t,size=''){return `<span class="team-mark" style="background:${t.color};${size}">${t.mark}</span>`;}
  function tag(text,cls=''){return `<span class="tag ${cls}">${escape(text)}</span>`;}
  function metric(value,label){return `<div class="metric"><b>${escape(value)}</b><span>${escape(label)}</span></div>`;}
  function avg(n){return n==null?'—':n.toFixed(3).replace(/^0/,'');}
  function labelRound(slot){return slot?.round===0?'지역 1차 지명':`${slot?.round||1}라운드 지명`;}
  function team(){return game?C.teamFor(game):{...C.teamById[selectedTeam],...C.scouting.plans(setupSeed,C.TEAMS)[selectedTeam]};}
  function stage(){return game?({preview:2,scouting:2,draft:3,interviews:4,season:5,owner:6}[game.phase]):1;}
  function setCandidate(){
    if(!game||game.phase!=='draft')return;
    const list=C.available(game);if(!list.some(p=>p.id===selectedPlayer))selectedPlayer=list[0]?.id||null;
  }
  function notify(text){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').hidden=false;toastTimer=setTimeout(()=>{$('#toast').hidden=true;},3200);}
  function render(){
    setCandidate();
    $('#steps').innerHTML=['구단 선택','예상·추천','드래프트','인터뷰','5시즌 경력','드래프트 평가'].map((name,i)=>`<div class="step ${stage()===i+1?'active':stage()>i+1?'done':''}" ${stage()===i+1?'aria-current="step"':''}><b>${stage()>i+1?'✓':String(i+1).padStart(2,'0')}</b>${name}</div>`).join('');
    $('#reset-game').hidden=!game;
    $('#main').innerHTML=(game?V.infoBar(game)+W.toolbar(game):'')+(recordsOpen&&game?W.room(game,recordFilters):!game?renderSetup():game.phase==='preview'?V.forecasts(game):game.phase==='scouting'?X.briefing(game):game.phase==='draft'?renderDraft():game.phase==='interviews'?renderInterviews():game.phase==='season'?renderSeason():renderOwner());
    $('#storage-status').textContent=storageAvailable?'이 브라우저에 진행 상태 자동 저장':'현재 환경에서는 자동 저장이 제한됩니다';
    save();
  }
  function renderSetup(){const t=team();return `
    <section class="hero fade-in"><div class="hero-copy"><span class="eyebrow">THE NEXT FRANCHISE PLAYER</span><h1>우리 팀의 내일을<br>지명하는 시간.</h1><p>기록과 성장 배경을 살피며 기다릴 가치가 있는 선수를 선택합니다.<br>첫해의 무대가 퓨처스여도, 성장은 계속됩니다.</p></div><div class="hero-numbers"><div class="hero-number"><b>10</b><span>구단</span></div><div class="hero-number"><b>200</b><span>매 판 새로운 유망주</span></div><div class="hero-number"><b>${C.ROUNDS}<span style="display:inline;font-size:16px;color:#fff"> R</span></b><span>${local?'지역 1차 + 본 지명':'라이트 드래프트'}</span></div></div></section><p class="draft-date">가상 ${C.ENTRY_YEAR} 신인 드래프트 · 지명 및 만 나이 기준일 ${C.DRAFT_DATE} · 7라운드 / 총 5시즌 / 대졸 의무 1명</p>
    <section class="build-note" aria-label="v0.6 변경 사항"><strong>BUILD 0.6 · READ THE PLAYER</strong><span>20–80 툴 · 미래 가치</span><span>보직 유지 · 출전량 · 성장 개편</span><span>팀장 추천 · 해외 복귀 경력</span></section>
    <section class="difficulty-settings panel"><h2>드래프트 난이도</h2><div class="difficulty-options">${Object.entries(C.rules.DIFFICULTIES).map(([id,c])=>`<button data-action="difficulty" data-id="${id}" aria-pressed="${difficulty===id}" class="difficulty-option ${difficulty===id?'selected':''}"><strong>${c.name}</strong><span>${c.hint}</span></button>`).join('')}</div><p>선수 능력과 성장 확률은 동일합니다. 공개 평가의 관측 오차도 같으며, 조언의 상세함과 AI의 판단 방식이 달라집니다.</p></section>
    <div class="section-head"><h2>어느 구단의 미래를 맡으시겠습니까?</h2><p>가상 직전 시즌 순위 역순 · 지명 순서</p></div>
    <div class="team-layout"><section class="teams" aria-label="구단 선택">${C.TEAMS.map((club,i)=>`<button class="team-card ${club.id===selectedTeam?'selected':''}" data-action="team" data-id="${club.id}" aria-pressed="${club.id===selectedTeam}"><span class="pick-order">${String(i+1).padStart(2,'0')} PICK</span>${badge(club)}<span><span class="team-name">${club.name}</span><span class="team-meta">${club.rank}위 · ${club.record}</span></span></button>`).join('')}</section>
    <aside class="panel team-detail"><div class="pad"><span class="eyebrow muted">YOUR CLUB REPORT</span><div class="team-detail-header">${badge(t,'width:46px;height:46px')}<div><h2>${t.short}</h2><p class="tiny muted">${t.region} · 가상 시즌 ${t.rank}위</p></div></div><div class="info-pair"><label>전력의 강점</label><strong>${t.strong}</strong></div><div class="info-pair"><label>보강이 필요한 부분</label><strong>${t.weak}</strong></div><div class="info-pair"><label>보강 우선순위</label><div class="need-list">${t.needs.map((x,i)=>tag(`${i+1} ${C.ROLES[x]}`,i===0?'green':'')).join('')}</div></div><p class="goal">“${t.goal}”</p>${X.clubPanel(t)}<button class="primary" data-action="start">${t.short} 단장으로 시작 <span class="arrow">→</span></button><p class="tiny muted" style="text-align:center;margin-top:10px">${local?'지역 1차 포함 8명 지명':'7라운드 · 총 7명 지명'} · 드래프트 후 5시즌 추적</p></div></aside></div>
    <section class="panel settings"><div class="settings-line"><div><h3>지역 1차 지명</h3><p>본 드래프트에 앞서 연고 지역의 고교 유망주를 우선 지명합니다.</p></div><label class="toggle-wrap"><span>${local?'ON':'OFF'}</span><span class="switch"><input type="checkbox" id="local-toggle" aria-label="지역 1차 지명 사용" ${local?'checked':''}><span class="switch-track"></span></span></label></div><div class="rule-note">${local?'<strong>ON 규칙</strong> · 각 구단이 지역 고졸 후보 1명을 지명한 후, 전국 단위 7라운드를 진행합니다. 서울 3개 구단은 같은 후보군에서 현재 설정된 지명 순서대로 선택합니다.':'<strong>OFF 규칙 · 기본값</strong> · 모든 후보를 대상으로 가상 직전 시즌 순위의 역순으로 7라운드를 진행합니다. 매 라운드 순서는 같으며, 추첨이나 스네이크 방식은 없습니다.'}<br>※ 과거 제도의 연도별 연고권·서울 순번 순환·전국 지명 예외를 재현하지 않은 간소화 규칙입니다. 설정은 게임 시작 전에만 변경할 수 있습니다. 출생지가 아닌 현재 고교·고교 연령 BC 소속 지역으로 판정하며 대졸·독립·해외파는 제외합니다.</div></section>
    <p class="footnote">PROTOTYPE v0.6 · 구단명 외 선수·학교·기록·순위·전력·대회 경력은 모두 게임용 가상 데이터입니다. 실제 선수 평가나 공식 KBO 게임이 아닙니다. 실제 전체 라운드 대신 7라운드로 축소했습니다.</p>`;}
  function renderDraft(){const t=team(),slot=game.schedule[game.cursor],mine=C.myPicks(game);return `
    <section class="turn-head"><div><span class="eyebrow" style="margin:0"><i class="live-dot"></i> DRAFT LIVE <span class="muted">/ YOUR TURN</span></span><h1>${labelRound(slot)}, ${t.short}의 선택</h1><p>${t.goal} <span class="mobile-detail">선수 선택 → 아래 프로필 확인 → 지명하기</span></p></div><div class="turn-count"><b>${mine.length}<span class="muted" style="font-size:14px"> / ${C.ROUNDS+(game.local?1:0)}</span></b><p>우리 팀 지명</p><div class="progress-track"><span style="width:${game.cursor/game.schedule.length*100}%"></span></div></div></section>
    <div class="ticker" aria-label="현재 라운드 지명 현황">${C.TEAMS.map(club=>{const picked=game.picks.find(s=>s.round===slot.round&&s.teamId===club.id);return `<div class="ticker-item ${club.id===game.teamId?'current':''}"><span class="ticker-name"><i class="club-dot" style="background:${club.id===game.teamId?'var(--lime)':club.color}"></i>${club.short}${club.id===game.teamId?'<small>YOU</small>':''}</span><span class="ticker-player">${picked?C.playerById[picked.playerId].name:club.id===game.teamId?'지명 중 …':'대기'}</span></div>`;}).join('')}</div>
    ${W.quota(game)}
    ${slot.round===0?`<p class="notice">지역 1차 지명 · ${t.region} 지역의 고졸 후보만 표시됩니다. 지명이 끝나면 모든 지역의 미지명 선수가 본 드래프트 후보가 됩니다. <strong>간소화된 가상 규칙</strong>입니다.</p>`:''}
    <div class="draft-layout"><div><section class="panel"><div class="board-head"><div class="board-title"><h2>스카우팅 보드 <span class="tiny muted" id="candidate-count"></span></h2><span class="tag">${slot.round===0?'지역 후보':'전국 후보'}</span></div><div class="search-row"><label class="sr-only" for="search">선수명 또는 학교 검색</label><input id="search" placeholder="선수명 · 학교 검색" value="${escape(query)}" autocomplete="off"><label class="sr-only" for="sort">후보 정렬</label><select id="sort">${V.sortOptions(sort)}</select><button class="ghost sort-direction" data-action="sort-direction" aria-label="정렬 방향 전환">${sortDir==='asc'?'↑ 오름차순':'↓ 내림차순'}</button></div><div class="chips">${[['ALL','전체'],...Object.entries(C.ROLES)].map(([id,name])=>`<button class="chip ${roleFilter===id?'active':''}" data-action="role" data-id="${id}" aria-pressed="${roleFilter===id}">${name}</button>`).join('')}<button class="chip ${onlyStars?'active':''}" data-action="only-stars" aria-pressed="${onlyStars}">★ 관심</button></div><div class="search-row" style="margin:10px 0 0"><label class="sr-only" for="pathway">출신 구분</label><select id="pathway" style="width:100%">${['ALL','고졸','대졸','대학 얼리','독립구단','해외파','마이너 복귀','해외독립 복귀','MLB 경험 복귀'].map(v=>`<option value="${v}" ${pathwayFilter===v?'selected':''}>${v==='ALL'?'출신 구분 전체':v}</option>`).join('')}</select><label class="sr-only" for="tier">야구부 평판</label><select id="tier" style="width:100%">${['ALL','명문','강호','중견','약소','미분류'].map(v=>`<option value="${v}" ${tierFilter===v?'selected':''}>${v==='ALL'?'야구부 평판 전체':v}</option>`).join('')}</select></div></div><div class="type-filters" aria-label="픽 유형 필터">${['ALL','즉전감','플로어','실링','육성형','역할형'].map(x=>`<button class="chip ${pickTypeFilter===x?'active':''}" data-action="pick-type" data-id="${x}" aria-pressed="${pickTypeFilter===x}">${x==='ALL'?'유형 전체':x}</button>`).join('')}</div><div class="roster-columns"><span>순위</span><span>선수 / 출신</span><span>정렬값</span><span>보강 적성</span></div><div class="roster" id="roster">${renderRows()}</div><div class="board-bottom">선택한 항목의 값으로 정렬합니다. 해당하지 않는 기록(—)은 양방향 모두 마지막에 표시합니다. 이닝은 아웃 수로 비교합니다. 서로 다른 리그와 표본의 단순 비교에는 주의해야 합니다.</div></section>${renderLog()}</div><div><div id="profile">${renderProfile()}</div>${renderMyPicks()}</div></div>`;}
  function filtered(){if(!game)return [];return C.rules.sortPlayers(C.available(game).filter(p=>(pickTypeFilter==='ALL'||p.pickTags.includes(pickTypeFilter))&&(roleFilter==='ALL'||p.role===roleFilter)&&(pathwayFilter==='ALL'||p.pathway===pathwayFilter)&&(tierFilter==='ALL'||(p.schoolTier||'미분류')===tierFilter)&&(!onlyStars||stars.has(p.id))&&(!query||(`${p.name} ${p.pathText} ${p.region} ${p.birthplace}`).includes(query.trim()))),sort,sortDir,team());}
  function renderRows(){const list=filtered();return list.length?list.map(p=>`<button class="player-row ${selectedPlayer===p.id?'selected':''}" data-action="player" data-id="${p.id}" aria-pressed="${selectedPlayer===p.id}" aria-label="${p.name} ${C.ROLES[p.role]} 프로필"><span class="rank">${String(p.rank).padStart(2,'0')}</span><span><span class="p-name">${stars.has(p.id)?'★ ':''}${p.name} <span style="font-size:9px;font-weight:500;color:var(--muted)">${p.throwHand}투${p.batHand}타</span></span><span class="p-meta">${C.ROLES[p.role]} · ${p.school} · ${p.pathway}</span></span><span><span class="p-stat">${V.sortedStat(p,sort,team()).value}</span><span class="p-stat-label">${V.sortedStat(p,sort,team()).label}</span></span>${tag(C.fitLabel(p,team()),C.fit(p,team())>=80?'green':'')}</button>`).join(''):`<div class="empty">조건에 맞는 후보가 없습니다.<br><button class="ghost" data-action="clear-filters" style="margin-top:12px">필터 초기화</button></div>`;}
  function refreshRows(){const roster=$('#roster');if(roster){const y=roster.scrollTop;roster.innerHTML=renderRows();roster.scrollTop=y;$('#candidate-count').textContent=filtered().length+'명';}}
  function renderBiography(p){const cls={명문:'prestige',강호:'strong',중견:'middle',약소:'small'}[p.schoolTier]||'unknown';return `<section class="bio-panel" aria-label="선수 성장 배경"><div class="bio-grid"><div><span>생년월일</span><strong>${p.birthday}</strong></div><div><span>출생지 · 고교 연고와 별도</span><strong>${p.birthplace}</strong></div><div><span>현재·최종 소속 야구부 평판</span><strong class="tier-label ${cls}">${p.schoolTier||'미분류'}</strong></div><div><span>지역 1차 자격</span><strong>${p.regionalEligible?p.regionalRegion+' 대상':'대상 아님'}</strong></div></div><p class="bio-note">${p.regionalReason}</p><details class="history"><summary>진학·활동 이력 <span>⌄</span></summary><p class="path-text">${p.pathText}</p><ol>${p.history.map(h=>`<li><strong>${h.name}</strong><span>${h.start.slice(0,7)} ~ ${h.end?h.end.slice(0,7):'현재'} · ${h.status}</span>${h.note?`<small>${h.note}</small>`:''}</li>`).join('')}</ol></details>${p.schoolTier?`<p class="school-context">야구부 평판과 ${p.schoolStyle} 성향을 반영합니다. 평판은 평균적인 준비도와 팀 성적에 영향을 주지만 개인의 잠재력을 제한하지는 않습니다.${p.schoolTournament?'<br>가상 '+p.schoolTournament.event+' · '+p.schoolTournament.result:''}</p>`:'<p class="school-context">독립구단·해외 소속에는 국내 학교의 야구부 평판 등급을 적용하지 않습니다.</p>'}</section>`;}
  function renderProfile(){const p=C.playerById[selectedPlayer];if(!p)return '<div class="panel empty">프로필을 확인할 후보를 선택하십시오.</div>';const t=team(),r=p.record;const metrics=r.kind==='pitcher'?metric(r.era.toFixed(2),'평균자책점')+metric(C.innings(r.outs),'이닝')+metric(r.k,'탈삼진')+metric(r.bb,'볼넷'):metric(avg(r.avg),'타율')+metric(r.ops.toFixed(3),'OPS')+metric(r.hr,'홈런')+metric(r.sb,'도루');return `
    <article class="panel player-card"><div class="profile-header"><div class="profile-top"><div><span class="eyebrow muted" style="font-size:9px;margin-bottom:5px">SCOUT REPORT / NO.${String(p.rank).padStart(3,'0')}</span><h2>${p.name}</h2><p>${p.school} · ${p.pathway} · ${p.age}세 (만 나이)</p><p style="margin-top:5px">${p.currentInstitution.kind==='hs-club'?'고교 연령 클럽':p.qualification} · ${p.personality}</p></div><div class="jersey">${String(p.rank).padStart(2,'0')}</div></div><div class="profile-tags">${tag(C.ROLES[p.role])}${tag(`${p.height}cm / ${p.weight}kg`)}${tag(`${p.throwHand}투${p.batHand}타`)}${tag(p.archetype,'green')}</div></div>
    <div class="profile-body">${renderBiography(p)}${game.difficulty==='easy'?`<p class="favorite-note">선호 구단 · ${C.TEAMS[p.favoriteTeam].short} <small>이지 전용 · 계약 효과 없음</small></p>`:''}${p.proExperience?`<p class="notice">${p.proExperience.recordScope} · 해외 경력 ${p.proExperience.seasons}시즌<br>국내 프로 미입단자의 가상 복귀 지원. 리그 수준과 표본이 달라 기록의 직접 비교에 주의하세요.</p>`:''}<div class="section-head" style="margin:0"><span class="mini-heading">지명 전 시즌 기록</span><button class="ghost" style="font-size:10px;padding:5px 8px" data-action="star" data-id="${p.id}" aria-pressed="${stars.has(p.id)}">${stars.has(p.id)?'★ 관심 해제':'☆ 관심 등록'}</button></div><div class="metric-grid">${metrics}</div><p class="context-note">${p.pathway==='고졸'?'고교 대회 합산':['대졸','대학 얼리'].includes(p.pathway)?'대학 리그·대회 합산':p.pathway==='독립구단'?'독립리그':'해외 소속 리그'} · ${r.games}경기${r.kind==='hitter'?' · '+r.pa+'타석 · '+r.rbi+'타점 · '+r.runs+'득점':' · '+r.wins+'승'}<br>${C.DRAFT_DATE} 기준입니다. 서로 다른 경기 수준의 기록은 단순 비교에 주의해야 합니다.${r.kind==='pitcher'?'<br>이닝의 .1 / .2는 각각 ⅓ / ⅔이닝입니다.':''}</p>
    ${V.scoutTools(p)}<span class="mini-heading">경험 & 스카우팅</span><div class="awards">${p.awards.length?p.awards.map(x=>tag('✦ '+x,'orange')).join(''):tag('주요 대표팀·우승 경력 없음')}${r.kind==='pitcher'?tag('최고 '+p.velocity+'km/h','dark'):''}</div><div class="scout-row"><b>강점</b><span>${p.strength}</span></div><div class="scout-row risk"><b>과제</b><span>${p.weakness}</span></div><div class="outlook"><span>프로 적응 전망<br><strong>${C.outlook(p)}</strong></span><span>미래 가치 · 비확정<br><strong>${C.upsideLabel(p)}</strong></span></div><div class="fit-box"><strong>${t.short} 적합도 · ${C.fitLabel(p,t)}</strong><br>${C.fit(p,t)>=60?`보강 우선순위 ${t.needs.indexOf(p.role)+1}번, ${C.ROLES[p.role]} 자원입니다.`:'주요 보강 포지션은 아닙니다. 재능 우선 지명을 고려할 수 있습니다.'}</div><details class="advice" open><summary><span class="advisor-mark">SC</span> 스카우트 팀장의 조언 <span class="muted">⌄</span></summary><ul>${C.scoutAdvice(p,game).lines.map(line=>`<li>${escape(line)}</li>`).join('')}</ul><p>공개된 스카우팅과 현재 후보군에 근거한 의견 · 정답 아님</p></details><button class="primary lime" data-action="pick" data-id="${p.id}">${p.name} 지명하기 <span class="arrow">→</span></button></div></article>`;}
  function renderMyPicks(){const mine=C.myPicks(game);return `<section class="panel my-picks"><h3>우리 팀 지명 보드 <span class="muted">${mine.length}/${C.ROUNDS+(game.local?1:0)}</span></h3>${mine.length?mine.map(s=>{const p=C.playerById[s.playerId];return `<div class="my-pick">${tag(s.label)}<strong>${p.name}</strong><span>${C.ROLES[p.role]}</span><span class="muted">${p.school}</span></div>`;}).join(''):'<p class="tiny muted">첫 번째 유니폼의 주인공을 기다립니다.</p>'}</section>`;}
  function renderLog(){return `<details class="panel log"><summary>전체 구단 지명 기록 <span class="muted">${game.picks.length}명</span></summary><div class="log-list">${game.picks.length?game.picks.map(s=>{const p=C.playerById[s.playerId],t=C.teamById[s.teamId];return `<div class="log-item"><span class="muted">${s.label}</span><strong style="color:${t.color}">${t.short}</strong><span>${p.name} · ${C.ROLES[p.role]}</span>${s.teamId===game.teamId?tag('YOU','green'):''}</div>`;}).join(''):'<p class="tiny muted">아직 지명된 선수가 없습니다.</p>'}</div></details>`;}
  function resultHero(eyebrow,title,desc){return `<section class="hero fade-in"><div class="hero-copy"><span class="eyebrow">${eyebrow}</span><h1>${title}</h1><p>${desc}</p></div><div class="hero-numbers"><div class="hero-number"><b>${team().short}</b><span>${game.local?'지역 1차 ON':'지역 1차 OFF'} · ${C.myPicks(game).length}명 지명</span></div></div></section>`;}
  function renderInterviews(){return `${resultHero('DRAFT COMPLETE / FIRST WORDS','새로운 유니폼, 첫 번째 인사.','드래프트가 끝났습니다. 단장의 방향을 설명하고, 신인들의 이야기를 들어볼 시간입니다.')} ${V.gm(game)}<div class="section-head"><h2>신인 선수 입단 인터뷰</h2><p>선수의 출신과 성장 전망에 따른 가상 인터뷰</p></div><section class="quote-grid">${C.myPicks(game).map(s=>{const p=C.playerById[s.playerId];return `<article class="panel quote-card"><div class="quote-name">${tag(s.label,'green')}${tag(C.ROLES[p.role])}</div><h3>${p.name}</h3><p class="tiny muted">${p.pathText}</p><blockquote>${C.interview(p,s,game,'ceremony')}</blockquote><div class="scout-row"><b>육성</b><span>${C.outlook(p)} · ${p.personality}</span></div></article>`;}).join('')}</section>${renderLog()}<div class="section-action"><button class="primary" data-action="simulate" ${game.gmChoice?'':'disabled'}>${game.career?'진행 중인 시즌으로 돌아가기':'2027 루키 시즌 진행'} <span class="arrow">→</span></button><p>${game.gmChoice?'실력 · 출전 기회 · 성장 · 컨디션 변동을 함께 반영합니다.':'위 단장 인터뷰의 답변을 먼저 확정해야 합니다.'}</p></div>`;}
  function statMetrics(v){return v.kind==='pitcher'?metric(v.games,'경기')+metric(C.innings(v.outs),'이닝')+metric(v.era==null?'—':v.era.toFixed(2),'ERA')+metric(v.k,'탈삼진')+metric(v.wins,'승')+metric(v.bb,'볼넷'):metric(v.games,'경기')+metric(avg(v.avg),'타율')+metric(v.ops==null?'—':v.ops.toFixed(3),'OPS')+metric(v.hr,'홈런')+metric(v.rbi,'타점')+metric(v.sb,'도루');}
  function renderSeasonCards(){return `<section class="season-list">${game.season.map(s=>{const p=C.playerById[s.playerId],v=s.stats,f=s.futures;return `<article class="panel season-card"><div class="season-header"><div class="quote-name">${tag(s.label,'green')} ${tag(C.ROLES[p.role])} ${tag(s.routeLabel,s.route==='regular'?'orange':'')}${s.route==='regular'&&Number(s.label[0])>=4?tag('후반 지명의 반전','lime'):''}</div><h3>${p.name}</h3><p class="tiny muted">${p.school} · ${p.pathway}<br>입단 당시 계획: ${s.target}</p></div><div class="season-body"><span class="mini-heading">1군 정규시즌 기록</span>${v.games?`<div class="metric-grid">${statMetrics(v)}</div><p class="context-note">${v.kind==='hitter'?v.pa+'타석':v.holds+'홀드 · '+v.saves+'세이브'} · ${s.route==='cameo'?'표본이 작습니다. 성적보다 경험에 주목할 필요가 있습니다.':'첫해 성적만으로 미래를 단정할 수는 없습니다.'}</p>`:'<div class="no-debut"><b>1군 미데뷔</b><p>첫해를 퓨처스에서 보냈습니다.<br>기록 없음은 0점 성적표가 아닙니다.</p></div>'}<p class="season-note">${s.note}</p><div class="futures-block"><h4>퓨처스리그 기록 <span class="tag">육성 리포트</span></h4><div class="metric-grid">${statMetrics(f)}</div><p class="context-note">${f.kind==='hitter'?f.pa+'타석 · ':''}1군과 경기 수준이 다르므로 숫자의 직접 비교에는 주의가 필요합니다.</p></div><div class="growth"><span>↗ ${s.growthLabel}</span><em>계획 이행 ${s.planScore}점</em></div><p class="development-focus">${s.developmentNote}</p></div></article>`;}).join('')}</section>`;}
  function renderSeason(){return W.season(game,yearIndex);}
  function renderOwner(){return W.review(game);}
  function renderLegacySeason(){const major=game.season.filter(s=>s.stats.games>0).length,regular=game.season.filter(s=>s.route==='regular').length;return `${resultHero('ONE YEAR LATER / THE LONG GAME','성장은, 보이지 않는 곳에서도.','첫해의 무대는 저마다 다릅니다. 1군 기록이 없는 선수도 퓨처스에서 어떤 과제를 해결했는지 확인할 수 있습니다.')}<div class="season-summary"><div><b>${game.season.length}</b><span>우리 팀 신인</span></div><div><b>${game.season.length-major}</b><span>퓨처스 전념</span></div><div><b>${major}</b><span>1군 경험 · 안착 포함</span></div><div><b>${regular}</b><span>그중 1군 안착</span></div></div><div class="section-head"><h2>루키 시즌 · 1군과 퓨처스</h2><p>같은 게임에서는 결과 고정</p></div><p class="season-count-note">준비도와 적응, 출전 기회가 1군 진입을 좌우합니다. 지명 라운드가 능력치를 직접 깎지는 않습니다. 드문 반전도 있지만, 대부분은 기다림이 필요합니다.</p>${renderSeasonCards()}<p class="footnote">기록은 간단한 게임용 모델의 시뮬레이션이며 실제 KBO 성적 예측이 아닙니다. 이닝의 .1 / .2는 각각 ⅓ / ⅔이닝입니다.</p><div class="section-action"><button class="primary" data-action="owner">구단주 면담실로 <span class="arrow">→</span></button><button class="ghost" data-action="interviews" style="margin-top:12px">입단 인터뷰 다시 보기</button></div>`;}
  function renderLegacyOwner(){const o=game.owner;return `${resultHero('OWNER’S OFFICE / FINAL REVIEW','단장님, 수고하셨습니다.','보강 과제, 첫해 육성 계획, 미래 가치. 1군 미데뷔만으로 신인을 실패라고 평가하지 않습니다.')}<section class="owner-layout"><div class="grade-panel"><span class="eyebrow">DRAFT EVALUATION</span><div class="grade-letter">${o.grade}</div><div class="score">${o.score} <span class="muted">/ 100</span></div><p>${o.grade==='A'?'현재와 미래를 함께 채운 지명':o.grade==='B'?'방향이 보이는 유망한 지명':o.grade==='C'?'성장과 활용이 더 필요한 지명':'보강 전략을 돌아볼 지명'}</p></div><div class="panel pad"><div class="score-row"><div class="score-label"><strong>보강 과제 달성 <small>40%</small></strong><b>${o.needScore}점</b></div><div class="score-track"><div class="score-fill" style="width:${o.needScore}%"></div></div></div><div class="score-row"><div class="score-label"><strong>첫해 계획 이행 <small>25%</small></strong><b>${o.production}점</b></div><div class="score-track"><div class="score-fill" style="width:${o.production}%"></div></div></div><div class="score-row"><div class="score-label"><strong>미래 가치 · 성장 <small>35%</small></strong><b>${o.future}점</b></div><div class="score-track"><div class="score-fill" style="width:${o.future}%"></div></div></div><div class="owner-quote"><span class="eyebrow">MESSAGE FROM THE OWNER</span>“${o.text}”<p class="tiny muted" style="margin-top:10px">${o.missing.length?'남은 보강 과제: '+o.missing.join(' · '):'세 가지 우선 보강 포지션을 모두 확보했습니다.'}</p></div></div></section>${V.pledge(game)}<div class="evaluation-note">${o.planMessage}</div><p class="footnote">기본 평가: 보강 40% + 첫해 계획 이행 25% + 미래 가치·성장 35%. 단장 인터뷰의 약속 이행에 최대 ±4점을 별도로 반영합니다. 팬심 점수 자체를 합산하지 않습니다. 보강 1·2·3순위 확보에 50·30·20점. 육성형 선수는 퓨처스의 기술 발전을, 1군 경쟁 후보는 성장과 실제 기회 확보를 함께 봅니다. 미래 가치는 게임 내부의 성장 여력과 관찰된 발전을 사용합니다.</p><div class="result-actions"><button class="primary" data-action="download">결과 카드 저장 ↓</button><button class="ghost" data-action="season">1년차 기록 다시 보기</button><button class="ghost" data-action="reset">새 드래프트 시작</button></div>${renderMyPicks()}${renderLog()}`;}
  function showModal(kind,data={}) {
    lastFocus=document.activeElement;modal={kind,...data};
    let title='',body='';
    if(kind==='confirm') {const p=C.playerById[data.id],slot=game.schedule[game.cursor];title='지명을 확정하시겠습니까?';body=`${tag(labelRound(slot),'green')}<h3>${p.name}</h3><p>${p.school} · ${C.ROLES[p.role]} · ${p.throwHand}투${p.batHand}타</p><div class="modal-note"><p>${C.fitLabel(p,team())} · ${C.outlook(p)}<br>지명 후에는 취소할 수 없습니다. 다른 구단의 다음 지명은 자동으로 진행됩니다.</p></div><div class="modal-actions"><button class="ghost" data-action="close-modal">돌아가기</button><button class="primary" data-action="confirm-pick" data-id="${p.id}">지명 확정</button></div>`;}
    if(kind==='interview'){const p=C.playerById[data.selection.playerId];title=data.selection.round===0?'지역 1차 지명 · 현장 인터뷰':'1라운드 지명 · 현장 인터뷰';body=`<span class="eyebrow muted">WELCOME TO ${team().short}</span><h3>${C.ko.p(p.name,'이/가')} ${team().short} 유니폼을 입었습니다.</h3><p class="tiny muted">${p.school} · ${C.ROLES[p.role]}</p><div class="modal-note"><span class="eyebrow">감독의 한마디</span><p>“${C.coach(p,game)}”</p></div><div class="modal-note"><span class="eyebrow">선수의 첫 소감</span><p>“${C.interview(p,data.selection,game)}”</p></div>${V.newsCard(game.news.find(n=>n.overall===data.selection.overall))}<button class="primary" data-action="close-modal">다음 지명으로 <span class="arrow">→</span></button>`;}
    if(kind==='scout'){title='지명 전 스카우트 추천 · 고정 보고서';body=X.briefing(game,true);}
    if(kind==='mock'){title='지명 전 모의 드래프트 · 고정 예측';body=V.forecasts(game,true);}
    if(kind==='news'){title='드래프트 뉴스룸';body=V.newsRoom(game);}
    if(kind==='fans'){title='팬심 변화 내역';body=V.fanHistory(game);}
    if(kind==='reset'){title='새 드래프트를 시작하시겠습니까?';body='<p>현재 지명 결과와 시즌 성적은 초기화됩니다. 필요하면 구단주 평가 화면에서 결과 카드를 먼저 저장할 수 있습니다.</p><div class="modal-actions"><button class="ghost" data-action="close-modal">취소</button><button class="primary" data-action="confirm-reset">초기화하고 팀 선택</button></div>';}
    if(kind==='catalog'){title=`가상 소속 명단 · ${C.catalog.length}개`;body=`<p>게임 속 야구부 평판입니다. 실존 학교의 학업 수준이나 실제 야구 전력을 평가한 자료가 아닙니다. v0.3.1에는 사용자가 다시 정한 이름을 적용했습니다. 원안은 최초 요청 명칭이며, 이름을 바꾸더라도 소속 ID와 지역·평판은 유지합니다.</p><div class="catalog-list">${['high-school','hs-club','college','independent','overseas-college','overseas-pro','overseas-independent'].map(kind=>`<details><summary>${{'high-school':'고교','hs-club':'고교 연령 클럽','college':'국내 대학','independent':'독립구단','overseas-college':'해외 대학','overseas-pro':'해외 프로 구단','overseas-independent':'해외 독립 구단'}[kind]} · ${C.catalog.filter(s=>s.kind===kind).length}개</summary><ul>${C.catalog.filter(s=>s.kind===kind).map(s=>`<li><strong>${s.name}</strong><span>${s.region||s.country} · ${s.tier||'미분류'}${s.kind==='overseas-college'&&s.weight===2?' · 낮은 등장 확률':''}</span>${s.original&&s.name!==s.original?`<small>원안: ${s.original}</small>`:''}</li>`).join('')}</ul></details>`).join('')}</div><p class="context-note">V0.6 추가 소속은 게임용 가상 설정이며 실존·등록 여부를 전수 검증하지 않았습니다. 국내 프로 10개 구단은 그대로 유지합니다.</p><button class="primary" data-action="close-modal">확인</button>`;}
    if(kind==='career'){title='선수 경력 기록';body=W.profile(game,data.id);}
    if(kind==='rules'){title='DRAFT ROOM V0.6 · 플레이 가이드';body=W.guide();}
    if(kind==='import'){title='진행 파일을 불러올까요?';body='<p>검증을 통과한 V0.6 진행 파일입니다. 현재 진행을 대체합니다. 필요하면 먼저 취소하고 현재 진행 파일을 저장해 주세요.</p><button class="primary" data-action="confirm-import">불러오기 확정</button><button class="ghost" data-action="close-modal">취소</button>';}
    $('#modal-root').innerHTML=`<div class="overlay" data-action="overlay-close"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title">${title}</h2><button class="modal-close" data-action="close-modal" aria-label="닫기">×</button></div><div class="modal-body">${body}</div></section></div>`;
    $('#main').inert=true;$('#page-header').inert=true;$('#page-footer').inert=true;
    $('.modal button')?.focus();
  }
  function closeModal(){modal=null;$('#modal-root').innerHTML='';$('#main').inert=false;$('#page-header').inert=false;$('#page-footer').inert=false;if(lastFocus?.isConnected)lastFocus.focus();}
  function resetFilters(){pickTypeFilter='ALL';roleFilter='ALL';pathwayFilter='ALL';tierFilter='ALL';query='';sort='rank';sortDir='asc';onlyStars=false;}
  function scrollTop(){clearTimeout(toastTimer);$('#toast').hidden=true;try{window.scrollTo({top:0,behavior:'smooth'});}catch(e){}}
  function downloadResult(){
    const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=650+game.season.length*230;const x=canvas.getContext('2d');
    if(!x){notify('이 브라우저에서는 결과 이미지 저장을 지원하지 않습니다.');return;}
    const t=team(),o=game.owner;
    x.fillStyle='#f3f5f7';x.fillRect(0,0,1080,canvas.height);x.fillStyle='#14263f';x.fillRect(0,0,1080,350);
    function text(s,left,top,size,color='#17263a',weight=700){x.fillStyle=color;x.font=`${weight} ${size}px sans-serif`;x.fillText(s,left,top,960);}
    text('DRAFT ROOM / KBO EDITION',60,69,24,'#d7f564');text(t.name+' 드래프트',60,143,48,'#ffffff');text(`${C.rules.DIFFICULTIES[game.difficulty].name} · ${game.local?'지역 1차 ON':'지역 1차 OFF'} · 팬심 ${C.fanState(game).score}/100`,60,189,22,'#bac9db',500);
    text('첫해 구단주 평가',60,267,23,'#bac9db');text(`${o.grade}  /  ${o.score}점`,60,321,44,'#d7f564');
    let y=390;
    game.season.forEach(s=>{const p=C.playerById[s.playerId],v=s.stats,f=s.futures;x.fillStyle='#ffffff';x.fillRect(50,y,980,210);text(s.label+'  '+p.name+'  |  '+C.ROLES[p.role]+' · '+s.routeLabel,76,y+38,28);text(p.school+' · '+p.pathway,76,y+68,19,'#697586',500);const line=!v.games?'1군 미데뷔 · 퓨처스에서 첫해를 보냈습니다.':v.kind==='pitcher'?`1군 ${v.games}경기 · ${C.innings(v.outs)}이닝 · ERA ${v.era.toFixed(2)}`:`1군 ${v.games}경기 · AVG ${avg(v.avg)} · OPS ${v.ops.toFixed(3)}`;text(line,76,y+106,24);const farm=f.kind==='pitcher'?`퓨처스 ${f.games}경기 · ${C.innings(f.outs)}이닝 · ERA ${(f.era==null?'—':f.era.toFixed(2))}`:`퓨처스 ${f.games}경기 · AVG ${avg(f.avg)} · ${f.hr}홈런`;text(farm,76,y+140,22,'#667b54');text('↗ '+s.growthLabel+'  /  계획 이행 '+s.planScore+'점',76,y+180,21,'#52763c');y+=230;});
    text(`보강 ${o.needScore} / 계획 이행 ${o.production} / 미래 ${o.future} / 약속 ${o.pledge.bonus>0?'+':''}${o.pledge.bonus}`,60,y+35,26);text('가상 선수·전력·기록을 사용한 비공식 팬메이드 프로토타입',60,canvas.height-72,19,'#697586',500);text('DRAFT ROOM v0.6 · 실제 KBO 성적 예측이 아닙니다.',60,canvas.height-38,17,'#697586',500);
    try{const a=document.createElement('a');a.download=`draft-room-v06-first-year-${t.id}-${o.grade}.png`;a.href=canvas.toDataURL('image/png');document.body.appendChild(a);a.click();a.remove();notify('결과 이미지 다운로드를 요청했습니다.');}catch(e){notify('다운로드가 제한되면 별도 HTML 파일을 브라우저에서 열면 저장할 수 있습니다.');}
  }
  function exportSave(){if(!game)return;const data={format:'draft-room-v06',version:6,game,stars:[...stars]};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`draft-room-v06-${game.teamId}-${game.career?.years.at(-1)?.year||'draft'}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('진행 파일 다운로드를 요청했습니다.');}
  async function importSave(file){if(!file)return;try{if(file.size>5000000)throw Error('파일 크기 초과');const data=JSON.parse(await file.text());if(data.format!=='draft-room-v06'||data.version!==6||!C.validate(data.game))throw Error('저장 검증 실패');showModal('import',{incoming:data});}catch(err){notify('불러올 수 없습니다. V0.6 진행 JSON만 지원합니다. V0.5와는 호환되지 않습니다.');}finally{$('#import-file').value='';}}
  document.addEventListener('click',e=>{
    const btn=e.target.closest('[data-action]');if(!btn||btn.disabled)return;
    const action=btn.dataset.action,id=btn.dataset.id;
    try {
      if(action==='export-save')exportSave();
      if(action==='import-save')$('#import-file').click();
      if(action==='confirm-import'&&modal?.incoming){const data=modal.incoming;closeModal();game=data.game;selectedTeam=game.teamId;local=game.local;difficulty=game.difficulty;stars=new Set((Array.isArray(data.stars)?data.stars:[]).filter(id=>typeof id==='string'&&Object.hasOwn(C.poolFor(game).byId,id)));recordsOpen=false;selectedPlayer=null;yearIndex=(game.career?.years.length||1)-1;resetFilters();if(game.phase==='draft')C.advanceToUser(game);render();refreshRows();scrollTop();notify('진행 파일을 복원했습니다.');}
      if(action==='records'||action==='team-records'){recordsOpen=true;if(action==='team-records'){recordFilters.team=id;recordFilters.scope='origin';}render();scrollTop();}
      if(action==='records-close'){recordsOpen=false;render();refreshRows();scrollTop();}
      if(action==='career-player')showModal('career',{id});
      if(action==='view-year'){yearIndex=Number(btn.dataset.index);render();scrollTop();}
      if(action==='next-season'){if(Date.now()-lastAdvance<900)return;lastAdvance=Date.now();C.nextSeason(game);yearIndex=game.career.years.length-1;recordsOpen=false;render();scrollTop();}

      if(action==='team'){selectedTeam=id;render();}
      if(action==='difficulty'&&!game){difficulty=id;render();document.querySelector(`[data-action="difficulty"][data-id="${id}"]`)?.focus();}
      if(action==='start'){recordsOpen=false;yearIndex=0;lastAdvance=0;stars.clear();game=C.createGame(selectedTeam,local,setupSeed,difficulty);resetFilters();selectedPlayer=null;render();scrollTop();}
      if(action==='scout-briefing'){C.openScouting(game);render();scrollTop();}
      if(action==='scout-archive')showModal('scout');
      if(action==='pick-type'){pickTypeFilter=id;render();refreshRows();}
      if(action==='begin-draft'){C.beginDraft(game);C.advanceToUser(game);render();refreshRows();scrollTop();}
      if(action==='mock-archive')showModal('mock');
      if(action==='news-room')showModal('news');
      if(action==='fan-history')showModal('fans');
      if(action==='gm-choice'){C.chooseGM(game,id);render();document.querySelector('.gm-section')?.scrollIntoView({behavior:'smooth',block:'start'});}
      if(action==='sort-direction'){sortDir=sortDir==='asc'?'desc':'asc';btn.textContent=sortDir==='asc'?'↑ 오름차순':'↓ 내림차순';refreshRows();}
      if(action==='player'){selectedPlayer=id;refreshRows();$('#profile').innerHTML=renderProfile();if(window.innerWidth<=700)$('#profile').scrollIntoView({behavior:'smooth',block:'start'});}
      if(action==='role'){roleFilter=id;render();refreshRows();}
      if(action==='only-stars'){onlyStars=!onlyStars;render();refreshRows();}
      if(action==='clear-filters'){resetFilters();render();refreshRows();}
      if(action==='star'){stars.has(id)?stars.delete(id):stars.add(id);refreshRows();$('#profile').innerHTML=renderProfile();save();}
      if(action==='pick'&&game?.phase==='draft'){showModal('confirm',{id});}
      if(action==='confirm-pick'&&modal?.kind==='confirm'&&game?.phase==='draft'){
        closeModal();const selection=C.addPick(game,id),name=C.playerById[id].name;C.advanceToUser(game);selectedPlayer=null;const previousSort=sort,previousDir=sortDir;resetFilters();sort=previousSort;sortDir=previousDir;render();refreshRows();scrollTop();
        if(selection.round<=1)showModal('interview',{selection});else notify(name+' 선수를 지명했습니다.');
      }
      if(action==='simulate'){C.runSeason(game);yearIndex=game.career.years.length-1;recordsOpen=false;render();scrollTop();}
      if(action==='owner'){game.phase='owner';recordsOpen=false;render();scrollTop();}
      if(action==='season'){game.phase='season';recordsOpen=false;render();scrollTop();}
      if(action==='interviews'){game.phase='interviews';render();scrollTop();}
      if(action==='rules')showModal('rules');
      if(action==='catalog')showModal('catalog');
      if(action==='reset')showModal('reset');
      if(action==='confirm-reset'){closeModal();recordsOpen=false;yearIndex=0;setupSeed=Date.now()+'-'+Math.random();game=null;selectedPlayer=null;stars.clear();resetFilters();render();scrollTop();}
      if(action==='close-modal')closeModal();
      if(action==='overlay-close'&&e.target===btn)closeModal();
      if(action==='download')downloadResult();
    }catch(err){console.error(err);notify('진행 중 문제가 생겼습니다. 현재 화면에서 다시 시도할 수 있습니다.');}
  });
  document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;refreshRows();}});
  document.addEventListener('change',e=>{if(e.target.id==='import-file'){importSave(e.target.files[0]);return;}if(e.target.id.startsWith('record-')){recordFilters[e.target.id.slice(7)]=e.target.value;render();return;}if(e.target.id==='local-toggle'){local=e.target.checked;render();$('#local-toggle')?.focus();}if(e.target.id==='sort'){sort=e.target.value;sortDir=C.rules.SORTS[sort].direction;document.querySelector('[data-action="sort-direction"]').textContent=sortDir==='asc'?'↑ 오름차순':'↓ 내림차순';refreshRows();}if(e.target.id==='pathway'){pathwayFilter=e.target.value;refreshRows();}if(e.target.id==='tier'){tierFilter=e.target.value;refreshRows();}});
  document.addEventListener('keydown',e=>{
    if(!modal)return;
    if(e.key==='Escape'){e.preventDefault();closeModal();}
    if(e.key==='Tab'){const els=[...document.querySelectorAll('.modal button,.modal input,.modal select,.modal summary,.modal [tabindex="0"]')].filter(x=>!x.disabled);const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
  });
  render();refreshRows();
})();
</script>
</body>
</html>
