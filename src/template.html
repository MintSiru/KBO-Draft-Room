<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f2ec">
<meta name="description" content="가상의 KBO 신인 드래프트를 진행하고 지명한 선수들의 10년 경력을 시뮬레이션합니다.">
<title>드래프트 룸 v1.0.1 — KBO 신인 드래프트</title>
<style>
/* BUILD:STYLES */
</style>
</head>
<body>
<header class="masthead" id="page-header">
  <div class="wrap">
    <div class="wordmark"><b>드래프트 룸</b><span>KBO 신인 드래프트 시뮬레이션</span></div>
    <nav aria-label="게임 메뉴">
      <button class="btn quiet small" data-action="import-save">불러오기</button>
      <button class="btn quiet small" data-action="rules">가이드</button>
      <button class="btn quiet small" data-action="catalog">소속 명단</button>
      <button class="btn quiet small" data-action="reset" id="reset-game" hidden>새 게임</button>
    </nav>
  </div>
</header>
<div class="wrap"><ol class="steps" id="steps" aria-label="진행 단계"></ol></div>
<main class="wrap" id="main"></main>
<footer class="colophon" id="page-footer">
  <div class="wrap">
    <span>팬메이드 게임입니다. 구단명 외의 선수·학교·기록·전력은 모두 가상입니다.</span>
    <span id="storage-status"></span>
  </div>
</footer>
<input type="file" id="import-file" accept=".json,application/json" hidden aria-label="진행 파일 선택">
<div id="modal-root"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<noscript><p style="padding:24px">이 게임을 실행하려면 JavaScript를 허용해 주세요.</p></noscript>
<!-- BUILD:SCRIPTS -->
</body>
</html>
